<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Мой говорящий Гаппо</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Unbounded:wght@600;800&display=swap">
<style>
/* Layout: a phone-shaped stage. The canvas room fills it, the HUD floats on top,
   the action tray and room tabs dock at the bottom. Everything wears a thick ink
   outline, like the cartoon hippo it frames. */
:root{
  --ink:#2b1d3a;
  --ink-soft:rgba(43,29,58,.16);
  --paper:#fff5e4;
  --paper-deep:#ffe6bf;
  --sun:#ffc23d;
  --berry:#ff5a8a;
  --leaf:#3fbf74;
  --lagoon:#35c2d6;
  --backdrop:#241a33;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
  --bot:160px;
  color-scheme:light;
  padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%}
body{
  height:100%;margin:0;overflow:hidden;
  background:var(--backdrop);
  background-image:radial-gradient(rgba(255,245,228,.07) 1.5px,transparent 1.6px);
  background-size:22px 22px;
  color:var(--ink);font:700 15px/1.3 var(--f-body);
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--lagoon);outline-offset:2px}

.stage{position:relative;height:100%;max-width:500px;margin-inline:auto;overflow:hidden;isolation:isolate;background:#ffd8a8}
@media (min-width:540px){.stage{border-inline:3px solid var(--ink);box-shadow:0 0 0 6px rgba(255,245,228,.06)}}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- HUD ---------- */
.hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:12px 16px 0;pointer-events:none}
.hud>*{pointer-events:auto}
.lvl{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.lvl-badge{
  flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background:var(--sun);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);
  font:800 17px/1 var(--f-display);font-variant-numeric:tabular-nums;
}
.lvl-meta{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1;max-width:170px}
.lvl-name{font:800 13px/1 var(--f-display);letter-spacing:.02em;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:4px 9px;align-self:flex-start;white-space:nowrap}
.xp{height:12px;border-radius:999px;background:var(--paper);border:2px solid var(--ink);overflow:hidden}
.xp i{display:block;height:100%;width:0;background:var(--leaf);border-right:2px solid var(--ink);transition:width .4s}
.pill{display:flex;align-items:center;gap:6px;height:38px;padding:0 12px 0 6px;border-radius:999px;background:var(--paper);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);font:800 15px/1 var(--f-display);font-variant-numeric:tabular-nums}
.pill svg{width:26px;height:26px}
.pill.is-shake{animation:shake .4s}
.round{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:0}
.round svg{width:20px;height:20px}
.round:active,.pill:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}

.needs{position:absolute;top:66px;left:16px;right:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;pointer-events:none}
.need{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0}
.ring{
  --p:50;--c:var(--leaf);
  width:48px;height:48px;border-radius:50%;position:relative;display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(43,29,58,.18) 0);
  border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);
}
.ring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--paper);border:2px solid var(--ink)}
.ring svg{position:relative;width:22px;height:22px}
.need span{font-size:11px;font-weight:900;letter-spacing:.03em;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:1px 7px;white-space:nowrap}
.need.is-low .ring{animation:pulse 1s infinite}
.need.is-call .ring{animation:shake .5s 2}

/* ---------- speech bubble ---------- */
.bubble{
  position:absolute;left:0;top:0;max-width:min(230px,62%);padding:9px 14px;
  background:#fff;border:3px solid var(--ink);border-radius:20px 20px 20px 6px;box-shadow:0 4px 0 var(--ink);
  font:800 16px/1.2 var(--f-body);pointer-events:none;opacity:0;transform-origin:0 100%;
  transition:opacity .15s, transform .2s cubic-bezier(.3,1.6,.5,1);transform:translate(0,-100%) scale(.6);
  overflow-wrap:anywhere;
}
.bubble.is-show{opacity:1;transform:translate(0,-100%) scale(1)}
.bubble.is-flip{border-radius:20px 20px 6px 20px;transform-origin:100% 100%}

/* ---------- mic + talk ---------- */
.mic-wrap{position:absolute;right:16px;bottom:calc(var(--bot) + 12px);display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.mic{
  --lvl:0;position:relative;width:62px;height:62px;border-radius:50%;padding:0;display:grid;place-items:center;
  background:var(--lagoon);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);
}
.mic svg{width:28px;height:28px}
.mic::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px solid var(--lagoon);opacity:0;transform:scale(calc(1 + var(--lvl)*.5));transition:transform .08s}
.mic.is-on{background:var(--berry)}
.mic.is-on::after{opacity:.9;border-color:var(--berry)}
.mic.is-on .ico-mic{animation:pulse 1.4s infinite}
.mic .ico-keys{display:none}
.mic.is-blocked .ico-mic{display:none}
.mic.is-blocked .ico-keys{display:block}
.mic:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.keys{width:44px;height:44px}
.mic-hint{
  position:absolute;right:76px;bottom:12px;width:max-content;max-width:170px;padding:7px 11px;
  background:var(--ink);color:var(--paper);border-radius:14px;font-size:13px;font-weight:800;line-height:1.2;
  pointer-events:none;animation:bob 1.6s ease-in-out infinite;
}
.mic-hint::after{content:"";position:absolute;right:-7px;bottom:16px;border:8px solid transparent;border-left-color:var(--ink);border-right:0}

.talkbar{
  position:absolute;left:16px;right:16px;bottom:calc(var(--bot) + 12px);display:flex;gap:8px;padding:8px;
  background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink);z-index:5;
}
.talkbar input{flex:1;min-width:0;border:2px solid var(--ink);border-radius:14px;padding:10px 12px;font:700 16px var(--f-body);background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
.talkbar input::placeholder{color:rgba(43,29,58,.5)}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;
  border-radius:16px;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);background:var(--sun);
  font:800 15px/1 var(--f-body);white-space:nowrap;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.is-quiet{background:var(--paper)}
.btn-x{flex:none;width:44px;padding:0;font:900 22px/1 var(--f-body)}

/* ---------- bottom dock ---------- */
.bottom{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column}
.tray{
  margin:0 12px 10px;min-height:100px;padding:10px;display:flex;align-items:center;gap:10px;overflow-x:auto;overscroll-behavior-x:contain;
  background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);
  scrollbar-width:none;
}
.tray::-webkit-scrollbar{display:none}
.tool{
  flex:none;position:relative;width:74px;height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 2px 6px;
  background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);touch-action:pan-x;
}
.tool canvas{width:44px;height:44px;pointer-events:none}
.tool span{font-size:12px;font-weight:900;line-height:1.05;text-align:center;white-space:nowrap}
.tool:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tool.is-on{background:var(--sun)}
.tool.is-glow{background:var(--sun);animation:bob 1.2s ease-in-out infinite}
.tool:disabled{opacity:.55;cursor:default}
.tool .price{position:absolute;top:-9px;right:-7px;min-width:26px;height:22px;padding:0 6px;border-radius:999px;display:grid;place-items:center;background:var(--sun);border:2px solid var(--ink);font:800 11px/1 var(--f-display);font-variant-numeric:tabular-nums}
.tool .price.is-free{background:var(--leaf);color:#fff;font-family:var(--f-body);font-weight:900}
.tool.is-wide{width:auto;min-width:120px;flex-direction:row;gap:8px;padding:6px 14px}
.tool.is-wide span{font-size:14px;text-align:left;white-space:normal}
.tool.is-wide small{display:block;font-size:11px;font-weight:800;opacity:.7}
.tray-hint{flex:1;min-width:0;font-size:12.5px;font-weight:800;line-height:1.25;color:rgba(43,29,58,.75);padding-inline:4px}
.tray.is-food{padding-top:16px}

.rooms{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px 8px 10px;background:var(--ink)}
.room-btn{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border:0;border-radius:14px;background:none;color:var(--paper);font-size:11px;font-weight:900;letter-spacing:.02em}
.room-btn svg{width:26px;height:26px}
.room-btn[aria-current="page"]{background:var(--sun);color:var(--ink)}
.room-btn.is-alert::after{content:"";position:absolute;top:3px;right:calc(50% - 19px);width:10px;height:10px;border-radius:50%;background:var(--berry);border:2px solid var(--paper)}

/* ---------- sheets & modals ---------- */
.sheet{
  position:absolute;left:0;right:0;bottom:0;max-height:56%;display:flex;flex-direction:column;z-index:6;
  background:var(--paper);border-top:3px solid var(--ink);border-radius:26px 26px 0 0;box-shadow:0 -4px 0 rgba(43,29,58,.25);
  padding:14px 16px 16px;
}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheet-head h2{margin:0;font:800 18px/1 var(--f-display);flex:1;text-wrap:balance}
.seg{display:flex;border:3px solid var(--ink);border-radius:14px;overflow:hidden}
.seg button{border:0;background:#fff;padding:8px 12px;font-weight:900;font-size:13px}
.seg button[aria-selected="true"]{background:var(--sun)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;overflow-y:auto;padding:4px 2px 8px;overscroll-behavior:contain}
.card{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px 10px;background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink)}
.card canvas{width:58px;height:58px}
.card b{font-size:13px;font-weight:900}
.card small{font:800 11px/1 var(--f-display);padding:4px 8px;border-radius:999px;background:var(--paper-deep);border:2px solid var(--ink)}
.card.is-worn{background:#fff3c7}
.card.is-worn small{background:var(--leaf);color:#fff;font-family:var(--f-body);font-weight:900}
.card.is-locked{opacity:.6}
.card:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

.modal{position:absolute;inset:0;z-index:8;display:grid;place-items:center;padding:16px;background:rgba(36,26,51,.55)}
.modal-card{
  width:min(340px,100%);padding:22px 20px 18px;text-align:center;
  background:var(--paper);border:3px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);
  animation:pop .35s cubic-bezier(.3,1.6,.5,1);
}
.modal-eyebrow{margin:0 0 6px;font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--berry)}
.modal-card h2{margin:0 0 10px;font:800 26px/1.1 var(--f-display);text-wrap:balance}
.modal-body{font-size:15px;line-height:1.4}
.modal-body .big{font:800 54px/1 var(--f-display);font-variant-numeric:tabular-nums;margin:4px 0 8px}
.modal-body ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.modal-body li{padding:4px 10px;border-radius:999px;background:#fff;border:2px solid var(--ink);font-size:13px;font-weight:900}
.face-ed{display:block;width:220px;height:232px;max-width:100%;margin:2px auto 0;border-radius:18px;border:3px solid var(--ink);background:var(--backdrop);touch-action:none;cursor:grab}
.rng{display:flex;flex-direction:column;gap:2px;margin-top:10px;text-align:left;font-size:13px;font-weight:900}
.rng input{width:100%;accent-color:var(--berry)}
.ed-hint{margin:8px 0 0;font-size:13px;color:rgba(43,29,58,.7)}
.seg button{padding:8px 10px}
.modal-actions{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}

.game-hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;padding:12px 16px;z-index:4}
.game-score{display:flex;flex-direction:column;align-items:center;flex:1}
.game-score small{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:1px 8px}
.game-score b{font:800 40px/1.1 var(--f-display);color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;font-variant-numeric:tabular-nums;text-shadow:0 3px 0 var(--ink)}
.lives{display:flex;gap:4px;min-width:84px;justify-content:flex-end}
.lives svg{width:26px;height:26px}
.lives .is-lost{opacity:.25}

.toast{
  position:absolute;left:50%;top:136px;z-index:9;max-width:calc(100% - 32px);width:max-content;
  padding:10px 14px;border-radius:16px;background:var(--ink);color:var(--paper);font-size:14px;font-weight:800;line-height:1.3;text-align:center;
  opacity:0;transform:translate(-50%,-8px);transition:opacity .2s,transform .2s;pointer-events:none;
}
.toast.is-show{opacity:1;transform:translate(-50%,0)}

.stage.is-talking .mic-wrap{display:none}
.stage.is-game .hud,.stage.is-game .needs,.stage.is-game .bottom,.stage.is-game .mic-wrap,.stage.is-game .bubble{display:none}

@keyframes pulse{50%{transform:scale(1.1)}}
@keyframes shake{20%{transform:translateX(-4px) rotate(-4deg)}40%{transform:translateX(4px) rotate(4deg)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes pop{from{transform:scale(.7);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:360px){.need span{font-size:10px;padding:1px 5px}.ring{width:42px;height:42px}.tool{width:66px}}
</style>
</head>
<body>
<main class="stage" id="stage">
  <canvas id="scene" role="img" aria-label="Бегемотик Гаппо в своей комнате"></canvas>

  <header class="hud">
    <div class="lvl">
      <div class="lvl-badge" id="lvlNum" aria-label="Уровень">1</div>
      <div class="lvl-meta">
        <div class="lvl-name">Гаппо</div>
        <div class="xp" aria-hidden="true"><i id="xpFill"></i></div>
      </div>
    </div>
    <button class="pill" id="coinsBtn" type="button" aria-label="Монетки">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="#ffc23d" stroke="#2b1d3a" stroke-width="2.2"/><circle cx="12" cy="12" r="6" fill="none" stroke="#e39a12" stroke-width="1.6"/><path d="M12 8.2l1.1 2.3 2.5.3-1.9 1.7.5 2.5-2.2-1.3-2.2 1.3.5-2.5-1.9-1.7 2.5-.3z" fill="#fff1b0"/></svg>
      <b id="coins">50</b>
    </button>
    <button class="round" id="soundBtn" type="button" aria-label="Звук включён">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#2b1d3a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="#ffc23d"/><path id="soundWaves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path id="soundOff" d="M16 9.5l5 5M21 9.5l-5 5" hidden/></svg>
    </button>
  </header>

  <div class="needs" id="needs">
    <button class="need" type="button" data-need="hunger"><div class="ring"><svg viewBox="0 0 24 24" aria-hidden="true" stroke="#2b1d3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M12 8c-3-2.2-8-1.2-8 4.6 0 4.6 3 8.4 5.4 8.4 1.2 0 1.6-.6 2.6-.6s1.4.6 2.6.6c2.4 0 5.4-3.8 5.4-8.4C20 6.8 15 5.8 12 8z" fill="#ff4f5e"/><path d="M12 8c0-2 .8-3.6 2.6-4.6" fill="none"/></svg></div><span>Еда</span></button>
    <button class="need" type="button" data-need="energy"><div class="ring"><svg viewBox="0 0 24 24" aria-hidden="true" stroke="#2b1d3a" stroke-width="2" stroke-linejoin="round"><path d="M19.5 14.8A8 8 0 1 1 9.2 4.5a6.6 6.6 0 0 0 10.3 10.3z" fill="#ffd45c"/></svg></div><span>Сон</span></button>
    <button class="need" type="button" data-need="hygiene"><div class="ring"><svg viewBox="0 0 24 24" aria-hidden="true" stroke="#2b1d3a" stroke-width="2" stroke-linejoin="round"><path d="M12 3s6.8 7.3 6.8 11.8a6.8 6.8 0 0 1-13.6 0C5.2 10.3 12 3 12 3z" fill="#5fd0e6"/><path d="M9 15a3 3 0 0 0 3 3" fill="none" stroke="#fff" stroke-linecap="round"/></svg></div><span>Чистота</span></button>
    <button class="need" type="button" data-need="fun"><div class="ring"><svg viewBox="0 0 24 24" aria-hidden="true" stroke="#2b1d3a" stroke-width="2" stroke-linejoin="round"><path d="M12 3.2l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.5l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z" fill="#ffb03d"/></svg></div><span>Радость</span></button>
  </div>

  <div class="bubble" id="bubble" aria-live="polite"></div>

  <div class="mic-wrap" id="micWrap">
    <button class="round keys" id="keysBtn" type="button" aria-label="Написать Гаппо">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#2b1d3a" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 5h16v11H10l-4 3.5V16H4z" fill="#fff"/><path d="M8 10.5h.01M12 10.5h.01M16 10.5h.01" stroke-width="3"/></svg>
    </button>
    <button class="mic" id="micBtn" type="button" aria-label="Говорить с Гаппо" aria-pressed="false">
      <svg class="ico-mic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#2b1d3a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="8.5" y="3" width="7" height="12" rx="3.5" fill="#fff"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg>
      <svg class="ico-keys" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#2b1d3a" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><rect x="3" y="6" width="18" height="12" rx="2.5" fill="#fff"/><path d="M7 10h.01M10.5 10h.01M14 10h.01M17 10h.01M8 14h8" stroke-width="2.6"/></svg>
    </button>
    <div class="mic-hint" id="micHint">Скажи что-нибудь — Гаппо повторит!</div>
  </div>

  <form class="talkbar" id="talkBar" hidden autocomplete="off">
    <label for="talkInput" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Что сказать Гаппо</label>
    <input id="talkInput" name="talk" maxlength="80" placeholder="Что сказать Гаппо?" enterkeyhint="send">
    <button class="btn" type="submit">Сказать</button>
    <button class="btn is-quiet btn-x" type="button" id="talkClose" aria-label="Закрыть">×</button>
  </form>

  <footer class="bottom" id="bottom">
    <div class="tray" id="tray"></div>
    <nav class="rooms" id="rooms" aria-label="Комнаты">
      <button class="room-btn" type="button" data-room="home"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M3.5 11.5L12 4l8.5 7.5"/><path d="M6 10v10h12V10"/><path d="M10 20v-5h4v5"/></svg>Дом</button>

function ac() {

    const len = c.sampleRate;

}

}

// «Голос» Гаппо: гласные из фразы превращаются в писклявые слоги с формантами.
const VF = { 'а': [800, 1300], 'о': [550, 950], 'у': [380, 850], 'ы': [420, 1550], 'э': [600, 1750], 'е': [480, 1950], 'и': [320, 2250],
  'я': [760, 1500], 'ё': [550, 1050], 'ю': [380, 1350], 'a': [800, 1300], 'o': [550, 950], 'u': [380, 850], 'e': [520, 1850], 'i': [320, 2250], 'y': [420, 1600] };
function babble(text, { pitch = 1, rate = 1 } = {}) {
  if (!AU.unlocked) return 0;
  const c = ac(); if (!c || !S.sound) return 0;
  let vs = [...text.toLowerCase()].filter(ch => VF[ch]);
  if (!vs.length) vs = ['а', 'у'];
  vs = vs.slice(0, 22);
  const q = /\?\s*$/.test(text), ex = /!\s*$/.test(text);
  let t = c.currentTime + 0.02; const t0 = t, base = 340 * pitch;
  vs.forEach((v, i) => {
    const last = i === vs.length - 1;
    const d = (0.085 + Math.random() * 0.05) / rate;
    let f0 = base * (1 + 0.18 * Math.sin(i * 1.7 + 0.5)) * rand(0.95, 1.06);
    if (last) f0 *= q ? 1.3 : ex ? 1.15 : 0.85;
    const o = c.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.linearRampToValueAtTime(f0 * (last && q ? 1.25 : rand(0.9, 1.08)), t + d);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.6, t + 0.018);
    g.gain.setValueAtTime(0.6, t + d * 0.65); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    const [F1, F2] = VF[v];
    const b1 = c.createBiquadFilter(); b1.type = 'bandpass'; b1.frequency.value = F1 * 1.3; b1.Q.value = 5;
    const b2 = c.createBiquadFilter(); b2.type = 'bandpass'; b2.frequency.value = F2 * 1.25; b2.Q.value = 7;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
    const m = c.createGain(); m.gain.value = 1.5;
    const m2 = c.createGain(); m2.gain.value = 0.12;
    o.connect(g); g.connect(b1); g.connect(b2); g.connect(lp);
    b1.connect(m); b2.connect(m); lp.connect(m2); m.connect(AU.voice); m2.connect(AU.voice);
    o.start(t); o.stop(t + d + 0.03);
    t += d + (0.025 + (i % 3 === 2 ? 0.05 : 0)) / rate;
  });
  return t - t0;
}

    case 'talk': p.armL = 0.5 + Math.sin(t * 5) * 0.35; p.armR = 0.6 + Math.sin(t * 4.3 + 1) * 0.35; p.mouth = 'open';
      p.tilt = Math.sin(t * 3) * 0.05; if (mood !== 'sad') p.eyes = 'open'; break;
    case 'chew': { const ch = Math.abs(Math.sin(pt * 11)); p.mouth = 'chew'; p.cheeks = 0.55 + 0.45 * ch; p.eyes = 'happy';
      p.sy *= 1 - ch * 0.02; p.armL = p.armR = -0.3; p.blush = 0.5; break; }
    case 'refuse': p.tilt = Math.sin(pt * 18) * 0.14 * Math.max(0, 1 - pt / 1.2); p.armR = 1.7; p.eyes = 'closed'; p.mouth = 'flat'; break;
    case 'happy': p.eyes = 'happy'; p.blush = 0.75; p.mouth = 'open'; p.open = 0.35; p.dy = -Math.abs(Math.sin(pt * 7)) * 10;
      p.armL = p.armR = 1.0 + Math.sin(pt * 8) * 0.2; break;
    case 'pet': p.eyes = 'happy'; p.blush = 0.85; p.mouth = 'smile'; p.tilt = Math.sin(t * 2) * 0.1; p.armL = p.armR = 0.2; break;
    case 'giggle': p.eyes = 'happy'; p.mouth = 'open'; p.open = 0.45 + 0.25 * Math.abs(Math.sin(pt * 14)); p.shakeX = Math.sin(pt * 40) * 4;
      p.armL = p.armR = -0.35; p.blush = 0.7; break;
    case 'bonk': p.eyes = 'dizzy'; p.mouth = 'o'; p.tilt = Math.sin(pt * 6) * 0.12; p.armL = p.armR = 2.2; if (pt < 0.15) p.sy *= 0.9; break;

        p.mouth = 'open'; p.open = 0.8 * Math.max(0, 1 - Math.max(0, pt - 1)); p.sy *= 1 - 0.05 * k; }

    case 'yawn': { const k = Math.sin(Math.min(1, pt / 1.6) * Math.PI); p.mouth = 'open'; p.open = 0.9 * k; p.eyes = 'closed';

      p.sy = 1 + Math.sin(t * 1.2) * 0.02; p.blush = 0.3; break;
    case 'shiver': p.shakeX = Math.sin(pt * 60) * 3; p.eyes = 'wide'; p.mouth = 'flat'; p.tint = '#8fd0ff';
      p.tintAmt = 0.5 * Math.min(1, pt * 3) * (pt > 1.4 ? Math.max(0, 1 - (pt - 1.4) * 2.5) : 1); p.armL = p.armR = -0.4; break;
    case 'fire': { const k = Math.min(1, pt * 2.5) * (pt > 1.8 ? Math.max(0, 1 - (pt - 1.8) * 2.5) : 1);
      p.tint = '#ff3b2f'; p.tintAmt = 0.55 * k; p.mouth = 'open'; p.open = 0.85 * k + 0.1; p.eyes = 'wide';
      p.dy = -Math.abs(Math.sin(pt * 10)) * 14 * k; p.armL = p.armR = 2.0 + Math.sin(pt * 14) * 0.4; break; }
    case 'dance': p.eyes = 'happy'; p.mouth = 'open'; p.open = 0.45; p.blush = 0.7; p.dy = -Math.abs(Math.sin(pt * 6)) * 24;
      p.tilt = Math.sin(pt * 6) * 0.12; p.armL = 1.6 + Math.sin(pt * 6) * 0.9; p.armR = 1.6 - Math.sin(pt * 6) * 0.9; break;
    case 'grumpy': p.eyes = 'grumpy'; p.mouth = 'frown'; p.armL = p.armR = -0.2; p.blush = 0; break;
    case 'yum': p.eyes = 'happy'; p.mouth = 'smile'; p.blush = 0.6; p.armL = p.armR = -0.3; break;
    case 'catch': p.mouth = 'open'; p.open = 0.7 + Math.sin(t * 6) * 0.05; p.eyes = 'open'; p.lid = 0; p.armL = p.armR = 1.3; break;
    case 'chomp': p.mouth = 'chew'; p.cheeks = 1; p.eyes = 'happy'; p.armL = p.armR = 1.3; break;
    case 'ouch': p.eyes = 'dizzy'; p.mouth = 'o'; p.armL = p.armR = 2.2; p.shakeX = Math.sin(pt * 50) * 4; break;
  }

}

function drawGappo(c, x, y, s, p, skinId) {

function drawArm(c, sd, a, col) {

function drawEyes(c, p, body) {

      case 'closed': c.lineWidth = 7; c.beginPath(); c.arc(ex, ey - 6, 15, Math.PI * 0.15, Math.PI * 0.85); c.stroke(); break;
      case 'squint': c.lineWidth = 7; c.beginPath(); c.moveTo(ex - sd * 12, ey - 10); c.lineTo(ex + sd * 10, ey); c.lineTo(ex - sd * 12, ey + 10); c.stroke(); break;

function drawTeeth(c, x0, x1, y, h) {

function drawMouth(c, p) {

}

const DIRT = {

// ================= частицы =================
function emit(kind, x, y, o = {}) {
  P.push(Object.assign({ kind, x, y, vx: 0, vy: 0, life: 0, max: 1, size: 12, rot: 0, vr: 0, g: 0, color: null, text: '' }, o));
  if (P.length > 280) P.shift();
}
function burst(kind, x, y, n, o = {}) {
  if (reduceMotion) n = Math.ceil(n / 3);
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(o.spMin || 60, o.spMax || 220);
    emit(kind, x, y, Object.assign({ vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (o.up || 0), max: rand(0.7, 1.3), rot: rand(0, TAU), vr: rand(-6, 6) }, o.extra ? o.extra() : {}, o.base || {}));
  }
}
function heartPath(c, s) { c.beginPath(); c.moveTo(0, s * 0.35); c.bezierCurveTo(-s * 1.1, -s * 0.35, -s * 0.45, -s * 1.15, 0, -s * 0.45); c.bezierCurveTo(s * 0.45, -s * 1.15, s * 1.1, -s * 0.35, 0, s * 0.35); c.closePath(); }
function starPath(c, s) { c.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? s * 0.45 : s; c.lineTo(Math.cos(a) * r, Math.sin(a) * r); } c.closePath(); }
function updateParticles(dt) {
  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i]; p.life += dt;
    if (p.life >= p.max) { P.splice(i, 1); continue; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.drag) { p.vx *= 1 - p.drag * dt; p.vy *= 1 - p.drag * dt; }
  }
}
function drawParticles(c) {
  for (const p of P) {
    const k = p.life / p.max;
    const a = k < 0.12 ? k / 0.12 : 1 - Math.max(0, (k - 0.6) / 0.4);
    c.save(); c.globalAlpha = clamp(a, 0, 1); c.translate(p.x, p.y);
    c.lineWidth = 2.5; c.strokeStyle = INK; c.lineJoin = 'round';
    const s = p.size;
    switch (p.kind) {
      case 'heart': c.rotate(Math.sin(p.life * 5) * 0.2); heartPath(c, s); fs(c, p.color || '#ff5a8a'); break;
      case 'star': c.rotate(p.rot); starPath(c, s); fs(c, p.color || '#ffd23d'); break;
      case 'confetti': c.rotate(p.rot); c.fillStyle = p.color; c.fillRect(-s / 2, -s / 4, s, s / 2); break;
      case 'zzz': c.font = '800 ' + Math.round(s * (0.7 + k * 0.6)) + 'px ' + DISPLAY; c.fillStyle = '#fff'; c.lineWidth = 4; c.strokeText('z', 0, 0); c.fillText('z', 0, 0); break;
      case 'crumb': c.rotate(p.rot); c.fillStyle = p.color || '#e8b06a'; c.fillRect(-s / 2, -s / 2, s, s); break;
      case 'seed': c.rotate(p.rot); E(c, 0, 0, s * 0.4, s * 0.65); c.fillStyle = INK; c.fill(); break;
      case 'bubble': E(c, 0, 0, s * (0.6 + k * 0.6), s * (0.6 + k * 0.6)); c.fillStyle = 'rgba(255,255,255,.6)'; c.strokeStyle = '#8fd3ea'; c.fill(); c.stroke(); break;
      case 'drop': c.rotate(Math.atan2(p.vy, p.vx) - Math.PI / 2); E(c, 0, 0, s * 0.35, s * 0.6); c.fillStyle = 'rgba(110,205,235,.9)'; c.fill(); break;
      case 'flame': { const r = s * (1 - k * 0.6); c.beginPath(); c.moveTo(0, -r * 1.4); c.quadraticCurveTo(r, -r * 0.2, 0, r); c.quadraticCurveTo(-r, -r * 0.2, 0, -r * 1.4); c.fillStyle = k < 0.4 ? '#ffd23d' : '#ff7a2e'; c.fill(); break; }
      case 'steam': E(c, 0, 0, s * (0.5 + k), s * (0.5 + k)); c.fillStyle = 'rgba(255,255,255,.75)'; c.fill(); break;
      case 'frost': c.rotate(p.rot); c.strokeStyle = '#bfe9ff'; c.lineWidth = 2.5; for (let i = 0; i < 3; i++) { c.rotate(Math.PI / 3); c.beginPath(); c.moveTo(-s, 0); c.lineTo(s, 0); c.stroke(); } break;
      case 'text': c.font = '800 ' + s + 'px ' + DISPLAY; c.textAlign = 'center'; c.lineWidth = 5; c.strokeText(p.text, 0, 0); c.fillStyle = p.color || '#ffc23d'; c.fillText(p.text, 0, 0); break;
      case 'note': c.rotate(Math.sin(p.life * 4) * 0.3); E(c, 0, 0, s * 0.45, s * 0.35, -0.4); c.fillStyle = p.color || INK; c.fill(); c.fillRect(s * 0.3, -s * 1.3, 3, s * 1.3); break;
      case 'wave': c.strokeStyle = '#fff'; c.lineWidth = 4; c.beginPath(); c.arc(0, 0, s * (0.5 + k), -0.7, 0.7); c.stroke(); break;
    }
    c.restore();
  }
}

function speakAndroid(text) {
  return new Promise(res => {
    let started = false, done = false;
    const finish = ok => { if (done) return; done = true; G.ttsTalking = false; window.__gappoTTS = null; res(ok); };
    window.__gappoTTS = ev => { if (ev === 'start') { started = true; G.ttsTalking = true; } else finish(started && ev === 'end'); };
    setTimeout(() => { if (!started) { try { window.GappoAndroid.stop(); } catch (e) { } finish(false); } }, 2500);
    try { window.GappoAndroid.speak(text); } catch (e) { finish(false); }
  });
}
function speakTTS(text) {
  if (S.sound && window.GappoAndroid) { try { if (window.GappoAndroid.ttsAvailable()) return speakAndroid(text); } catch (e) { } }
  return new Promise(res => {
    const ss = window.speechSynthesis;
    if (!S.sound || !ss || typeof SpeechSynthesisUtterance === 'undefined') return res(false);
    const voices = ss.getVoices();
    const v = voices.find(x => /^ru/i.test(x.lang));
    if (!v && voices.length) return res(false);
    let started = false, done = false;
    const finish = ok => { if (done) return; done = true; G.ttsTalking = false; res(ok); };
    const u = new SpeechSynthesisUtterance(text);
    if (v) u.voice = v;
    u.lang = 'ru-RU'; u.pitch = 2; u.rate = 1.15;
    u.onstart = () => { started = true; G.ttsTalking = true; };
    u.onend = () => finish(started);
    u.onerror = () => finish(started);
    setTimeout(() => { if (!started) { try { ss.cancel(); } catch (e) { } finish(false); } }, 1500);
    try { ss.cancel(); ss.speak(u); } catch (e) { finish(false); }
  });
}

  const g = 2400 * Math.max(0.6, G.s), floor = G.baseY + 10 * G.s - BALL.r;
  BALL.vy += g * dt; BALL.x += BALL.vx * dt; BALL.y += BALL.vy * dt; BALL.rot += BALL.vx * dt / BALL.r;
  if (BALL.y > floor) { BALL.y = floor; if (Math.abs(BALL.vy) > 120) { BALL.vy = -BALL.vy * 0.58; SFX.click(); } else BALL.vy = 0; BALL.vx *= 0.86; }
  if (BALL.x < BALL.r) { BALL.x = BALL.r; BALL.vx = Math.abs(BALL.vx) * 0.7; }
  if (BALL.x > W - BALL.r) { BALL.x = W - BALL.r; BALL.vx = -Math.abs(BALL.vx) * 0.7; }
  // удар головой
  const head = at(0, -350);
  if (BALL.vy > 0 && Math.abs(BALL.x - G.x) < 70 * G.s && BALL.y + BALL.r > head.y && BALL.y + BALL.r < head.y + 50 * G.s && !S.sleeping) {
    BALL.vy = -Math.max(900 * G.s, Math.abs(BALL.vy) * 0.85); BALL.vx += (BALL.x - G.x) * 4;
    SFX.kick(); setPose('happy', 0.9); if (Math.random() < 0.6) line('header');
    if (T - BALL.lastFun > 0.4) { addNeed('fun', 3); BALL.lastFun = T; addXp(1); }
  }
}

let GM = null;
function startGame() {

  if (MIC.on) micStop();
  closeTalk(); hideBubble();
  mode = 'game'; stage.classList.add('is-game'); $('#gameHud').hidden = false;
  GM = { score: 0, lives: 3, items: [], spawnT: 0.6, t: 0, coins: 0, targetX: W / 2, shake: 0, over: false, hitT: 0 };

}
function renderLives() {

  $('#gameLives').innerHTML = [0, 1, 2].map(i => h.replace('<svg', '<svg class="' + (i < GM.lives ? '' : 'is-lost') + '"')).join('');
  $('#gameLives').setAttribute('aria-label', 'Жизни: ' + GM.lives);
}
function updateGame(dt) {
  if (!GM || GM.over) return;
  GM.t += dt;
  const diff = Math.min(1, GM.t / 50);
  if (KEYS.left) GM.targetX -= 700 * dt; if (KEYS.right) GM.targetX += 700 * dt;
  GM.targetX = clamp(GM.targetX, 80 * G.s, W - 80 * G.s);
  G.x = lerp(G.x, GM.targetX, 1 - Math.pow(0.0008, dt));
  GM.spawnT -= dt;
  if (GM.spawnT <= 0) {
    GM.spawnT = lerp(0.95, 0.42, diff) * rand(0.8, 1.2);
    const r = Math.random(), stoneP = 0.12 + 0.13 * diff;
    const kind = r < stoneP ? 'stone' : r < stoneP + 0.07 ? 'coin' : 'fruit';
    const id = kind === 'fruit' ? pick(['apple', 'banana', 'carrot', 'melon', 'apple']) : kind;
    const sz = clamp(W / 14, 22, 32);
    GM.items.push({ kind, id, x: rand(sz + 10, W - sz - 10), y: -40, vy: lerp(210, 430, diff) * (H / 800) * rand(0.9, 1.15), r: sz, rot: rand(0, TAU), vr: rand(-3, 3) });
  }
  const m = at(0, -200);
  for (let i = GM.items.length - 1; i >= 0; i--) {
    const it = GM.items[i];
    it.y += it.vy * dt; it.rot += it.vr * dt;
    if (Math.abs(it.x - G.x) < 100 * G.s + it.r * 0.4 && it.y > G.y - 340 * G.s && it.y < G.y - 140 * G.s) {
      GM.items.splice(i, 1);
      if (it.kind === 'stone') {
        GM.lives--; GM.shake = 0.35; GM.hitT = 0.6; SFX.bonk(); setPose('ouch', 0.6);
        burst('star', m.x, m.y - 120 * G.s, 6, { spMin: 60, spMax: 180, extra: () => ({ size: 9 }) });
        renderLives();
        if (GM.lives <= 0) { endGame(); return; }
      } else if (it.kind === 'coin') {
        GM.coins += 2; SFX.coin(); emit('text', it.x, it.y, { text: '+2', size: 20, vy: -80, max: 1 });
      } else {
        GM.score++; SFX.crunch(); setPose('chomp', 0.22);
        emit('text', it.x, it.y, { text: '+1', size: 22, vy: -90, max: 0.9, color: '#fff' });
        $('#gameScore').textContent = GM.score;
      }
      continue;
    }
    if (it.y > H + 50) GM.items.splice(i, 1);
  }

  if (GM.shake > 0) GM.shake -= dt;
}
function endGame(early) {

  const record = sc > S.best; if (record) S.best = sc;
  addNeed('fun', fun); addNeed('energy', -energy); addNeed('hunger', -hunger);
  S.coins += coins; renderStats();
  let lvl = '';

    const { reward, unlocked } = levelReward();
    lvl = '<li>Уровень ' + S.level + '! +' + reward + ' монеток</li>' + unlocked.map(n => '<li>Открыто: ' + n + '</li>').join('');
  } else if (coins) SFX.coin();
  save();
  showModal({
    eyebrow: record && sc > 0 ? 'Новый рекорд!' : early ? 'Игра окончена' : 'Камень по голове!',
    title: 'Фруктопад',
    body: '<div class="big">' + sc + '</div><p>' + plural(sc, 'фрукт пойман', 'фрукта поймано', 'фруктов поймано') + ' · рекорд ' + S.best + '</p><ul><li>+' + coins + ' ' + plural(coins, 'монетка', 'монетки', 'монеток', true) + '</li><li>+' + Math.round(fun) + ' радости</li><li>−' + Math.round(energy) + ' бодрости</li>' + lvl + '</ul>',

// ================= основной цикл =================
let lastFrame = performance.now(), statT = 0, saveT = 0;
function update(dt) {
  T += dt;
  // потребности
  const n = S.needs, m = dt / 60;
  if (S.sleeping) {
    n.energy = Math.min(100, n.energy + 28 * m);
    n.hunger = Math.max(0, n.hunger - RATE.hunger * 0.5 * m);
    n.hygiene = Math.max(0, n.hygiene - RATE.hygiene * 0.3 * m);
    if (n.energy >= 100) { wake(true); renderTray(); }
  } else {
    for (const k in RATE) n[k] = Math.max(0, n[k] - RATE[k] * m * (mode === 'game' && k === 'fun' ? 0 : 1));
  }
  statT += dt; if (statT > 0.3) { statT = 0; renderStats(); }
  saveT += dt; if (saveT > 5) { saveT = 0; save(); }

  // позы
  G.poseT += dt;
  if (G.poseDur && G.poseT > G.poseDur) setPose(S.sleeping ? 'sleep' : mode === 'game' ? 'catch' : 'idle');
  if (S.sleeping && G.pose === 'idle') setPose('sleep', 0);
  G.ear = Math.max(0, G.ear - dt * 1.5);
  // моргание
  G.blinkT -= dt; G.nextBlink -= dt;
  if (G.nextBlink <= 0) { G.blinkT = 0.13; G.nextBlink = rand(2, 5); }
  // куда смотреть
  let target = null;
  if (G.held) target = G.held; else if (G.flights.length) target = G.flights[0];
  else if (room === 'yard' && BALL.ready && mode === 'room' && (Math.abs(BALL.vy) > 10 || Math.abs(BALL.vx) > 10)) target = BALL;
  else if (mode === 'game' && GM && GM.items.length) target = GM.items.reduce((a, b) => (b.y > a.y && b.y < G.y - 200 * G.s ? b : a), GM.items[0]);
  else if (G.pointer && T - G.pointer.t < 1.5) target = G.pointer;
  if (G.pose === 'listen') G.lookT = { x: 0.6, y: -0.6 };
  else if (target) { const hx = G.x, hy = G.y - 300 * G.s, dx = target.x - hx, dy = target.y - hy, d = Math.hypot(dx, dy) || 1; G.lookT = { x: dx / d, y: dy / d }; }
  else { G.lookTimer -= dt; if (G.lookTimer <= 0) { G.lookTimer = rand(1.5, 4); G.lookT = Math.random() < 0.4 ? { x: 0, y: 0 } : { x: rand(-1, 1), y: rand(-0.6, 0.5) }; } }
  G.look.x = lerp(G.look.x, G.lookT.x, 1 - Math.pow(0.001, dt)); G.look.y = lerp(G.look.y, G.lookT.y, 1 - Math.pow(0.001, dt));

  // рот от звука
  let mt = 0;

    AU.voice.getFloatTimeDomainData(AU.vbuf);
    let s2 = 0; for (let i = 0; i < AU.vbuf.length; i++) s2 += AU.vbuf[i] * AU.vbuf[i];
    mt = clamp(Math.sqrt(s2 / AU.vbuf.length) * 5.5, 0, 1);
  } else if (T < G.flapUntil || G.ttsTalking) mt = 0.25 + 0.55 * Math.abs(Math.sin(T * 17)) * (0.6 + 0.4 * Math.sin(T * 5.3));
  G.mouth = lerp(G.mouth, mt, 0.45);
  if (MIC.on) micBtn.style.setProperty('--lvl', clamp(MIC.level * 12, 0, 1).toFixed(2));

  // пузырь
  if (bubbleUntil && T > bubbleUntil) hideBubble(); else placeBubble();

  // полёт еды
  for (let i = G.flights.length - 1; i >= 0; i--) {
    const f = G.flights[i]; f.t += dt; const k = Math.min(1, f.t / f.dur), m2 = mouthPos();

  }

  // эффекты поз
  if (G.pose === 'fire' && G.poseT < 1.9) {
    const mm = mouthPos();
    if (Math.random() < 0.8) emit('flame', mm.x + rand(-10, 10) * G.s, mm.y + 10 * G.s, { vx: rand(-60, 60), vy: rand(60, 200), max: 0.5, size: rand(10, 18) * Math.max(.6, G.s) });
    if (Math.random() < 0.3) for (const sd of [-1, 1]) { const e2 = at(sd * 74, -340); emit('steam', e2.x, e2.y, { vx: sd * rand(20, 60), vy: rand(-120, -60), max: 0.8, size: rand(8, 12) }); }
  }
  if (S.sleeping && room === 'bed' && Math.random() < dt * 0.9) { const h = at(70, -330); emit('zzz', h.x, h.y, { vx: rand(10, 40), vy: -40, max: 2.4, size: 24 }); }
  if (G.pose === 'pet' && Math.random() < dt * 1.5) { const h = at(rand(-50, 50), -330); emit('heart', h.x, h.y, { vy: -70, max: 1.1, size: 11 }); }
  if (G.pose === 'listen' && Math.random() < dt * 4) { const e2 = at(110, -320); emit('wave', e2.x, e2.y, { max: 0.6, size: 18 }); }
  if (G.pose === 'dance' && Math.random() < dt * 3) { const h = at(rand(-120, 120), -340); emit('note', h.x, h.y, { vy: -80, vx: rand(-30, 30), max: 1.3, size: 14, color: pick(['#ff5a8a', '#35c2d6', '#ffc23d']) }); }
  // звёздочки вокруг головы
  for (const p of P) if (p.orbit != null) { const hh = at(0, -360); p.orbit += dt * 5; p.x = hh.x + Math.cos(p.orbit) * 70 * G.s; p.y = hh.y + Math.sin(p.orbit) * 18 * G.s; }

  }
  if (G.duckT > 0) G.duckT -= dt;

  // мухи над грязнулей

  while (G.flies.length < wantFlies) G.flies.push({ ph: rand(0, TAU), sp: rand(2, 3.4), r: rand(90, 150) });

  // спонтанное поведение

}

function render() {
  const c = cx;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.clearRect(0, 0, W, H);
  if (mode === 'game') {
    if (GM && GM.shake > 0 && !reduceMotion) c.translate(rand(-6, 6), rand(-6, 6));

  else if (room === 'bath') roomBathBack(c, T);
  else if (room === 'bed') roomBedBack(c, T);
