<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Фобия №3 — анимация</title>
<style>
  @font-face { font-family: 'RubikC'; font-weight: 900; src: url('node_modules/@fontsource/rubik/files/rubik-cyrillic-900-normal.woff2') format('woff2'); }
  @font-face { font-family: 'RubikL'; font-weight: 900; src: url('node_modules/@fontsource/rubik/files/rubik-latin-900-normal.woff2') format('woff2'); }
  @font-face { font-family: 'RubikC'; font-weight: 700; src: url('node_modules/@fontsource/rubik/files/rubik-cyrillic-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'RubikL'; font-weight: 700; src: url('node_modules/@fontsource/rubik/files/rubik-latin-700-normal.woff2') format('woff2'); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
'use strict';
// Мультик «Фобия №3 из 100: акрофобия». Рисовка — как в выпуске №1, сцены свои:
// Тёма, который боится высоты, его подруга Лиза и их далёкие предки Ух и Ах.
// Всё рисуется детерминированно от времени t: renderFrame(t) → кадр.
const W = 1080, H = 1920, TAU = Math.PI * 2, GROUND = 1220;
const FONT = 'RubikC, RubikL, sans-serif';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const C = {
  ink: '#2A1E2E', white: '#FFFFFF', yellow: '#FFE14D', red: '#FF4D6D', green: '#22B8A7',
  chunk: ['#8E6CDF', '#22B8A7', '#FF9F1C', '#E63946'],
};
const LOOK = {
  tema: { body: '#5CD69B', light: '#A8F0C8', belly: '#D4F7E3', shoe: '#E63946', hair: 'tuft', scarf: '#FF9F1C' },
  liza: { body: '#FF8FB1', light: '#FFC3D6', belly: '#FFE3EC', shoe: '#8E6CDF', hair: 'tails', bow: '#FFE14D' },
  uh: { body: '#D9A066', light: '#F2C894', belly: '#F7DDB8', shoe: null, hair: 'shaggy', fur: true },
  ah: { body: '#5CB98A', light: '#9EE0BC', belly: '#CFF2DE', shoe: null, hair: 'shaggy', fur: true },
  mom: { body: '#8E6CDF', light: '#B9A0F0', belly: '#DCD0FA', shoe: '#FF4D6D', hair: 'bun' },
};

// ---------- утилиты ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeIn = k => k * k * k;
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOutBack = (k, s = 1.9) => k <= 0 ? 0 : 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2);
const pop = (t, t0, d = 0.32) => easeOutBack(inv(t0, t0 + d, t));
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const noise1 = x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u) * 2 - 1; };
const frac = x => x - Math.floor(x);
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, k) { const A = hex2rgb(a), B = hex2rgb(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',')})`; }

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function setFont(size, weight = 900) { ctx.font = `${weight} ${size}px ${FONT}`; }
function text(str, x, y, size, o = {}) {
  const { fill = '#fff', stroke = C.ink, sw = 0, weight = 900, align = 'center', maxW = 0 } = o;
  setFont(size, weight);
  if (maxW) { const w = ctx.measureText(str).width; if (w > maxW) { size *= maxW / w; setFont(size, weight); } }
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (sw) { ctx.lineJoin = 'round'; ctx.miterLimit = 2; ctx.lineWidth = sw; ctx.strokeStyle = stroke; ctx.strokeText(str, x, y); }
  ctx.fillStyle = fill; ctx.fillText(str, x, y);
}
function withT(x, y, rot, sc, fn, alpha = 1) {
  if (sc <= 0.001 || alpha <= 0.001) return;
  ctx.save(); ctx.globalAlpha *= clamp(alpha); ctx.translate(x, y); if (rot) ctx.rotate(rot); if (sc !== 1) ctx.scale(sc, sc); fn(); ctx.restore();
}
function stroke(w = 5) { ctx.lineWidth = w; ctx.strokeStyle = C.ink; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); }
function tile(ch, size, color, glow = 0) {
  const h = size / 2, r = size * 0.2;
  ctx.fillStyle = 'rgba(30,10,40,0.22)'; rr(-h + size * 0.05, -h + size * 0.09, size, size, r); ctx.fill();
  ctx.fillStyle = color; rr(-h, -h, size, size, r); ctx.fill();
  ctx.lineWidth = Math.max(3, size * 0.055); ctx.strokeStyle = C.ink; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.25)'; rr(-h + size * 0.12, -h + size * 0.09, size * 0.76, size * 0.2, size * 0.1); ctx.fill();
  if (glow > 0) { ctx.fillStyle = `rgba(255,255,255,${0.55 * glow})`; rr(-h, -h, size, size, r); ctx.fill(); }
  text(ch, 0, size * 0.05, size * 0.6, { sw: size * 0.1 });
}
function star(x, y, r, rot, fill) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = rot + i * Math.PI / 5 - Math.PI / 2, rad = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); }
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = C.ink; ctx.lineJoin = 'round'; ctx.stroke();
}
function heart(x, y, s, fill = '#FF4D6D') {
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 30, s / 30);
  ctx.beginPath(); ctx.moveTo(0, 12);
  ctx.bezierCurveTo(-30, -8, -16, -32, 0, -16); ctx.bezierCurveTo(16, -32, 30, -8, 0, 12);
  ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = C.ink; ctx.stroke(); ctx.restore();
}
// табличка-«пилюля» с текстом
function pill(str, size, fill, color, o = {}) {
  setFont(size); const w = ctx.measureText(str).width + size * 1.4, h = size * 1.9;
  if (o.shadow !== false) { ctx.fillStyle = 'rgba(30,10,40,0.22)'; rr(-w / 2 + 6, -h / 2 + 8, w, h, h / 2); ctx.fill(); }
  ctx.fillStyle = fill; rr(-w / 2, -h / 2, w, h, h / 2); ctx.fill(); stroke(o.sw || 8);
  text(str, 0, size * 0.06, size, { fill: color, sw: o.tsw || 0 });
}
// штамп
function stamp(str, size, color, w) {
  ctx.fillStyle = 'rgba(255,255,255,0.93)'; rr(-w / 2, -size * 0.95, w, size * 1.9, size * 0.35); ctx.fill();
  ctx.lineWidth = size * 0.13; ctx.strokeStyle = color; ctx.stroke();
  text(str, 0, size * 0.07, size, { fill: color, maxW: w - size * 0.6 });
}
// строка-карточка: иконка слева, заголовок и подпись
function rowCard(w, title, sub, color, icon, t) {
  const h = 136;
  ctx.fillStyle = 'rgba(30,10,40,0.2)'; rr(-w / 2 + 4, -h / 2 + 6, w, h, 34); ctx.fill();
  ctx.fillStyle = '#fff'; rr(-w / 2, -h / 2, w, h, 34); ctx.fill(); stroke(7);
  const ix = -w / 2 + 78;
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(ix, 0, 52, 0, TAU); ctx.globalAlpha *= 0.25; ctx.fill(); ctx.globalAlpha /= 0.25;
  withT(ix, 4, 0, 0.8, () => icon(t));
  const tx = ix + 76, mw = w / 2 - tx - 30;
  if (sub) {
    text(title, tx, -20, 54, { fill: color, sw: 10, align: 'left', maxW: mw });
    text(sub, tx, 36, 34, { fill: C.ink, weight: 700, align: 'left', maxW: mw });
  } else text(title, tx, 4, 54, { fill: color, sw: 10, align: 'left', maxW: mw });
}
// квадратная карточка: иконка сверху, подпись снизу
function boxCard(w, h, title, color, icon, t) {
  ctx.fillStyle = 'rgba(30,10,40,0.2)'; rr(-w / 2 + 5, -h / 2 + 7, w, h, 36); ctx.fill();
  ctx.fillStyle = '#fff'; rr(-w / 2, -h / 2, w, h, 36); ctx.fill(); stroke(8);
  ctx.fillStyle = color; ctx.globalAlpha *= 0.22; rr(-w / 2 + 16, -h / 2 + 16, w - 32, h - 96, 26); ctx.fill(); ctx.globalAlpha /= 0.22;
  withT(0, -h / 2 + 16 + (h - 96) / 2, 0, 1, () => icon(t));
  const lines = title.split('\n');
  lines.forEach((ln, i) => text(ln, 0, h / 2 - 42 - (lines.length - 1 - i) * 40, lines.length > 1 ? 36 : 44, { fill: C.ink, maxW: w - 40 }));
}
function cross(r, w = 16) {   // красный крест «нельзя»
  ctx.strokeStyle = '#fff'; ctx.lineWidth = w + 10; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-r, -r); ctx.lineTo(r, r); ctx.moveTo(r, -r); ctx.lineTo(-r, r); ctx.stroke();
  ctx.strokeStyle = '#E63946'; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(-r, -r); ctx.lineTo(r, r); ctx.moveTo(r, -r); ctx.lineTo(-r, r); ctx.stroke();
}
function checkMark(r) {
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fillStyle = C.green; ctx.fill(); stroke(6);
  ctx.beginPath(); ctx.moveTo(-r * 0.45, 0); ctx.lineTo(-r * 0.1, r * 0.35); ctx.lineTo(r * 0.5, -r * 0.35);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = r * 0.22; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
}

// ---------- тайминги ----------
let TL, L = {}, S = {}, SCENES = [], CUES = [], PAGES = [], T = 0, impulses = [];

function findWord(id, re) {
  const w = L[id].words.find(x => re.test(x.w.toLowerCase()));
  if (!w) throw new Error(`нет слова ${re} в ${id}`);
  return w;
}
const ws = (id, re) => findWord(id, re).s;
const b = id => L[id].start - 0.25;

function setup(tl) {
  TL = tl; L = {}; tl.lines.forEach(l => L[l.id] = l);
  S = {
    hook: [0, b('l2')], park: [b('l2'), b('l4')], ride: [b('l4'), L.l9.start - 0.5], word: [L.l9.start - 0.5, b('l11')],
    peaks: [b('l11'), b('l14')], cave: [b('l14'), b('l19')], lab: [b('l19'), b('l22')], deck: [b('l22'), b('l24')],
    danger: [b('l24'), b('l26')], vr: [b('l26'), b('l27')], final: [b('l27'), tl.total], end: [b('l28'), tl.total],
  };
  SCENES = [
    { name: 'hook', t: 0, draw: sceneHook },
    { name: 'park', t: S.park[0], draw: scenePark, tr: 'iris' },
    { name: 'ride', t: S.ride[0], draw: sceneRide, tr: 'iris' },
    { name: 'word', t: S.word[0], draw: sceneWord, tr: 'flash' },
    { name: 'peaks', t: S.peaks[0], draw: scenePeaks, tr: 'iris' },
    { name: 'cave', t: S.cave[0], draw: sceneCave, tr: 'swirl' },
    { name: 'lab', t: S.lab[0], draw: sceneLab, tr: 'iris' },
    { name: 'deck', t: S.deck[0], draw: sceneDeck, tr: 'iris' },
    { name: 'danger', t: S.danger[0], draw: sceneDanger, tr: 'iris' },
    { name: 'vr', t: S.vr[0], draw: sceneVR, tr: 'iris' },
    { name: 'final', t: S.final[0], draw: sceneFinal, tr: 'iris' },
  ];
  impulses = [
    { t: ws('l1', /^предк/) - 0.02, a: 14, d: 0.4 }, { t: S.word[0], a: 26, d: 0.6 },
    { t: ws('l16', /^осыпа/), a: 20, d: 0.6 }, { t: ws('l16', /^плюх/), a: 16, d: 0.4 },
    { t: L.l24.start + 0.1, a: 12, d: 0.35 },
  ];
  buildCaptions(); buildCues();
  return { cues: CUES, scenes: S };
}

// ---------- субтитры (как в выпуске №1) ----------
const CAP_SIZE = 74, CAP_MAXW = 880, CAP_Y = 1405;
function buildCaptions() {
  PAGES = []; setFont(CAP_SIZE);
  for (const l of TL.lines) {
    if (l.hide_caption) continue;
    let cur = [];
    const flush = () => { if (cur.length) PAGES.push({ words: cur }); cur = []; };
    for (const w of l.words) {
      const width = ctx.measureText([...cur, w].map(x => x.w.toUpperCase()).join('  ')).width;
      if (cur.length && (width > CAP_MAXW || cur.length >= 3)) flush();
      cur.push(w);
      if (/[.!?…:]»?$/.test(w.w)) flush();
    }
    flush();
  }
  PAGES.forEach(p => p.s = p.words[0].s - 0.06);
  PAGES.forEach((p, i) => {
    const last = p.words[p.words.length - 1].e, next = PAGES[i + 1];
    p.e = next ? Math.min(next.s, last + 0.55) : last + 0.8;
  });
}
function drawCaptions(t) {
  const p = PAGES.find(p => t >= p.s && t < p.e);
  if (!p) return;
  const sc = lerp(0.82, 1, easeOutBack(inv(p.s, p.s + 0.16, t)));
  setFont(CAP_SIZE);
  const words = p.words.map(w => w.w.toUpperCase());
  const space = CAP_SIZE * 0.36;
  let cur = -1; p.words.forEach((w, i) => { if (t >= w.s - 0.03) cur = i; });
  const grow = words.map((w, i) => i === cur ? 1 + 0.1 * easeOutBack(inv(p.words[i].s - 0.03, p.words[i].s + 0.1, t)) : 1);
  const widths = words.map((w, i) => (ctx.measureText(w).width + 16) * grow[i]);
  const total = widths.reduce((a, b) => a + b, 0) + space * (words.length - 1);
  const fit = Math.min(1, CAP_MAXW / total);
  withT(540, CAP_Y, 0, sc * fit, () => {
    let x = -total / 2;
    words.forEach((w, i) => {
      withT(x + widths[i] / 2, 0, 0, grow[i], () => text(w, 0, 0, CAP_SIZE, { fill: i === cur ? C.yellow : '#fff', sw: 16 }));
      x += widths[i] + space;
    });
  });
}

// ---------- камера ----------
function shakeAt(t) {
  let x = 0, y = 0;
  for (const im of impulses) {
    if (t < im.t || t > im.t + im.d) continue;
    const k = Math.pow(1 - (t - im.t) / im.d, 2) * im.a;
    x += noise1((t - im.t) * 40 + im.t) * k; y += noise1((t - im.t) * 40 + im.t + 50) * k;
  }
  return [x, y];
}

// ---------- дети (та же конструкция, что Петя в выпуске №1) ----------
function blinkAt(t, seed = 0) {
  let b = 0;
  const n0 = Math.floor((t - 0.8 - seed) / 3.1);
  for (let n = n0 - 1; n <= n0 + 1; n++) {
    const tn = 0.8 + seed + n * 3.1 + hash(n + seed * 7) * 1.3, d = Math.abs(t - tn);
    if (d < 0.09) b = Math.max(b, 1 - d / 0.09);
  }
  return b;
}
function kid(t, o, seed = 0) {
  const br = Math.sin(t * 2.6 + seed) * 0.018;
  return Object.assign({ x: 540, y: GROUND, s: 1, rot: 0, sx: 1 + br, sy: 1 - br, lookX: 0, lookY: 0, eye: 1, pupil: 1,
    blink: blinkAt(t, seed), happy: 0, brow: 0, mouth: 'smile', mo: 0, blush: 0, sweat: 0, shake: 0,
    hair: 0, armsUp: 0, wave: 0, hold: 0, point: 0, walk: 0, hearts: 0, flip: 1, goggles: 0, stars: 0 }, o);
}
// прыжок/приземление: смещение вверх и сплющивание
function hop(P, t, t0, d = 0.4, hgt = 160) {
  const e = inv(t0, t0 + d, t);
  if (e > 0 && e < 1) { const arc = Math.sin(e * Math.PI); P.y -= arc * hgt; P.sy += 0.1 * arc; P.sx -= 0.07 * arc; }
  const l = inv(t0 + d, t0 + d + 0.28, t);
  if (l > 0 && l < 1) { const q = Math.sin(l * Math.PI) * (1 - l) * 0.22; P.sx += q; P.sy -= q; }
}
function kidPoint(P, lx, ly) {
  const c = Math.cos(P.rot), s = Math.sin(P.rot);
  const x = lx * P.s * P.sx * P.flip, y = ly * P.s * P.sy;
  return [P.x + x * c - y * s, P.y + x * s + y * c];
}
function armAngle(P, d, t) {
  let a = lerp(Math.PI * 0.36, -Math.PI * 0.4, P.armsUp);
  if (d === 1 && P.hold) a = lerp(a, -0.12, P.hold);
  if (d === -1 && P.point) a = lerp(a, -Math.PI * 0.3, P.point);
  if (d === 1 && P.wave) a = lerp(a, -Math.PI * 0.32 + Math.sin(t * 13) * 0.42, P.wave);
  if (P.armsUp > 0.5) a += Math.sin(t * 23 + d) * 0.08 * P.armsUp;
  return a;
}
function kidHand(P, d, t) {   // мировые координаты кисти (d = 1 — правая рука)
  const a = d === 1 && P.hold ? lerp(Math.PI * 0.36, -0.12, P.hold) : armAngle(P, d, t);
  return kidPoint(P, d * 108 + d * Math.cos(a) * 84, -165 + Math.sin(a) * 84);
}

function drawKid(P, t, look, shadow = true) {
  const s = P.s;
  if (shadow) {
    const air = clamp((GROUND - P.y) / 400);
    ctx.fillStyle = `rgba(20,30,10,${0.22 * (1 - air)})`;
    ctx.beginPath(); ctx.ellipse(P.x, GROUND + 6, 105 * s * (1 - air * 0.5), 16 * s, 0, 0, TAU); ctx.fill();
  }
  const jx = P.shake ? noise1(t * 31) * P.shake : 0, jy = P.shake ? noise1(t * 29 + 9) * P.shake * 0.6 : 0;
  ctx.save();
  ctx.translate(P.x + jx, P.y + jy); ctx.rotate(P.rot); ctx.scale(s * P.sx * P.flip, s * P.sy);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // ноги
  for (const d of [-1, 1]) {
    const step = P.walk ? Math.sin(t * 14 + (d > 0 ? Math.PI : 0)) : 0;
    const lift = P.walk ? Math.max(0, step) * 16 : 0, fx = step * 10 * P.walk;
    ctx.strokeStyle = C.ink; ctx.lineWidth = 13;
    ctx.beginPath(); ctx.moveTo(d * 36, -45); ctx.lineTo(d * 44 + fx, -10 - lift); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(d * 56 + fx, -7 - lift, 30, 15, 0, 0, TAU);
    ctx.fillStyle = look.shoe || look.body; ctx.fill(); ctx.lineWidth = 6; ctx.stroke();
  }
  // руки
  for (const d of [-1, 1]) {
    const a = armAngle(P, d, t), sx = d * 108, sy = -165;
    const ex = sx + d * Math.cos(a) * 84, ey = sy + Math.sin(a) * 84;
    const mx = sx + d * Math.cos(a - 0.35) * 46, my = sy + Math.sin(a) * 46 + 10;
    ctx.strokeStyle = C.ink; ctx.lineWidth = 13;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(mx, my, ex, ey); ctx.stroke();
    ctx.beginPath(); ctx.arc(ex, ey, 17, 0, TAU); ctx.fillStyle = look.body; ctx.fill(); ctx.lineWidth = 6; ctx.stroke();
    if (d === -1 && P.point > 0.5) {   // указательный палец
      ctx.beginPath(); ctx.moveTo(ex - 8, ey - 10); ctx.lineTo(ex - 22, ey - 32); ctx.lineWidth = 9; ctx.stroke();
    }
  }
  // косички Лизы и пучок мамы — за телом
  if (look.hair === 'tails') {
    for (const d of [-1, 1]) {
      const sw = Math.sin(t * 3 + d) * 0.08 + P.hair * Math.sin(t * 30 + d) * 0.1, up = P.hair * 0.5;
      ctx.save(); ctx.translate(d * 100, -270); ctx.rotate(d * (0.5 + up) + sw);
      ctx.beginPath(); ctx.ellipse(d * 40, 26, 34, 52, d * -0.3, 0, TAU); ctx.fillStyle = '#6B3A2A'; ctx.fill(); stroke(7);
      ctx.beginPath(); ctx.ellipse(d * 54, 58, 9, 16, 0, 0, TAU); ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 5; ctx.stroke();
      ctx.restore();
    }
  }
  if (look.hair === 'bun') {
    ctx.beginPath(); ctx.arc(0, -318, 46, 0, TAU); ctx.fillStyle = '#4A2C24'; ctx.fill(); stroke(7);
  }
  // тело
  ctx.beginPath(); ctx.ellipse(0, -165, 118, 138, 0, 0, TAU);
  const g = ctx.createRadialGradient(-40, -230, 20, 0, -165, 160);
  g.addColorStop(0, look.light); g.addColorStop(1, look.body);
  ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = C.ink; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, -76, 64, 42, 0, 0, TAU); ctx.fillStyle = look.belly; ctx.fill();
  // шкура у предков
  if (look.fur) {
    ctx.save(); ctx.beginPath(); ctx.ellipse(0, -165, 114, 134, 0, 0, TAU); ctx.clip();
    ctx.beginPath(); ctx.moveTo(-130, -40); ctx.lineTo(70, -200); ctx.lineTo(150, -150); ctx.lineTo(150, 0); ctx.lineTo(-130, 0); ctx.closePath();
    ctx.fillStyle = '#F2A93B'; ctx.fill(); stroke(7);
    ctx.fillStyle = '#8A4B1E';
    for (const [x, y, r] of [[-60, -40, 11], [-10, -80, 9], [40, -110, 10], [60, -50, 12], [10, -30, 8], [95, -90, 8], [-90, -10, 7]]) { ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.75, 0.4, 0, TAU); ctx.fill(); }

// ---------- сцена 0: хук — ноги над пропастью ----------
const TOWERS = [[-260, -300, 150, 150, 2.2, '#8E6CDF'], [130, -360, 190, 140, 1.8, '#5EC2F2'], [-80, 40, 160, 180, 2.5, '#FF9F1C'],

    ctx.fillStyle = ['#FF4D6D', '#FFE14D', '#7CD3FF', '#fff'][i % 4];

  const g = ctx.createRadialGradient(540, 900, 200, 540, 900, 1250);
  g.addColorStop(0, 'rgba(20,10,40,0)'); g.addColorStop(1, 'rgba(20,10,40,0.85)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // ноги Тёмы свисают над пропастью (вид сверху, от первого лица)
  for (const d of [-1, 1]) {
    const sw = Math.sin(t * 2.4 + d) * 26 + noise1(t * 22 + d * 5) * 6, x = 540 + d * 165 + sw;

    ctx.strokeStyle = C.ink; ctx.lineWidth = 120; ctx.stroke(); ctx.strokeStyle = '#3F6FB5'; ctx.lineWidth = 104; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 20; ctx.beginPath(); ctx.moveTo(540 + d * 150 - 26, H + 80); ctx.quadraticCurveTo(540 + d * 160 - 26, 1800, x - 26, 1640); ctx.stroke();
    withT(x, 1540, d * 0.1 + sw * 0.004, 1, () => {   // кроссовок сверху: носок смотрит в пропасть
      ctx.beginPath(); ctx.moveTo(-62, 90); ctx.bezierCurveTo(-74, -20, -60, -120, 0, -126); ctx.bezierCurveTo(60, -120, 74, -20, 62, 90); ctx.closePath();
      ctx.fillStyle = LOOK.tema.shoe; ctx.fill(); stroke(9);
      ctx.beginPath(); ctx.moveTo(-48, -60); ctx.bezierCurveTo(-46, -100, -30, -114, 0, -116); ctx.bezierCurveTo(30, -114, 46, -100, 48, -60); ctx.quadraticCurveTo(0, -76, -48, -60); ctx.closePath();
      ctx.fillStyle = '#F4F1E8'; ctx.fill(); stroke(6);

function drawEnd(t) {

    const st = S.end[0] + 0.2 + hash(i + 50) * 1.2, sp = 260 + hash(i + 90) * 260;

    const y = ((t - st) * sp) % 2200 - 120, x = hash(i) * W + Math.sin(t * 2 + i) * 30;
    ctx.save(); ctx.translate(x, y); ctx.rotate(t * (2 + hash(i + 7) * 4) + i); ctx.scale(1, Math.sin(t * 6 + i));
    ctx.fillStyle = ['#FF4D6D', '#FFE14D', '#22B8A7', '#8E6CDF', '#FF9F1C', '#FFFFFF'][i % 6];

  }
  const kp = pop(t, ws('l28', /^фобия/) - 0.08, 0.4);
  withT(540, 330, -0.04 + Math.sin(t * 2.2) * 0.02, kp, () => {
    ctx.fillStyle = 'rgba(30,10,40,0.25)'; rr(-414, -80, 840, 170, 85); ctx.fill();
    ctx.fillStyle = C.chunk[0]; rr(-420, -86, 840, 170, 85); ctx.fill(); stroke(9);
    text('ФОБИЯ №3 ИЗ 100', 0, 2, 82, { fill: '#fff', sw: 14 });
  });
  const tq = ws('l28', /^какую/);
  [[-290, 0.0, 0.1], [0, 0.12, -0.06], [290, 0.24, 0.08]].forEach(([dx, d, rot], i) => {
    const k = pop(t, tq - 0.05 + d, 0.35);
    withT(540 + dx, 560 + Math.sin(t * 3 + i) * 10, rot + Math.sin(t * 2 + i) * 0.04, k, () => {
      ctx.fillStyle = '#fff'; rr(-105, -120, 210, 240, 30); ctx.fill(); stroke(8);
      ctx.fillStyle = [C.chunk[3], C.chunk[1], C.chunk[2]][i]; rr(-80, -95, 160, 190, 20); ctx.fill();
      text('?', 0, 6, 140, { fill: '#fff', sw: 16 });
    });
  });
  const tc = ws('l28', /^пиши/);
  const kc = pop(t, tc - 0.05, 0.35), bob = Math.abs(Math.sin((t - tc) * 6)) * 18;
  withT(540, 790 - bob * 0.3, 0, kc, () => {
    ctx.beginPath(); ctx.moveTo(-200, 40); ctx.lineTo(-235, 100); ctx.lineTo(-140, 50); ctx.closePath(); ctx.fillStyle = '#fff'; ctx.fill(); stroke(7);
    ctx.fillStyle = '#fff'; rr(-330, -58, 660, 116, 58); ctx.fill(); stroke(7);
    ctx.fillRect(-215, 40, 85, 20);
    text('ПИШИ В КОММЕНТЫ', -36, 4, 50, { fill: C.ink, maxW: 500 });
    withT(262, 4 + Math.sin(t * 9) * 8, 0, 1, () => {
      ctx.beginPath(); ctx.moveTo(-13, -34); ctx.lineTo(13, -34); ctx.lineTo(13, 0); ctx.lineTo(30, 0); ctx.lineTo(0, 34); ctx.lineTo(-30, 0); ctx.lineTo(-13, 0); ctx.closePath();
      ctx.fillStyle = C.red; ctx.fill(); stroke(6);
    });
  });
}

function drawBadge(t) {
  const k = pop(t, S.park[0] + 0.4, 0.4) * (1 - inv(S.end[0], S.end[0] + 0.25, t));
  withT(540, 172, 0, k, () => {
    setFont(40); const w = ctx.measureText('100 ФОБИЙ · №3').width + 70;
    ctx.fillStyle = 'rgba(25,12,45,0.72)'; rr(-w / 2, -36, w, 72, 36); ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.stroke();
    text('100 ФОБИЙ · №3', 0, 2, 40, { fill: '#fff' });
  });
}

function drawScene(i, t) {
  const [sx, sy] = shakeAt(t);
  ctx.save(); ctx.translate(sx, sy); SCENES[i].draw(t); ctx.restore();
}
function renderFrame(t) {
  T = t;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.clearRect(0, 0, W, H);
  let i = 0; SCENES.forEach((s, n) => { if (t >= s.t) i = n; });
  const sc = SCENES[i], k = inv(sc.t, sc.t + 0.45, t);
  if (sc.tr === 'swirl' && k < 1) { /* выше */ } else if (i > 0 && sc.tr === 'iris' && k < 1) {
    drawScene(i - 1, t);
    const cx = 540, cy = 1000, r = easeInOut(k) * 2300 + 1;
    ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.clip(); drawScene(i, t); ctx.restore();
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.lineWidth = 24; ctx.strokeStyle = '#fff'; ctx.stroke();
  } else drawScene(i, t);
  if (i > 0 && sc.tr === 'swirl' && k < 1) {   // «машина времени»: спираль затягивает старую сцену
    const kk = easeInOut(k);
    ctx.save(); ctx.translate(540, 900); ctx.rotate(kk * 3); ctx.scale(1 - kk * 0.9, 1 - kk * 0.9); ctx.translate(-540, -900); drawScene(i - 1, t); ctx.restore();
    ctx.save(); ctx.beginPath(); ctx.arc(540, 900, kk * 2300 + 1, 0, TAU); ctx.clip(); drawScene(i, t); ctx.restore();
    ctx.save(); ctx.translate(540, 900); ctx.rotate(-t * 4); ctx.globalAlpha = 1 - kk;
    for (let j = 0; j < 8; j++) { ctx.rotate(TAU / 8); ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(400, -200, 900, 200); ctx.lineWidth = 30; ctx.strokeStyle = j % 2 ? '#FFE14D' : '#8E6CDF'; ctx.stroke(); }
    ctx.restore();
  }
  if (sc.tr === 'flash') { const f = 1 - inv(sc.t, sc.t + 0.4, t); if (f > 0) { ctx.fillStyle = `rgba(255,255,255,${f})`; ctx.fillRect(0, 0, W, H); } }
  drawBadge(t);
  drawCaptions(t);
}

async function ready() {
  await Promise.all(['900 40px RubikC', '900 40px RubikL', '700 40px RubikC', '700 40px RubikL'].map(f => document.fonts.load(f)));
  return document.fonts.check('900 40px RubikC');
}
window.setup = setup; window.renderFrame = renderFrame; window.ready = ready;

// предпросмотр в обычном браузере: ?preview
if (location.search.includes('preview')) {
  fetch('build/timeline.json').then(r => r.json()).then(async tl => {
    await ready(); setup(tl);
    const t0 = performance.now();
    const loop = () => { renderFrame(((performance.now() - t0) / 1000) % tl.total); requestAnimationFrame(loop); };
    loop();
  });
}
</script>
</body>
</html>
