<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Фобия №2 — анимация</title>
<style>
  @font-face { font-family: 'RubikC'; font-weight: 900; src: url('node_modules/@fontsource/rubik/files/rubik-cyrillic-900-normal.woff2') format('woff2'); }
  @font-face { font-family: 'RubikL'; font-weight: 900; src: url('node_modules/@fontsource/rubik/files/rubik-latin-900-normal.woff2') format('woff2'); }
  @font-face { font-family: 'RubikC'; font-weight: 700; src: url('node_modules/@fontsource/rubik/files/rubik-cyrillic-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'RubikL'; font-weight: 700; src: url('node_modules/@fontsource/rubik/files/rubik-latin-700-normal.woff2') format('woff2'); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
'use strict';
// Мультик «Фобия №2 из 100: талассофобия» — спуск на дно Марианской впадины.
// Всё рисуется детерминированно от времени t: renderFrame(t) → кадр.
// Мир — вертикальная лента: батискаф стоит на SUB_Y, мир прокручивается вверх.
// Прокрутка (пиксели) и глубина на счётчике (метры) — разные функции времени:
// прокрутка идёт почти равномерно, а счётчик доходит до каждой отметки ровно к реплике.
const W = 1080, H = 1920, TAU = Math.PI * 2, SUB_Y = 860, V = 380, BOTTOM = 10935, SURF = 92;
const FONT = 'RubikC, RubikL, sans-serif';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const C = {
  ink: '#0A1626', body: '#FFB547', belly: '#FFDB94', yellow: '#FFE14D', red: '#FF4D6D',
  sub: '#FFD23F', subLo: '#E39E00', metal: '#B7C2CE', metalLo: '#6E7B8A',
};

// ---------- утилиты ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeIn = k => k * k * k;
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOutBack = (k, s = 1.9) => k <= 0 ? 0 : 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2);
const pop = (t, t0, d = 0.32) => easeOutBack(inv(t0, t0 + d, t));
const bump = (t, t0, d) => { const k = inv(t0, t0 + d, t); return k > 0 && k < 1 ? Math.sin(k * Math.PI) : 0; };
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const noise1 = x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u) * 2 - 1; };
const frac = x => x - Math.floor(x);
const mod = (x, m) => ((x % m) + m) % m;
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, k) { const A = hex2rgb(a), B = hex2rgb(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], clamp(k)))).join(',')})`; }
function rgba(h, a) { const [r, g, b] = hex2rgb(h); return `rgba(${r},${g},${b},${clamp(a)})`; }
function stops(list, x) {   // кусочно-линейная палитра [[x, '#hex'], ...]
  if (x <= list[0][0]) return list[0][1];
  for (let i = 0; i < list.length - 1; i++) {
    const [x0, a] = list[i], [x1, b] = list[i + 1];
    if (x < x1) return mix(a, b, (x - x0) / (x1 - x0));
  }
  return list[list.length - 1][1];
}

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function setFont(size, weight = 900) { ctx.font = `${weight} ${size}px ${FONT}`; }
function text(str, x, y, size, o = {}) {
  const { fill = '#fff', stroke = C.ink, sw = 0, weight = 900, align = 'center', maxW = 0 } = o;
  setFont(size, weight);
  if (maxW) { const w = ctx.measureText(str).width; if (w > maxW) { size *= maxW / w; setFont(size, weight); } }
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (sw) { ctx.lineJoin = 'round'; ctx.miterLimit = 2; ctx.lineWidth = sw; ctx.strokeStyle = stroke; ctx.strokeText(str, x, y); }
  ctx.fillStyle = fill; ctx.fillText(str, x, y);
}
function withT(x, y, rot, sc, fn, alpha = 1) {
  if (sc <= 0.001 || alpha <= 0.001) return;
  ctx.save(); ctx.globalAlpha *= clamp(alpha); ctx.translate(x, y); if (rot) ctx.rotate(rot); if (sc !== 1) ctx.scale(sc, sc); fn(); ctx.restore();
}
function stroke(w = 5, col = C.ink) { ctx.lineWidth = w; ctx.strokeStyle = col; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); }
function glow(x, y, r, col, a) {   // аддитивное свечение
  if (a <= 0) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, rgba(col, a)); g.addColorStop(0.35, rgba(col, a * 0.45)); g.addColorStop(1, rgba(col, 0));
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.restore();
}
const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

// ---------- тайминги ----------
let TL, L = {}, CUES = [], PAGES = [], KEYS = [], STAB = [], OBJ = {}, ZONE_T = [];
let tDive, tTal, tLight, tReveal, tBottom, tCrack1, tCrack2, tTon, tZoom, tEverest, tKm, tCTA, tSnail, YF = 0, SC = 0;
let impulses = [];
const SD = 1 / 240;

function findWord(id, re) {
  const w = L[id].words.find(x => re.test(x.w.toLowerCase()));
  if (!w) throw new Error(`нет слова ${re} в ${id}`);
  return w;
}

function setup(tl) {
  TL = tl; L = {}; tl.lines.forEach(l => L[l.id] = l);
  tTal = findWord('l1', /^талассо/).s;
  tDive = L.l1.end - 0.4;
  KEYS = [[tDive, 0], [L.l2.start, 40], [L.l3.start, 200], [L.l4.start, 332], [L.l5.start, 1000],
    [L.l7.start, 2000], [L.l8.start, 3800], [L.l9.start, 6000], [L.l10.start, 8336], [L.l11.start, BOTTOM]];
  tBottom = L.l11.start;
  tLight = L.l3.end + 0.15;
  tReveal = findWord('l6', /^светится/).s - 0.1;
  tSnail = L.l10.sentences[1][0] - 0.2;
  tCrack1 = L.l12.start + 0.3;
  tTon = findWord('l12', /^тонн/).s;
  tCrack2 = tTon + 0.05;
  tZoom = L.l13.start - 0.3;
  tEverest = findWord('l13', /^эверест/).s;
  tKm = findWord('l13', /^2$/).s;
  tCTA = findWord('l14', /^пиши/).s;

  // моменты, когда объект проплывает мимо батискафа (tc) — по ним же замедляется прокрутка
  OBJ = {
    fish: { tc: tDive + 1.2, dy: 120 },
    diver: { tc: L.l2.start + 0.7, dy: 30 },
    shark: { tc: L.l3.start + 1.0, dy: 300 },
    record: { tc: L.l4.start + 0.9, dy: 60 },
    angler: { tc: tReveal + 0.5, dy: 250 },
    whale: { tc: L.l7.start + 1.6, dy: 330 },
    titanic: { tc: L.l8.sentences[1][0] + 0.5, dy: 330 },
  };
  buildScroll();
  for (const k in OBJ) OBJ[k].Y = scrollAt(OBJ[k].tc) + OBJ[k].dy;
  YF = scrollAt(tBottom + 0.01) + 172;
  // когда счётчик пересекает границы зон
  ZONE_T = ZONES.map(([d]) => { for (let t = tDive; t < tBottom + 1; t += 0.01) if (depthAt(t) >= d) return t; return 0; });
  impulses = [
    { t: tReveal + 0.05, a: 7, d: 0.4 }, { t: L.l8.sentences[1][0] - 0.1, a: 9, d: 0.6 }, { t: L.l9.start, a: 8, d: 0.5 },
    { t: tBottom - 0.02, a: 18, d: 0.55 }, { t: tCrack1, a: 14, d: 0.4 }, { t: tCrack2, a: 22, d: 0.5 },
  ];
  buildCaptions(); buildCues();
  return { cues: CUES };
}

// ---------- глубина и прокрутка ----------
// Пока звучит реплика про отметку, счётчик почти стоит (ползёт на CREEP пути),
// а в паузе перед следующей отметкой быстро проваливается до неё.
const CREEP = 0.14;
function holdEnd(i) {   // конец последней реплики перед следующей отметкой
  if (i === 0) return KEYS[0][0];
  const t1 = KEYS[i + 1][0];
  let e = KEYS[i][0];
  for (const l of TL.lines) if (l.end <= t1 - 0.05 && l.end > e) e = l.end;
  return Math.min(e, t1 - 0.45);
}
function depthAt(t) {
  if (t <= KEYS[0][0]) return 0;
  for (let i = 0; i < KEYS.length - 1; i++) {
    const [t0, d0] = KEYS[i], [t1, d1] = KEYS[i + 1];
    if (t >= t1) continue;
    const te = holdEnd(i), dm = i === 0 ? d0 : lerp(d0, d1, CREEP);
    if (t < te) return lerp(d0, dm, inv(t0, te, t));
    return lerp(dm, d1, easeInOut(inv(te, t1, t)));
  }
  return BOTTOM;
}
function rushAt(t) {   // 1 — счётчик проваливается (кроме последнего отрезка: там посадка)
  for (let i = 1; i < KEYS.length - 2; i++) {
    const te = holdEnd(i), t1 = KEYS[i + 1][0];
    if (t > te - 0.3 && t < t1 + 0.3) return bump(t, te - 0.3, t1 - te + 0.6);
  }
  return 0;
}
function slowdowns() {
  return [[OBJ.angler.tc, 0.45, 1.0], [OBJ.whale.tc, 0.4, 1.3], [OBJ.titanic.tc, 0.55, 1.4], [tSnail + 0.6, 0.35, 1.0]];
}
function speedAt(t, slow) {
  if (t <= tDive || t >= tBottom) return 0;
  let v = V * easeOut(inv(tDive, tDive + 0.9, t)) * (1 - easeInOut(inv(tBottom - 1.9, tBottom, t)));
  for (const [tc, a, w] of slow) v *= 1 - a * Math.exp(-(((t - tc) / w) ** 2));
  const early = 1.4 * (1 - inv(L.l2.start, L.l3.start - 0.5, t));   // от поверхности уходим быстрее
  return v * (1 + 1.3 * rushAt(t) + early);
}
function buildScroll() {
  const slow = slowdowns();
  STAB = [0]; let s = 0;
  const n = Math.ceil((TL.total + 1) / SD);
  for (let i = 1; i <= n; i++) { s += speedAt((i - 0.5) * SD, slow) * SD; STAB.push(s); }
}
function scrollAt(t) {
  const x = clamp(t, 0, TL.total + 0.99) / SD, i = Math.floor(x);
  return lerp(STAB[i], STAB[Math.min(i + 1, STAB.length - 1)], x - i);
}
const scr = Y => Y - SC + SUB_Y;   // мировая Y → экран

// ---------- субтитры ----------
const CAP_SIZE = 74, CAP_MAXW = 880, CAP_Y = 1420;
const capWord = w => w.w.replace(/_/g, ' ').toUpperCase();
function buildCaptions() {
  PAGES = []; setFont(CAP_SIZE);
  for (const l of TL.lines) {
    if (l.hide_caption) continue;
    let cur = [];
    const flush = () => { if (cur.length) PAGES.push({ words: cur }); cur = []; };
    for (const w of l.words) {
      const width = ctx.measureText([...cur, w].map(capWord).join('  ')).width;
      if (cur.length && (width > CAP_MAXW || cur.length >= 3)) flush();
      cur.push(w);
      if (/[.!?…]»?$/.test(w.w)) flush();
    }
    flush();
  }
  PAGES.forEach(p => p.s = p.words[0].s - 0.06);
  PAGES.forEach((p, i) => {
    const last = p.words[p.words.length - 1].e, next = PAGES[i + 1];
    p.e = next ? Math.min(next.s, last + 0.55) : last + 0.8;
  });
}
function drawCaptions(t) {
  const p = PAGES.find(p => t >= p.s && t < p.e);
  if (!p) return;
  const sc = lerp(0.82, 1, easeOutBack(inv(p.s, p.s + 0.16, t)));
  setFont(CAP_SIZE);
  const words = p.words.map(capWord);
  const space = CAP_SIZE * 0.36;
  let cur = -1; p.words.forEach((w, i) => { if (t >= w.s - 0.03) cur = i; });
  const grow = words.map((w, i) => i === cur ? 1 + 0.1 * easeOutBack(inv(p.words[i].s - 0.03, p.words[i].s + 0.1, t)) : 1);
  const widths = words.map((w, i) => (ctx.measureText(w).width + 16) * grow[i]);
  const total = widths.reduce((a, b) => a + b, 0) + space * (words.length - 1);
  const fit = Math.min(1, CAP_MAXW / total);
  withT(540, CAP_Y, 0, sc * fit, () => {
    let x = -total / 2;
    words.forEach((w, i) => {
      withT(x + widths[i] / 2, 0, 0, grow[i], () => text(w, 0, 0, CAP_SIZE, { fill: i === cur ? C.yellow : '#fff', sw: 16 }));
      x += widths[i] + space;
    });
  });
}

// ---------- звук: метки для audio.py ----------
function buildCues() {
  CUES = [];
  const cue = (t, type, o = {}) => CUES.push({ t: +t.toFixed(3), type, ...o });
  // кривая глубины — по ней audio.py темнит музыку
  for (let t = 0; t <= TL.total + 0.05; t += 0.1) cue(t, 'depth', { d: +(t < tZoom ? depthAt(t) : BOTTOM).toFixed(1) });
  cue(0, 'music', { gain: 0.8, fade: 0.01 });
  cue(tDive, 'music', { gain: 1, fade: 1 });
  cue(L.l12.start - 0.4, 'music', { gain: 0.25, fade: 0.6 });
  cue(tZoom + 0.3, 'music', { gain: 1, fade: 1.2 });
  cue(TL.total - 1.8, 'music', { gain: 0, fade: 1.7 });
  // поверхность и погружение
  cue(0, 'waves', { dur: tDive + 0.6, gain: 0.8 });
  cue(tDive - 0.05, 'splash', { gain: 0.9 });
  cue(tDive + 0.1, 'bubbles', { dur: 2.6, gain: 0.8 });
  KEYS.slice(1).forEach(([t, d], i) => cue(t - 0.02, 'tick', { pitch: 1.25 - i * 0.06, gain: 0.45 }));
  // сонар
  const busy = [OBJ.angler.tc, tReveal, L.l8.start, L.l9.start, tBottom, tCrack1, tCrack2];
  for (let t = tDive + 1.6; t < tBottom + 2.5; t += 3.3) {
    if (busy.some(b => Math.abs(b - t) < 0.5)) continue;
    cue(t, 'sonar', { pitch: lerp(1, 0.78, depthAt(t) / BOTTOM), gain: 0.55 });
  }
  cue(OBJ.diver.tc - 0.6, 'bubbles', { dur: 1.6, gain: 0.45 });
  cue(OBJ.shark.tc - 0.5, 'swish', { gain: 0.7 });
  cue(OBJ.record.tc - 0.4, 'bubbles', { dur: 1.2, gain: 0.35 });
  cue(tLight, 'lights', { gain: 0.8 });
  cue(tReveal, 'sting', { gain: 0.8 });
  cue(OBJ.whale.tc - 1.1, 'whale', { gain: 0.9 });
  cue(L.l8.sentences[1][0] - 0.15, 'boom', { gain: 0.8 });
  cue(L.l8.sentences[1][0] + 0.4, 'groan', { gain: 0.7 });
  cue(L.l9.start - 0.05, 'sting', { gain: 0.7, low: 1 });
  cue(L.l9.start + 0.2, 'heart', { dur: tBottom + 1.2 - L.l9.start, gain: 0.9 });
  cue(tSnail + 0.45, 'boop', { gain: 0.6 });
  cue(tBottom - 0.02, 'thud', { gain: 1 });
  cue(tBottom, 'dust', { gain: 0.6 });
  // давление
  cue(L.l12.start - 0.15, 'groan', { gain: 0.9 });
  cue(tCrack1, 'crack', { gain: 0.8 });
  cue(tCrack2, 'crack', { gain: 1 });
  cue(tTon - 0.45, 'whistle', { gain: 0.5 });
  cue(tTon - 0.02, 'thud', { gain: 0.7 });
  cue(tCrack1 + 0.15, 'alarm', { dur: tZoom - tCrack1 - 0.1, gain: 0.35 });
  // Эверест и финал
  cue(tZoom, 'whoosh', { gain: 0.8 });
  cue(tEverest - 0.15, 'rumble', { dur: 1.3, gain: 0.8 });
  cue(tKm - 0.05, 'ding', { gain: 0.6 });
  cue(tCTA - 0.05, 'pop', { gain: 0.6 });
}

// ---------- камера ----------
function shakeAt(t) {
  let x = 0, y = 0;
  for (const im of impulses) {
    if (t < im.t || t > im.t + im.d) continue;
    const k = Math.pow(1 - (t - im.t) / im.d, 2) * im.a;
    x += noise1((t - im.t) * 40 + im.t) * k; y += noise1((t - im.t) * 40 + im.t + 50) * k;
  }
  return [x, y];
}

// ---------- Петя (только голова — он сидит внутри батискафа) ----------
function blinkAt(t) {
  let b = 0;
  const n0 = Math.floor((t - 0.8) / 3.1);
  for (let n = n0 - 1; n <= n0 + 1; n++) {
    const tn = 0.8 + n * 3.1 + hash(n) * 1.3, d = Math.abs(t - tn);
    if (d < 0.09) b = Math.max(b, 1 - d / 0.09);
  }
  return b;
}
function faceAt(t) {
  const P = { lookX: 0, lookY: 0, eye: 1, pupil: 1, blink: blinkAt(t), brow: 0, mouth: 'smile', mo: 0.4,
    sweat: 0, blush: 0, happy: 0, hair: 0, shake: 0 };
  const by = (id, d = 0.15) => t < L[id].start - d;
  if (t < tTal - 0.1) return Object.assign(P, { mo: 0.6, blush: 0.5, lookX: 0.1 });
  if (t < tDive) return Object.assign(P, { mo: 0.12, brow: -0.6, lookX: 0.35, lookY: -0.2 });
  if (by('l2')) return Object.assign(P, { mouth: 'o', mo: 0.35, eye: 1.15, lookY: -0.8, hair: 0.6, blink: 0 });
  if (by('l3')) return Object.assign(P, { mo: 0.35, lookX: -0.9, lookY: -0.1 });
  if (t < tLight - 0.05) {   // мимо проплывает акула (справа налево, ниже)
    const sx = sharkX(t);
    return Object.assign(P, { mouth: 'flat', brow: 0.6, eye: 1.1, lookX: clamp((sx - 540) / 320, -1, 1), lookY: 0.7 });
  }
  if (by('l4')) return Object.assign(P, { mouth: 'o', mo: 0.25, eye: 1.1, brow: 0.3, lookY: 0.4 });
  if (by('l5')) return Object.assign(P, { mo: 0.2, brow: 0.3, lookX: -0.9 });
  if (t < tReveal) return Object.assign(P, { mouth: 'wavy', eye: 1.15, pupil: 0.75, brow: 1, sweat: 0.6, lookX: Math.sin(t * 1.4), lookY: 0.2 });
  if (by('l7')) {
    const k = 1 - inv(tReveal, tReveal + 1.5, t);
    return Object.assign(P, { mouth: 'o', mo: 0.8, eye: 1.35, pupil: 0.5, brow: 1, shake: 1.5 + 4 * k, lookX: 0.9, lookY: 0.7,
      sweat: 1, hair: 1, blink: 0 });
  }
  if (by('l8')) return Object.assign(P, { mouth: 'o', mo: 0.45, eye: 1.2, brow: 0.5, lookX: clamp((whaleX(t) - 300) / 500, -1, 1), lookY: 0.7 });
  if (by('l9')) return Object.assign(P, { mouth: 'wavy', brow: 1, eye: 1.05, lookY: 0.9, lookX: -0.2, sweat: 0.4 });
  if (t < tSnail + 0.4) return Object.assign(P, { mouth: 'wavy', eye: 1.3, pupil: 0.55, brow: 1, sweat: 1, shake: 2.2,
    lookX: Math.sin(t * 4.2) > 0 ? 0.9 : -0.9, lookY: 0.1, blink: 0 });
  if (t < tBottom - 0.3) return Object.assign(P, { mo: 0.7, eye: 1.2, blush: 0.7, lookX: 1, lookY: -0.1, brow: 0.2 });
  if (t < tBottom + 0.6) return Object.assign(P, { mouth: 'o', mo: 0.4, eye: 1.25, brow: 0.6, sweat: 0.6, lookY: 0.8, blink: 0 });
  if (by('l12', 0.1)) return Object.assign(P, { mo: 0.2, brow: 0.5, eye: 1.05, sweat: 0.4, lookY: 0.4 });
  if (t < tCrack1) return Object.assign(P, { mouth: 'flat', brow: 1, eye: 1.15, lookY: -1, sweat: 0.6 });
  return Object.assign(P, { mouth: 'o', mo: 1, eye: 1.45, pupil: 0.45, brow: 1, shake: 5, sweat: 1, hair: 1, lookY: -0.6, blink: 0 });
}
function drawPetyaHead(P, t) {
  const jx = P.shake ? noise1(t * 31) * P.shake : 0, jy = P.shake ? noise1(t * 29 + 9) * P.shake * 0.6 : 0;
  ctx.save(); ctx.translate(jx, jy);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // волосы
  ctx.strokeStyle = C.ink; ctx.lineWidth = 9;
  for (const d of [-1, 0, 1]) {
    const bx = d * 14, by = -298, len = 48 + 34 * P.hair;
    const ang = -Math.PI / 2 + d * lerp(0.55, 0.28, P.hair) + (P.hair ? Math.sin(t * 30 + d) * 0.05 * P.hair : 0);
    const ex = bx + Math.cos(ang) * len, ey = by + Math.sin(ang) * len;
    const cx = bx + Math.cos(ang) * len * 0.5 + d * lerp(14, 2, P.hair) + lerp(10, 0, P.hair), cy = by + Math.sin(ang) * len * 0.5;

function drawSnow(t, d) {

function wallW(d) { return lerp(0, 230, easeInOut(inv(4300, 6200, d))) + lerp(0, 110, inv(6200, BOTTOM, d)); }

    const rv = easeOut(inv(tReveal, tReveal + 0.35, t));
    withT(800 - (t - an.tc) * 18, scr(an.Y) + Math.sin(t * 1.3) * 10, 0, 0.95, () => angler(t, 0.12 + 0.88 * rv));
    if (rv > 0 && rv < 1) glow(800, scr(an.Y), 420, '#9FFFF0', 0.25 * (1 - rv));
  }
}
function snailPos(t) {   // рыба-слизень подплывает к иллюминатору и уплывает
  const a = easeOut(inv(tSnail, tSnail + 1.1, t)), b = easeIn(inv(tBottom - 0.9, tBottom - 0.1, t));
  return [lerp(1220, 690, a) + 700 * b, SUB_Y - 30 + Math.sin(t * 2.2) * 12 + 260 * b, a > 0 && b < 1];
}
function drawNearObjects(t) {
  const [x, y, vis] = snailPos(t);
  if (vis) withT(x, y, -0.05 + Math.sin(t * 2) * 0.05, 0.85, () => snailfish(t));
  // «1 тонна на 1 см²»
  if (t > L.l12.start - 0.2 && t < tZoom + 0.6) {
    const fy = scr(YF), a = inv(L.l12.start - 0.2, L.l12.start + 0.2, t);
    withT(190, fy - 4, 0, 1.3, () => {
      ctx.save(); ctx.globalAlpha *= a;
      rr(-23, -46, 46, 46, 4); ctx.fillStyle = '#E8EEF4'; ctx.fill(); stroke(5);
      text('1 см²', 0, 40, 40, { sw: 10 });
      ctx.restore();
      const k = inv(tTon - 0.45, tTon, t), land = t - tTon;
      if (k <= 0) return;
      const yy = lerp(-1100, -46, easeIn(k));
      const sq = land > 0 ? Math.sin(land * 18) * Math.exp(-land * 7) * 0.12 : 0;
      withT(0, yy, 0, 1, () => {
        ctx.scale(1 + sq, 1 - sq);
        ctx.beginPath(); ctx.arc(0, -150, 34, Math.PI, 0); stroke(16, '#2D343D');
        ctx.beginPath(); ctx.moveTo(-58, -146); ctx.lineTo(58, -146); ctx.lineTo(86, 0); ctx.lineTo(-86, 0); ctx.closePath();
        const g = ctx.createLinearGradient(0, -146, 0, 0); g.addColorStop(0, '#6B7685'); g.addColorStop(1, '#2D343D');
        ctx.fillStyle = g; ctx.fill(); stroke(6);
        text('1 Т', 0, -70, 64, { sw: 10 });
      });
    });
  }
}

// ---------- HUD ----------
function counterAlpha(t) { return inv(tDive + 0.02, tDive + 0.3, t) * (1 - inv(tZoom, tZoom + 0.3, t)); }
function drawCounter(t) {
  const a = counterAlpha(t);
  if (a <= 0) return;
  const d = depthAt(t), s = fmt(d);
  let hit = 0, last = -1;
  KEYS.slice(1).forEach(([kt], i) => { if (t >= kt - 0.02) last = i; });
  if (last >= 0) hit = 1 - inv(KEYS[last + 1][0], KEYS[last + 1][0] + 0.7, t);
  const sc = 1 + 0.14 * bump(t, KEYS[last + 1] ? KEYS[last + 1][0] - 0.05 : -9, 0.35);
  const size = 150;
  withT(540, 330, 0, sc, () => {
    setFont(size); const dw = ctx.measureText('0').width, spw = dw * 0.32;
    setFont(80); const uw = ctx.measureText('м').width;
    const chars = [...s];
    const total = chars.reduce((w, c) => w + (c === ' ' ? spw : dw), 0) + 22 + uw;
    let x = -total / 2;
    const fill = mix('#FFFFFF', C.yellow, hit);
    for (const c of chars) {
      if (c === ' ') { x += spw; continue; }
      text(c, x + dw / 2, 0, size, { fill, sw: 20, stroke: '#030A16' });
      x += dw;
    }
    text('м', x + 22 + uw / 2, 20, 80, { fill, sw: 14, stroke: '#030A16' });
  }, a);
  // зона
  let zi = 0; ZONES.forEach(([zd], i) => { if (d >= zd) zi = i; });
  const zt = ZONE_T[zi], kz = zi ? pop(t, zt, 0.4) : 1;
  const hades = zi === 4;
  withT(540, 440, 0, kz, () => {
    setFont(44); const label = ZONES[zi][1], w = ctx.measureText(label).width + 64;
    ctx.fillStyle = hades ? 'rgba(120,10,25,0.75)' : 'rgba(3,10,22,0.55)'; rr(-w / 2, -32, w, 64, 32); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = hades ? 'rgba(255,90,100,0.9)' : 'rgba(255,255,255,0.5)'; ctx.stroke();
    text(label, 0, 2, 44, { fill: hades ? '#FFD0D5' : '#E8F4FF' });
  }, a);
}
function drawProgress(t) {   // полоска «сколько до дна» слева
  const a = counterAlpha(t) * 0.9;
  if (a <= 0) return;
  const x = 44, y0 = 300, y1 = 1580, k = depthAt(t) / BOTTOM;
  ctx.save(); ctx.globalAlpha = a;
  rr(x - 7, y0, 14, y1 - y0, 7); ctx.fillStyle = 'rgba(255,255,255,0.14)'; ctx.fill();
  const g = ctx.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, '#5FD8FF'); g.addColorStop(1, '#FF4D6D');
  rr(x - 7, y0, 14, Math.max(14, (y1 - y0) * k), 7); ctx.fillStyle = g; ctx.fill();
  KEYS.slice(1).forEach(([, kd]) => { ctx.beginPath(); ctx.arc(x, lerp(y0, y1, kd / BOTTOM), 4, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fill(); });
  const my = lerp(y0, y1, k);
  ctx.beginPath(); ctx.arc(x, my, 15, 0, TAU); ctx.fillStyle = C.sub; ctx.fill(); stroke(4);
  text('ДНО', x + 2, y1 + 34, 26, { fill: '#FFB3BE', sw: 6, stroke: '#030A16' });
  ctx.restore();
}
function drawBadge(t) {
  const k = 1 - inv(TL.total - 0.6, TL.total, t);
  withT(540, 172, 0, k, () => {
    setFont(40); const w = ctx.measureText('100 ФОБИЙ · №2').width + 70;
    ctx.fillStyle = 'rgba(5,12,30,0.62)'; rr(-w / 2, -36, w, 72, 36); ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.stroke();
    text('100 ФОБИЙ · №2', 0, 2, 40, { fill: '#fff' });
  });
}
function drawTitle(t) {   // хук: «ТЕСТ НА ТАЛАССОФОБИЮ»
  const out = easeIn(inv(tDive - 0.4, tDive + 0.05, t));
  if (out >= 1) return;
  const y = -out * 260;
  withT(540, 318 + y, Math.sin(t * 2.2) * 0.015, 1, () => text('ТЕСТ  НА', 0, 0, 96, { sw: 18 }), 1 - out);
  withT(540, 440 + y, -0.03 + Math.sin(t * 2.6) * 0.02, 1 + 0.04 * Math.sin(t * 5), () =>
    text('ТАЛАССОФОБИЮ', 0, 0, 122, { fill: C.yellow, sw: 22, maxW: 980 }), 1 - out);
  withT(540, 548 + y, 0, 1, () => text('(СТРАХ  ГЛУБИНЫ)', 0, 0, 46, { fill: '#E8F8FF', sw: 12 }), 1 - out);
}

// ---------- финал: разрез впадины с Эверестом ----------
const DG = { top: 300, bot: 1280, left: 175, right: 1010 };
const dy = m => lerp(DG.top, DG.bot, m / BOTTOM);
function floorProfile() {   // [x, глубина]
  return [[DG.left, 5600], [250, 5900], [330, 6400], [395, BOTTOM], [470, BOTTOM], [560, 7000], [640, 6000], [760, 5700], [880, 5900], [DG.right, 5500]];
}
function everestPath(cx, base) {
  const h = 8849 / BOTTOM * (DG.bot - DG.top), wb = 300;
  const pts = [[-wb, 0], [-210, -h * 0.34], [-170, -h * 0.4], [-110, -h * 0.66], [-70, -h * 0.7], [-18, -h * 0.97], [0, -h], [30, -h * 0.9],
    [70, -h * 0.78], [110, -h * 0.6], [150, -h * 0.55], [220, -h * 0.28], [wb, 0]];
  ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(cx + x, base + y) : ctx.moveTo(cx + x, base + y)); ctx.closePath();
  return h;
}
function drawDiagram(t, a) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const g0 = ctx.createLinearGradient(0, 0, 0, H); g0.addColorStop(0, '#071428'); g0.addColorStop(1, '#020509');
  ctx.fillStyle = g0; ctx.fillRect(0, 0, W, H);
  // небо
  const sk = ctx.createLinearGradient(0, DG.top - 90, 0, DG.top); sk.addColorStop(0, '#5FBFFF'); sk.addColorStop(1, '#CDEFFF');
  ctx.fillStyle = sk; ctx.fillRect(DG.left, DG.top - 90, DG.right - DG.left, 90);
  // вода
  const prof = floorProfile();
  ctx.beginPath(); ctx.moveTo(DG.left, DG.top); ctx.lineTo(DG.right, DG.top);
  for (let i = prof.length - 1; i >= 0; i--) ctx.lineTo(prof[i][0], dy(prof[i][1]));
  ctx.closePath();
  const wg = ctx.createLinearGradient(0, DG.top, 0, DG.bot);
  WATER.forEach(([m, c]) => wg.addColorStop(m / BOTTOM, c));
  ctx.fillStyle = wg; ctx.fill();
  // дно
  ctx.beginPath(); prof.forEach(([x, m], i) => i ? ctx.lineTo(x, dy(m)) : ctx.moveTo(x, dy(m)));
  ctx.lineTo(DG.right, DG.bot + 140); ctx.lineTo(DG.left, DG.bot + 140); ctx.closePath();
  const fg = ctx.createLinearGradient(0, dy(5500), 0, DG.bot + 140); fg.addColorStop(0, '#4A4238'); fg.addColorStop(1, '#16130F');
  ctx.fillStyle = fg; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(160,150,130,0.6)'; ctx.stroke();
  // волны на поверхности
  ctx.beginPath(); for (let x = DG.left; x <= DG.right; x += 12) { const y = DG.top + Math.sin(x / 26 + t * 3) * 4; x === DG.left ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
  ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.stroke();
  // шкала
  for (let km = 0; km <= 10; km += 2) {
    const y = dy(km * 1000);
    ctx.beginPath(); ctx.moveTo(DG.left - 16, y); ctx.lineTo(DG.left, y); stroke(4, 'rgba(255,255,255,0.7)');
    text(km ? `${km} км` : '0', DG.left - 26, y, 34, { fill: '#DDEBFA', align: 'right', sw: 8, stroke: '#020509' });
  }
  ctx.beginPath(); ctx.moveTo(DG.left, DG.top); ctx.lineTo(DG.left, DG.bot); stroke(4, 'rgba(255,255,255,0.7)');
  // отметки пути
  const marks = [[2000, 'КАШАЛОТЫ'], [3800, 'ТИТАНИК'], [8336, 'РЫБЫ']];
  marks.forEach(([m, label], i) => {
    const k = pop(t, tZoom + 0.6 + i * 0.12, 0.3), y = dy(m);
    withT(820, y, 0, k, () => {
      ctx.beginPath(); ctx.moveTo(-120, 0); ctx.lineTo(-20, 0); ctx.setLineDash([8, 8]); stroke(3, 'rgba(255,255,255,0.55)'); ctx.setLineDash([]);
      text(label, 70, -16, 32, { sw: 8, stroke: '#020509' });
      text(fmt(m) + ' м', 70, 20, 30, { fill: C.yellow, sw: 8, stroke: '#020509' });
    });
  });
  // Эверест поднимается со дна впадины
  const ek = easeOutBack(inv(tEverest - 0.1, tEverest + 0.9, t), 1.2);
  if (ek > 0) {
    const cx = 432, h = 8849 / BOTTOM * (DG.bot - DG.top);
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, DG.bot + 2); ctx.clip();
    const base = DG.bot + h * (1 - ek);
    everestPath(cx, base);
    const eg = ctx.createLinearGradient(0, base - h, 0, base); eg.addColorStop(0, '#E9EEF5'); eg.addColorStop(0.25, '#9AA6B6'); eg.addColorStop(1, '#4C5562');
    ctx.fillStyle = eg; ctx.globalAlpha = a * 0.96; ctx.fill(); ctx.globalAlpha = a; stroke(5, '#1B222C');
    ctx.beginPath(); ctx.moveTo(cx - 70, base - h * 0.7); ctx.lineTo(cx - 18, base - h * 0.97); ctx.lineTo(cx, base - h); ctx.lineTo(cx + 30, base - h * 0.9);
    ctx.lineTo(cx + 70, base - h * 0.78); ctx.lineTo(cx + 40, base - h * 0.8); ctx.lineTo(cx + 10, base - h * 0.86); ctx.lineTo(cx - 30, base - h * 0.8); ctx.closePath();
    ctx.fillStyle = '#FFFFFF'; ctx.fill();
    ctx.restore();
    const kl = pop(t, tEverest + 0.75, 0.35), py = DG.bot - h;
    withT(cx - 228, py + 100, 0, kl, () => {
      setFont(36); const w = ctx.measureText('ЭВЕРЕСТ · 8 849 м').width + 44;
      ctx.fillStyle = 'rgba(255,255,255,0.95)'; rr(-w / 2, -30, w, 60, 30); ctx.fill(); stroke(5);
      text('ЭВЕРЕСТ · 8 849 м', 0, 2, 36, { fill: C.ink });
    });
    // скобка «2 км воды»
    const kb = easeOut(inv(tKm - 0.1, tKm + 0.4, t));
    if (kb > 0) {
      const bx = 345, ya = DG.top + 6, yb = lerp(ya, py, kb);
      ctx.beginPath(); ctx.moveTo(bx + 16, ya); ctx.lineTo(bx, ya); ctx.lineTo(bx, yb); ctx.lineTo(bx + 16, yb); stroke(7, C.yellow);
      ctx.beginPath(); ctx.moveTo(bx + 16, py); ctx.lineTo(cx - 6, py); ctx.setLineDash([6, 8]); stroke(3, C.yellow); ctx.setLineDash([]);
      withT(bx - 88, (ya + py) / 2, 0, pop(t, tKm + 0.2, 0.3), () => text('2 КМ', 0, 0, 64, { fill: C.yellow, sw: 14, stroke: '#020509' }));
    }
  }
  // «ты здесь»
  const ky = pop(t, tZoom + 0.75, 0.35);
  withT(432, DG.bot - 14, 0, ky, () => {
    ctx.beginPath(); ctx.arc(0, 0, 16, 0, TAU); ctx.fillStyle = C.sub; ctx.fill(); stroke(5);
    const bob = Math.sin(t * 5) * 6;
    text('ТЫ ЗДЕСЬ', -150, -4 + bob, 34, { fill: '#fff', sw: 9, stroke: '#020509' });
    ctx.beginPath(); ctx.moveTo(-70, -4 + bob); ctx.lineTo(-28, -2); stroke(5, '#fff');
  });
  ctx.restore();
}
function drawCTA(t) {
  const k = pop(t, tCTA - 0.05, 0.35);
  if (k <= 0) return;
  const bob = Math.abs(Math.sin((t - tCTA) * 5)) * 10;
  withT(540, 1580 - bob, 0, k, () => {
    ctx.fillStyle = '#fff'; rr(-330, -54, 660, 108, 54); ctx.fill(); stroke(7);
    ctx.beginPath(); ctx.moveTo(-200, 50); ctx.lineTo(-230, 98); ctx.lineTo(-140, 52); ctx.closePath(); ctx.fillStyle = '#fff'; ctx.fill(); stroke(7);
    ctx.fillRect(-212, 40, 80, 18);
    text('ПИШИ В КОММЕНТЫ', -30, 3, 48, { fill: C.ink, maxW: 500 });
    withT(258, 3 + Math.sin(t * 9) * 7, 0, 1, () => {
      ctx.beginPath(); ctx.moveTo(-13, -32); ctx.lineTo(13, -32); ctx.lineTo(13, 0); ctx.lineTo(30, 0); ctx.lineTo(0, 32); ctx.lineTo(-30, 0); ctx.lineTo(-13, 0); ctx.closePath();
      ctx.fillStyle = C.red; ctx.fill(); stroke(6);
    });
  });
}

// ---------- кадр ----------
let T = 0;
function drawWorld(t) {
  SC = scrollAt(t);
  const d = depthAt(t);
  drawWater(t, d);
  const sy = drawSky(t);
  drawRays(t, d);
  drawHookShadow(t);
  drawFarObjects(t, d);
  drawWalls(t, d);
  drawEyes(t, d);
  drawFloor(t);
  drawMidObjects(t, d);
  drawSnow(t, d);
  drawBeams(t);
  drawSub(t);
  drawSurfaceFront(t, sy);
  drawDust(t);
  drawNearObjects(t);
  drawVignette(d);
}
function renderFrame(t) {
  T = t;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, W, H);
  const zk = inv(tZoom, tZoom + 0.55, t);
  if (zk < 1) {
    const [sx, sy] = shakeAt(t);
    ctx.save();
    ctx.translate(sx, sy);
    if (zk > 0) { const z = lerp(1, 0.3, easeIn(zk)); ctx.translate(540, SUB_Y); ctx.scale(z, z); ctx.translate(-540, -SUB_Y); }
    drawWorld(t);
    ctx.restore();
    if (zk > 0) { ctx.fillStyle = `rgba(2,5,9,${easeIn(zk)})`; ctx.fillRect(0, 0, W, H); }
  }
  drawDiagram(t, inv(tZoom + 0.35, tZoom + 0.75, t));
  drawTitle(t);
  drawCounter(t);
  drawProgress(t);
  drawBadge(t);
  if (t < tCTA + 0.1 || t < PAGES[PAGES.length - 1].e) drawCaptions(t);
  drawCTA(t);
}

async function ready() {
  await Promise.all(['900 40px RubikC', '900 40px RubikL', '700 40px RubikC', '700 40px RubikL'].map(f => document.fonts.load(f)));
  return document.fonts.check('900 40px RubikC');
}
window.setup = setup; window.renderFrame = renderFrame; window.ready = ready;

// предпросмотр в обычном браузере: ?preview
if (location.search.includes('preview')) {
  fetch('build/timeline.json').then(r => r.json()).then(async tl => {
    await ready(); setup(tl);
    const t0 = performance.now();
    const loop = () => { renderFrame(((performance.now() - t0) / 1000) % tl.total); requestAnimationFrame(loop); };
    loop();
  });
}
</script>
