<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Фобия №2 — анимация</title>
<style>
  @font-face { font-family: 'RubikC'; font-weight: 900; src: url('node_modules/@fontsource/rubik/files/rubik-cyrillic-900-normal.woff2') format('woff2'); }
  @font-face { font-family: 'RubikL'; font-weight: 900; src: url('node_modules/@fontsource/rubik/files/rubik-latin-900-normal.woff2') format('woff2'); }
  @font-face { font-family: 'RubikC'; font-weight: 700; src: url('node_modules/@fontsource/rubik/files/rubik-cyrillic-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'RubikL'; font-weight: 700; src: url('node_modules/@fontsource/rubik/files/rubik-latin-700-normal.woff2') format('woff2'); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
'use strict';
// Мультик «Фобия №2 из 100: арахнофобия». Рисовка — как в выпуске №1, сцены свои:
// Миша и его паучок Кузя, Гоша, который боится пауков.
// Всё рисуется детерминированно от времени t: renderFrame(t) → кадр.
const W = 1080, H = 1920, TAU = Math.PI * 2, GROUND = 1220;
const FONT = 'RubikC, RubikL, sans-serif';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const C = {
  ink: '#2A1E2E', white: '#FFFFFF', yellow: '#FFE14D', red: '#FF4D6D', green: '#22B8A7',
  chunk: ['#8E6CDF', '#22B8A7', '#FF9F1C', '#E63946'],
};
const LOOK = {
  misha: { body: '#5EC2F2', light: '#A6E1FF', belly: '#C9EEFF', shoe: '#FF9F1C', hair: 'cap', cap: '#E63946' },
  gosha: { body: '#B48CF2', light: '#D7C2FF', belly: '#E6D9FF', shoe: '#22B8A7', hair: 'curl', glasses: true },
};
const KUZYA = { body: '#8C6A52', light: '#B99173' };
const KARAKURT = { body: '#2E2433', light: '#56465E', spots: true };

// ---------- утилиты ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeIn = k => k * k * k;
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOutBack = (k, s = 1.9) => k <= 0 ? 0 : 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2);
const pop = (t, t0, d = 0.32) => easeOutBack(inv(t0, t0 + d, t));
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const noise1 = x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u) * 2 - 1; };
const frac = x => x - Math.floor(x);
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, k) { const A = hex2rgb(a), B = hex2rgb(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',')})`; }

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function setFont(size, weight = 900) { ctx.font = `${weight} ${size}px ${FONT}`; }
function text(str, x, y, size, o = {}) {
  const { fill = '#fff', stroke = C.ink, sw = 0, weight = 900, align = 'center', maxW = 0 } = o;
  setFont(size, weight);
  if (maxW) { const w = ctx.measureText(str).width; if (w > maxW) { size *= maxW / w; setFont(size, weight); } }
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (sw) { ctx.lineJoin = 'round'; ctx.miterLimit = 2; ctx.lineWidth = sw; ctx.strokeStyle = stroke; ctx.strokeText(str, x, y); }
  ctx.fillStyle = fill; ctx.fillText(str, x, y);
}
function withT(x, y, rot, sc, fn, alpha = 1) {
  if (sc <= 0.001 || alpha <= 0.001) return;
  ctx.save(); ctx.globalAlpha *= clamp(alpha); ctx.translate(x, y); if (rot) ctx.rotate(rot); if (sc !== 1) ctx.scale(sc, sc); fn(); ctx.restore();
}
function stroke(w = 5) { ctx.lineWidth = w; ctx.strokeStyle = C.ink; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); }
function tile(ch, size, color, glow = 0) {
  const h = size / 2, r = size * 0.2;
  ctx.fillStyle = 'rgba(30,10,40,0.22)'; rr(-h + size * 0.05, -h + size * 0.09, size, size, r); ctx.fill();
  ctx.fillStyle = color; rr(-h, -h, size, size, r); ctx.fill();
  ctx.lineWidth = Math.max(3, size * 0.055); ctx.strokeStyle = C.ink; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.25)'; rr(-h + size * 0.12, -h + size * 0.09, size * 0.76, size * 0.2, size * 0.1); ctx.fill();
  if (glow > 0) { ctx.fillStyle = `rgba(255,255,255,${0.55 * glow})`; rr(-h, -h, size, size, r); ctx.fill(); }
  text(ch, 0, size * 0.05, size * 0.6, { sw: size * 0.1 });
}
function star(x, y, r, rot, fill) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = rot + i * Math.PI / 5 - Math.PI / 2, rad = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); }
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = C.ink; ctx.lineJoin = 'round'; ctx.stroke();
}
function heart(x, y, s, fill = '#FF4D6D') {
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 30, s / 30);
  ctx.beginPath(); ctx.moveTo(0, 12);
  ctx.bezierCurveTo(-30, -8, -16, -32, 0, -16); ctx.bezierCurveTo(16, -32, 30, -8, 0, 12);
  ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = C.ink; ctx.stroke(); ctx.restore();
}
// табличка-«пилюля» с текстом
function pill(str, size, fill, color, o = {}) {
  setFont(size); const w = ctx.measureText(str).width + size * 1.4, h = size * 1.9;
  if (o.shadow !== false) { ctx.fillStyle = 'rgba(30,10,40,0.22)'; rr(-w / 2 + 6, -h / 2 + 8, w, h, h / 2); ctx.fill(); }
  ctx.fillStyle = fill; rr(-w / 2, -h / 2, w, h, h / 2); ctx.fill(); stroke(o.sw || 8);
  text(str, 0, size * 0.06, size, { fill: color, sw: o.tsw || 0 });
}
// штамп
function stamp(str, size, color, w) {
  ctx.fillStyle = 'rgba(255,255,255,0.93)'; rr(-w / 2, -size * 0.95, w, size * 1.9, size * 0.35); ctx.fill();
  ctx.lineWidth = size * 0.13; ctx.strokeStyle = color; ctx.stroke();
  text(str, 0, size * 0.07, size, { fill: color, maxW: w - size * 0.6 });
}
// строка-карточка: иконка слева, заголовок и подпись
function rowCard(w, title, sub, color, icon, t) {
  const h = 136;
  ctx.fillStyle = 'rgba(30,10,40,0.2)'; rr(-w / 2 + 4, -h / 2 + 6, w, h, 34); ctx.fill();
  ctx.fillStyle = '#fff'; rr(-w / 2, -h / 2, w, h, 34); ctx.fill(); stroke(7);
  const ix = -w / 2 + 78;
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(ix, 0, 52, 0, TAU); ctx.globalAlpha *= 0.25; ctx.fill(); ctx.globalAlpha /= 0.25;
  withT(ix, 4, 0, 0.8, () => icon(t));
  const tx = ix + 76, mw = w / 2 - tx - 30;
  if (sub) {
    text(title, tx, -20, 54, { fill: color, sw: 10, align: 'left', maxW: mw });
    text(sub, tx, 36, 34, { fill: C.ink, weight: 700, align: 'left', maxW: mw });
  } else text(title, tx, 4, 54, { fill: color, sw: 10, align: 'left', maxW: mw });
}
// квадратная карточка: иконка сверху, подпись снизу
function boxCard(w, h, title, color, icon, t) {
  ctx.fillStyle = 'rgba(30,10,40,0.2)'; rr(-w / 2 + 5, -h / 2 + 7, w, h, 36); ctx.fill();
  ctx.fillStyle = '#fff'; rr(-w / 2, -h / 2, w, h, 36); ctx.fill(); stroke(8);
  ctx.fillStyle = color; ctx.globalAlpha *= 0.22; rr(-w / 2 + 16, -h / 2 + 16, w - 32, h - 96, 26); ctx.fill(); ctx.globalAlpha /= 0.22;
  withT(0, -h / 2 + 16 + (h - 96) / 2, 0, 1, () => icon(t));
  const lines = title.split('\n');
  lines.forEach((ln, i) => text(ln, 0, h / 2 - 42 - (lines.length - 1 - i) * 40, lines.length > 1 ? 36 : 44, { fill: C.ink, maxW: w - 40 }));
}
function cross(r, w = 16) {   // красный крест «нельзя»
  ctx.strokeStyle = '#fff'; ctx.lineWidth = w + 10; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-r, -r); ctx.lineTo(r, r); ctx.moveTo(r, -r); ctx.lineTo(-r, r); ctx.stroke();
  ctx.strokeStyle = '#E63946'; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(-r, -r); ctx.lineTo(r, r); ctx.moveTo(r, -r); ctx.lineTo(-r, r); ctx.stroke();
}
function checkMark(r) {
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fillStyle = C.green; ctx.fill(); stroke(6);
  ctx.beginPath(); ctx.moveTo(-r * 0.45, 0); ctx.lineTo(-r * 0.1, r * 0.35); ctx.lineTo(r * 0.5, -r * 0.35);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = r * 0.22; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
}

// ---------- тайминги ----------
let TL, L = {}, S = {}, SCENES = [], CUES = [], PAGES = [], T = 0, impulses = [];

function findWord(id, re) {
  const w = L[id].words.find(x => re.test(x.w.toLowerCase()));
  if (!w) throw new Error(`нет слова ${re} в ${id}`);
  return w;
}
const ws = (id, re) => findWord(id, re).s;
const b = id => L[id].start - 0.25;

function setup(tl) {
  TL = tl; L = {}; tl.lines.forEach(l => L[l.id] = l);
  S = {
    hook: [0, b('l2')], room: [b('l2'), L.l9.start - 0.5], word: [L.l9.start - 0.5, b('l11')],
    board: [b('l11'), b('l15')], garden: [b('l15'), b('l20')], steppe: [b('l20'), b('l25')],
    therapy: [b('l25'), b('l26')], friends: [b('l26'), tl.total], end: [b('l27'), tl.total],
  };
  SCENES = [
    { name: 'hook', t: 0, draw: sceneHook },
    { name: 'room', t: S.room[0], draw: sceneRoom, tr: 'iris' },
    { name: 'word', t: S.word[0], draw: sceneWord, tr: 'flash' },
    { name: 'board', t: S.board[0], draw: sceneBoard, tr: 'iris' },
    { name: 'garden', t: S.garden[0], draw: sceneGarden, tr: 'iris' },
    { name: 'steppe', t: S.steppe[0], draw: sceneSteppe, tr: 'iris' },
    { name: 'therapy', t: S.therapy[0], draw: sceneTherapy, tr: 'iris' },
    { name: 'friends', t: S.friends[0], draw: sceneFriends, tr: 'iris' },
  ];
  impulses = [
    { t: ws('l6', /^кузю/) - 0.02, a: 22, d: 0.5 }, { t: S.word[0], a: 26, d: 0.6 },
    { t: L.l15.start + 0.1, a: 10, d: 0.3 }, { t: ws('l18', /^выдумк/), a: 12, d: 0.35 },
    { t: ws('l22', /^опасен/), a: 16, d: 0.4 },
  ];
  buildCaptions(); buildCues();
  return { cues: CUES, scenes: S };
}

// ---------- субтитры (как в выпуске №1) ----------
const CAP_SIZE = 74, CAP_MAXW = 880, CAP_Y = 1405;
function buildCaptions() {
  PAGES = []; setFont(CAP_SIZE);
  for (const l of TL.lines) {
    if (l.hide_caption) continue;
    let cur = [];
    const flush = () => { if (cur.length) PAGES.push({ words: cur }); cur = []; };
    for (const w of l.words) {
      const width = ctx.measureText([...cur, w].map(x => x.w.toUpperCase()).join('  ')).width;
      if (cur.length && (width > CAP_MAXW || cur.length >= 3)) flush();
      cur.push(w);
      if (/[.!?…:]»?$/.test(w.w)) flush();
    }
    flush();
  }
  PAGES.forEach(p => p.s = p.words[0].s - 0.06);
  PAGES.forEach((p, i) => {
    const last = p.words[p.words.length - 1].e, next = PAGES[i + 1];
    p.e = next ? Math.min(next.s, last + 0.55) : last + 0.8;
  });
}
function drawCaptions(t) {
  const p = PAGES.find(p => t >= p.s && t < p.e);
  if (!p) return;
  const sc = lerp(0.82, 1, easeOutBack(inv(p.s, p.s + 0.16, t)));
  setFont(CAP_SIZE);
  const words = p.words.map(w => w.w.toUpperCase());
  const space = CAP_SIZE * 0.36;
  let cur = -1; p.words.forEach((w, i) => { if (t >= w.s - 0.03) cur = i; });
  const grow = words.map((w, i) => i === cur ? 1 + 0.1 * easeOutBack(inv(p.words[i].s - 0.03, p.words[i].s + 0.1, t)) : 1);
  const widths = words.map((w, i) => (ctx.measureText(w).width + 16) * grow[i]);
  const total = widths.reduce((a, b) => a + b, 0) + space * (words.length - 1);
  const fit = Math.min(1, CAP_MAXW / total);
  withT(540, CAP_Y, 0, sc * fit, () => {
    let x = -total / 2;
    words.forEach((w, i) => {
      withT(x + widths[i] / 2, 0, 0, grow[i], () => text(w, 0, 0, CAP_SIZE, { fill: i === cur ? C.yellow : '#fff', sw: 16 }));
      x += widths[i] + space;
    });
  });
}

// ---------- звук: метки для audio.py ----------
const WORD_TILES = ['АРАХНО', 'ФОБИЯ'];
const tileT = i => L.l9.start + (i / 10) * Math.max(0.5, L.l9.end - L.l9.start - 0.15);
function buildCues() {
  CUES = [];
  const cue = (t, type, o = {}) => CUES.push({ t: +t.toFixed(3), type, ...o });
  // музыка
  cue(0, 'music', { gain: 0, fade: 0.01 });
  cue(S.room[0], 'music', { gain: 1, fade: 0.4 });
  cue(L.l6.start - 0.2, 'music', { gain: 0, fade: 0.5 });
  cue(L.l11.start, 'music', { gain: 1, fade: 1.0 });
  cue(L.l20.start - 0.3, 'music', { gain: 0.35, fade: 0.8 });
  cue(L.l25.start, 'music', { gain: 1, fade: 1.0 });
  cue(TL.total - 1.6, 'music', { gain: 0, fade: 1.5 });
  // хук: паук спускается, глаза открываются
  cue(0, 'drone', { dur: S.room[0] + 0.2, gain: 0.7 });
  cue(0.15, 'slide', { dur: 0.5, gain: 0.5 });
  L.l1.words.forEach((w, i) => cue(w.s - 0.04, i === 8 ? 'boom' : 'pop', { pitch: 1 + i * 0.05, gain: i === 8 ? 0.7 : 0.45 }));
  cue(ws('l1', /^глаз/) - 0.05, 'sparkle', { gain: 0.6 });
  // комната
  cue(S.room[0] + 0.05, 'whoosh', { gain: 0.6 });
  cue(ws('l2', /^миша/) - 0.05, 'pop', { pitch: 1.2 });
  cue(L.l3.start - 0.45, 'slide', { dur: 0.45, gain: 0.5 });
  cue(L.l3.start, 'boing', { gain: 0.5 });
  cue(ws('l3', /^кузя/) - 0.05, 'sparkle');
  cue(ws('l4', /^кормит/) - 0.05, 'pop', { pitch: 1.4 });
  cue(flyCatchT(), 'pop', { pitch: 0.8, gain: 0.6 });
  cue(ws('l4', /^домик/) - 0.05, 'ding', { gain: 0.6 });
  cue(L.l5.start - 0.1, 'whoosh', { gain: 0.4 });
  cue(ws('l5', /^гоша/) - 0.05, 'pop', { pitch: 1.05 });
  cue(L.l6.start - 0.35, 'riser', { dur: 0.35 + ws('l6', /^кузю/) - L.l6.start });
  cue(ws('l6', /^кузю/) - 0.03, 'impact', { gain: 0.45 });
  cue(L.l7.start - 0.05, 'panic');
  cue(L.l7.start + 0.25, 'boing', { gain: 0.4 });
  // название
  cue(L.l8.start + 0.2, 'drumroll', { dur: S.word[0] - L.l8.start - 0.2 });
  cue(S.word[0], 'crash', { gain: 0.6 }); cue(S.word[0], 'tada', { gain: 0.8 });
  for (let i = 0; i < 11; i++) cue(tileT(i), 'click', { pitch: 0.9 + i * 0.04, gain: 0.3 });
  cue(L.l10.start - 0.05, 'stamp', { gain: 0.5 });
  // доска
  cue(S.board[0] + 0.05, 'whoosh');
  cue(L.l11.start - 0.05, 'pop', { pitch: 1 }); cue(ws('l11', /^фобос/) - 0.05, 'pop', { pitch: 1.15 });
  cue(L.l12.start - 0.1, 'whoosh', { gain: 0.5 });
  cue(ws('l12', /^превратил/) - 0.05, 'sparkle');
  cue(ws('l12', /^паука/) - 0.05, 'boing', { gain: 0.5 });
  cue(L.l13.start - 0.1, 'whoosh', { gain: 0.5 });
  for (let i = 0; i < 20; i++) cue(headT(i), 'tick', { pitch: 0.9 + i * 0.03, gain: 0.25 });
  cue(ws('l13', /^двадцат/) - 0.05, 'ding', { gain: 0.7 });
  cue(L.l14.start - 0.1, 'whoosh', { gain: 0.5 });
  cue(ws('l14', /^предк/) - 0.05, 'pop', { pitch: 1 });
  cue(ws('l14', /^пауков/) - 0.05, 'pop', { pitch: 0.8 });
  cue(ws('l14', /^цвет/) - 0.05, 'pop', { pitch: 1.3 });
  // сад
  cue(S.garden[0] + 0.05, 'whoosh');
  cue(L.l15.start + 0.05, 'stamp', { gain: 0.6 });
  for (let i = 0; i < 14; i++) cue(L.l16.start + 0.15 + i * 0.12, 'tick', { pitch: 0.8 + i * 0.05, gain: 0.25 });
  cue(L.l16.sentences[1][0] - 0.05, 'pop', { pitch: 0.85 });
  cue(L.l17.start - 0.05, 'pop', { pitch: 1.1 }); cue(ws('l17', /^кусает/) - 0.05, 'pop', { pitch: 1.25 });
  cue(L.l18.start - 0.05, 'whoosh', { gain: 0.5 }); cue(L.l18.start + 0.3, 'snore', { dur: 1.6 });
  cue(ws('l18', /^выдумк/) - 0.04, 'stamp', { gain: 0.6 });
  cue(L.l19.start - 0.05, 'whoosh', { gain: 0.5 });
  for (let i = 0; i < 10; i++) cue(flyStickT(i), 'pop', { pitch: 1.4 + i * 0.05, gain: 0.3 });
  cue(ws('l19', /^сотни/) - 0.05, 'tada', { gain: 0.5 });
  // степь
  cue(S.steppe[0] + 0.05, 'whoosh');
  cue(L.l20.start - 0.05, 'pop', { pitch: 0.9 });
  cue(L.l21.start - 0.05, 'whoosh', { gain: 0.5 });
  cue(ws('l21', /^каракурт/) - 0.05, 'drone', { dur: 1.6, gain: 0.5 });
  cue(ws('l21', /^красн/) - 0.05, 'ding', { gain: 0.4 });
  cue(ws('l22', /^опасен/) - 0.04, 'impact', { gain: 0.35 });
  ['вытряхив', 'суй', 'спи'].forEach((w, i) => cue(ws('l23', new RegExp('^' + w)) - 0.05, 'pop', { pitch: 1 + i * 0.12 }));
  cue(L.l24.start - 0.1, 'whoosh', { gain: 0.5 });
  aidTimes().forEach((t, i) => cue(t - 0.05, 'pop', { pitch: 1 + i * 0.1 }));
  cue(aidTimes()[3] + 0.1, 'sparkle', { gain: 0.6 });
  // психолог
  cue(S.therapy[0] + 0.05, 'whoosh');
  stepTimes().forEach((t, i) => cue(t, 'boing', { gain: 0.35 }));
  cue(ws('l25', /^одного/) - 0.05, 'ding');
  // друзья и финал
  cue(S.friends[0] + 0.05, 'whoosh');
  cue(ws('l26', /^машет/) - 0.05, 'sparkle', { gain: 0.6 });
  cue(ws('l26', /^издалек/) - 0.05, 'pop', { pitch: 1.2 });
  cue(ws('l27', /^фобия/) - 0.05, 'tada', { gain: 0.6 });
  cue(ws('l27', /^какую/) - 0.05, 'pop', { pitch: 1.1 });
  cue(ws('l27', /^пиши/) - 0.05, 'pop', { pitch: 1.3 });
  CUES.sort((a, b) => a.t - b.t);
}

// ---------- камера ----------
function shakeAt(t) {
  let x = 0, y = 0;
  for (const im of impulses) {
    if (t < im.t || t > im.t + im.d) continue;
    const k = Math.pow(1 - (t - im.t) / im.d, 2) * im.a;
    x += noise1((t - im.t) * 40 + im.t) * k; y += noise1((t - im.t) * 40 + im.t + 50) * k;
  }
  return [x, y];
}

// ---------- дети (та же конструкция, что Петя в выпуске №1) ----------
function blinkAt(t, seed = 0) {
  let b = 0;
  const n0 = Math.floor((t - 0.8 - seed) / 3.1);
  for (let n = n0 - 1; n <= n0 + 1; n++) {
    const tn = 0.8 + seed + n * 3.1 + hash(n + seed * 7) * 1.3, d = Math.abs(t - tn);
    if (d < 0.09) b = Math.max(b, 1 - d / 0.09);
  }
  return b;
}
function kid(t, o, seed = 0) {
  const br = Math.sin(t * 2.6 + seed) * 0.018;
  return Object.assign({ x: 540, y: GROUND, s: 1, rot: 0, sx: 1 + br, sy: 1 - br, lookX: 0, lookY: 0, eye: 1, pupil: 1,

const flyCatchT = () => ws('l4', /^мушк/) + 0.35;

  P.x = lerp(-180, 400, easeOut(wIn)); P.walk = wIn < 1 ? 1 : 0;
  if (t < L.l3.start - 0.5) Object.assign(P, { wave: inv(m0 + 0.7, m0 + 0.9, t), mouth: 'smile', mo: 0.55, blush: 0.5 });
  else if (t < L.l5.start - 0.1) {
    Object.assign(P, { hold: easeOut(inv(L.l3.start - 0.5, L.l3.start - 0.2, t)), mouth: 'smile', mo: 0.6, blush: 0.8, lookX: 0.8, lookY: -0.3 });
    if (t > ws('l4', /^домик/) - 0.1) { P.lookX = -0.9; P.lookY = 0; }
    if (t > ws('l3', /^кузя/)) P.hearts = inv(ws('l3', /^кузя/), ws('l3', /^кузя/) + 0.3, t) * (1 - inv(L.l4.start + 0.8, L.l4.start + 1.2, t));
  } else if (t < L.l6.start - 0.1) Object.assign(P, { hold: 1, mouth: 'smile', mo: 0.4, lookX: 1, wave: 0 });
  else if (t < L.l7.start - 0.1) Object.assign(P, { hold: 1, mouth: 'smile', mo: 0.3, lookX: 1, blush: 0.4 });
  else Object.assign(P, { hold: 1, mouth: 'flat', brow: -0.6, lookX: 1, lookY: -0.3, eye: 1.05 });
  if (t > S.room[1] - 1.3) Object.assign(P, { mouth: 'flat', lookX: 0.6 });
  return P;
}
function goshaRoom(t) {
  const t5 = L.l5.start - 0.1, tSee = ws('l6', /^кузю/) - 0.05;
  const P = kid(t, { x: 1250, flip: -1 }, 1.7);
  if (t < t5) return null;
  const wIn = inv(t5, t5 + 0.9, t);
  P.x = lerp(1180, 820, easeOut(wIn)); P.walk = wIn < 1 ? 1 : 0;
  if (t < L.l6.start - 0.1) Object.assign(P, { mouth: 'smile', mo: 0.5, wave: inv(t5 + 0.9, t5 + 1.1, t), lookX: -0.4 });
  else if (t < tSee) Object.assign(P, { mouth: 'smile', mo: 0.2, lookX: 1, lookY: 0.3 });
  else if (t < L.l7.start - 0.1) {
    const k = inv(tSee, tSee + 0.15, t);
    Object.assign(P, { mouth: 'o', mo: k, eye: 1 + 0.45 * k, pupil: 1 - 0.55 * k, hair: k, shake: 6 * k, sweat: 1, brow: 1, lookX: 1, blink: 0, sy: P.sy + 0.06 * k });
  } else if (t < S.room[1] - 1.3) {   // мечется по комнате
    const k = t - L.l7.start;
    Object.assign(P, { mouth: 'o', mo: 1, eye: 1.4, pupil: 0.45, armsUp: 1, hair: 1, shake: 5, sweat: 1, brow: 1, blink: 0, lookX: 1 });
    P.x = 820 + Math.sin(k * 5) * 130; P.y -= Math.abs(Math.sin(k * 10)) * 70; P.flip = Math.cos(k * 5) > 0 ? -1 : 1;

      lookX: Math.sin(t * 5.5) > 0 ? 0.9 : -0.9, lookY: -0.2, blink: 0 });

}
function sceneRoom(t) {

}

    await ready(); setup(tl);
    const t0 = performance.now();
    const loop = () => { renderFrame(((performance.now() - t0) / 1000) % tl.total); requestAnimationFrame(loop); };
    loop();
  });
}
</script>
