<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Фобии №4–6 — анимация</title>
<style>
  @font-face { font-family: 'BalsC'; font-weight: 700; src: url('node_modules/@fontsource/balsamiq-sans/files/balsamiq-sans-cyrillic-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'BalsL'; font-weight: 700; src: url('node_modules/@fontsource/balsamiq-sans/files/balsamiq-sans-latin-700-normal.woff2') format('woff2'); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
'use strict';
// Мультик «Фобии №4–6 из 100» в стиле рисованных объяснялок: человечки с большой белой головой,
// толстый чёрный контур, плоский однотонный фон, крупное слово-заголовок, резкие склейки каждые 2–3 с,
// предметы «выпрыгивают», линии слегка дрожат (эффект «boil», как в покадровой рисовке).
// Всё рисуется детерминированно от времени t: renderFrame(t) → кадр.
const W = 1080, H = 1920, TAU = Math.PI * 2, GROUND = 1430;
const FONT = 'BalsC, BalsL, sans-serif';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const C = {
  ink: '#111111', white: '#FFFFFF', red: '#E53935', green: '#43A047', blue: '#1E88E5', yellow: '#FDD835',
  money: '#81C784', alert: '#E57373', purple: '#8E6CDF', orange: '#FB8C00', brown: '#8D5A3B',
};
const BG = {
  blue: '#A7D8F0', beige: '#F5E6C4', grey: '#D3D3D3', mint: '#C3E8C9', pink: '#F6C9C9', lav: '#D9D0F2',
  yellow: '#FFE9A8', night: '#2F3A5C', red: '#F0A8A8',
};
const DARK = new Set([BG.night, '#141826']);
const LOOK = {
  senya: { shirt: '#FB8C00', hair: 'cap', cap: '#1E88E5' },
  nyuta: { shirt: '#9575CD', hair: 'bob' },
  borya: { shirt: '#29B6F6', hair: 'spiky' },
  cave: { shirt: '#C68A4A', hair: 'shaggy', fur: true },
  actor: { shirt: '#8E6CDF', hair: 'curl' },
  guy: { shirt: '#90A4AE', hair: 'none' },
};

// ---------- утилиты ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOutBack = (k, s = 2.2) => k <= 0 ? 0 : 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2);
const pop = (t, t0, d = 0.22) => easeOutBack(inv(t0, t0 + d, t));
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const frac = x => x - Math.floor(x);

// ---------- дрожащие линии (boil) ----------
// каждый вызов фигуры получает свой номер NID; шум зависит от номера, точки и «кадра рисовки» STEP (8 раз в секунду)
let NID = 0, STEP = 0;
const BOIL = 0;   // 0 — ровные чистые линии (дрожание выключено)
const jn = i => (hash(NID * 17.13 + i * 3.71 + STEP * 101.9) - 0.5) * 2;
function pxScale() { const m = ctx.getTransform(); return Math.hypot(m.a, m.b) || 1; }
function wob(pts, amp = 2.4) {
  NID++; if (!BOIL) return pts; const s = pxScale(), a = amp / s;
  return pts.map((p, i) => [p[0] + jn(i * 2) * a, p[1] + jn(i * 2 + 1) * a]);
}
function smoothPath(q, closed) {
  ctx.beginPath();
  if (!closed) {
    ctx.moveTo(q[0][0], q[0][1]);
    for (let i = 1; i < q.length - 1; i++) { const mx = (q[i][0] + q[i + 1][0]) / 2, my = (q[i][1] + q[i + 1][1]) / 2; ctx.quadraticCurveTo(q[i][0], q[i][1], mx, my); }
    ctx.lineTo(q[q.length - 1][0], q[q.length - 1][1]);
    return;
  }
  const n = q.length, m = i => [(q[i % n][0] + q[(i + 1) % n][0]) / 2, (q[i % n][1] + q[(i + 1) % n][1]) / 2];
  ctx.moveTo(...m(0));
  for (let i = 1; i <= n; i++) { const p = q[i % n], mm = m(i); ctx.quadraticCurveTo(p[0], p[1], mm[0], mm[1]); }
  ctx.closePath();
}
function inkW(lw = 7) { ctx.lineWidth = lw / pxScale(); ctx.strokeStyle = C.ink; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; }
// закрашенная фигура с контуром
function shadeOf(c) {
  if (typeof c !== 'string' || c[0] !== '#' || c.length !== 7) return null;
  if (c.toUpperCase() === '#FFFFFF') return '#DDE2EA';
  if (c === C.ink || c === '#111' || c === '#222') return null;
  const n = parseInt(c.slice(1), 16), k = 0.8;
  return `rgb(${Math.round((n >> 16 & 255) * k)},${Math.round((n >> 8 & 255) * k)},${Math.round((n & 255) * k)})`;
}
// заливка с мягкой тенью снизу-справа и бликом сверху-слева
function celFill(path, fill) {
  ctx.fillStyle = fill; path(); ctx.fill();
  const sh = shadeOf(fill); if (!sh) return;
  const s = pxScale(), d = 14 / s;
  ctx.save(); path(); ctx.clip();
  ctx.fillStyle = sh; ctx.fillRect(-5000, -5000, 10000, 10000);
  ctx.translate(-d, -d * 1.1); ctx.fillStyle = fill; path(); ctx.fill();
  ctx.restore();
}
function shape(pts, fill, lw = 7, closed = true, amp = 2.4) {
  const q = wob(pts, amp);
  if (fill) celFill(() => smoothPath(q, closed), fill); else smoothPath(q, closed);
  smoothPath(q, closed);
  if (lw) { inkW(lw); ctx.stroke(); }
}
function polyPts(pts, per = 3) {   // ломаная с промежуточными точками: острые углы, но дрожат и стороны
  const out = [];
  for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; for (let k = 0; k < per; k++) out.push([lerp(a[0], b[0], k / per), lerp(a[1], b[1], k / per)]); }
  return out;
}
function poly(pts, fill, lw = 7) {   // многоугольник с острыми углами
  const q = wob(polyPts(pts), 2.2);
  const path = () => { ctx.beginPath(); q.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); };
  if (fill) celFill(path, fill);
  path();
  if (lw) { inkW(lw); ctx.stroke(); }
}
function ellPts(x, y, rx, ry, n = 28, a0 = 0, a1 = TAU) {
  const p = []; const full = Math.abs(a1 - a0 - TAU) < 1e-6;
  for (let i = 0; i < (full ? n : n + 1); i++) { const a = a0 + (a1 - a0) * i / n; p.push([x + Math.cos(a) * rx, y + Math.sin(a) * ry]); }
  return p;
}
const circ = (x, y, r, fill, lw = 7) => shape(ellPts(x, y, r, r), fill, lw);
const ell = (x, y, rx, ry, fill, lw = 7) => shape(ellPts(x, y, rx, ry), fill, lw);
function rrPts(x, y, w, h, r) {
  const p = [], c = [[x + w - r, y + r, -Math.PI / 2], [x + w - r, y + h - r, 0], [x + r, y + h - r, Math.PI / 2], [x + r, y + r, Math.PI]];
  for (const [cx, cy, a0] of c) for (let i = 0; i <= 3; i++) { const a = a0 + i / 3 * Math.PI / 2; p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  return p;
}
const box = (x, y, w, h, r, fill, lw = 7) => shape(rrPts(x, y, w, h, r), fill, lw);
function line(pts, lw = 7, color = C.ink, amp = 2) {
  const q = wob(pts.length === 2 ? [pts[0], [lerp(pts[0][0], pts[1][0], 0.5), lerp(pts[0][1], pts[1][1], 0.5)], pts[1]] : pts, amp);
  smoothPath(q, false); ctx.lineWidth = lw / pxScale(); ctx.strokeStyle = color; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
}
function dot(x, y, r, c = C.ink, hl = false) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = c; ctx.fill(); if (hl) { ctx.beginPath(); ctx.arc(x - r * 0.35, y - r * 0.38, r * 0.32, 0, TAU); ctx.fillStyle = '#fff'; ctx.fill(); } }

function setFont(size, weight = 700) { ctx.font = `${weight} ${size}px ${FONT}`; }
function text(str, x, y, size, o = {}) {
  const { fill = C.ink, align = 'center', maxW = 0, stroke = 0, strokeC = '#fff' } = o;
  setFont(size);
  if (maxW) { const w = ctx.measureText(str).width; if (w > maxW) { size *= maxW / w; setFont(size); } }
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  NID++;
  const jx = 0, jy = 0;
  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = stroke; ctx.strokeStyle = strokeC; ctx.strokeText(str, x + jx, y + jy); }
  ctx.fillStyle = fill; ctx.fillText(str, x + jx, y + jy);
}
function withT(x, y, rot, sc, fn, alpha = 1) {
  if (sc <= 0.001 || alpha <= 0.001) return;
  ctx.save(); ctx.globalAlpha *= clamp(alpha); ctx.translate(x, y); if (rot) ctx.rotate(rot); if (sc !== 1) ctx.scale(sc, sc); fn(); ctx.restore();
}
// элемент «выпрыгивает» в момент t0
const P = (t, t0, x, y, fn, s = 1, rot = 0) => withT(x, y, rot, pop(t, t0) * s, fn);
// элемент «въезжает» сбоку
function slideIn(t, t0, x, y, fn, from = 1, s = 1) { const k = easeOut(inv(t0, t0 + 0.25, t)); if (k > 0) withT(x + (1 - k) * 900 * from, y, 0, s, fn); }

// ---------- человечек ----------
// o: x, y (ноги), s, look, armL/armR — поза руки, leg, mouth, eyes, lookX, sweat, flip, blush
const ARM = {   // [угол плеча, сгиб локтя] для правой руки; левая — зеркально
  down: [1.25, 0.15], up: [-1.15, -0.25], point: [-0.12, 0.05], hips: [0.95, 2.3], shrug: [0.35, -1.7],
  hold: [0.75, -1.25], cheer: [-0.9, -0.5], face: [0.6, -2.5], out: [0.25, 0.2], cover: [0.5, -2.75],
};
function arm(d, pose, t, wave) {
  let [a, b] = ARM[pose] || ARM.down;
  if (wave) b = -0.6 + Math.sin(t * 12) * 0.55, a = -1.0;
  const sx = d * 58, sy = -305;
  const ex = sx + d * Math.cos(a) * 78, ey = sy + Math.sin(a) * 78;
  const hx = ex + d * Math.cos(a + b) * 72, hy = ey + Math.sin(a + b) * 72;
  line([[sx, sy], [ex, ey], [hx, hy]], 11);
  circ(hx, hy, 15, '#fff', 6);
  return [hx, hy];
}
function fig(t, o) {
  const F = Object.assign({ x: 540, y: GROUND, s: 1.1, look: LOOK.guy, armL: 'down', armR: 'down', leg: 'stand', mouth: 'smile', eyes: 'dot', lookX: 0, lookY: 0, flip: 1, rot: 0 }, o);
  const hands = {};
  if (!F.noShadow) { ctx.fillStyle = 'rgba(0,0,0,0.13)'; ctx.beginPath(); ctx.ellipse(F.x, F.y + 6, 115 * F.s, 18 * F.s, 0, 0, TAU); ctx.fill(); }
  withT(F.x, F.y, F.rot, F.s, () => {
    ctx.scale(F.flip, 1);
    // ноги
    [-1, 1].forEach(d => {
      if (F.leg === 'sit') { line([[d * 35, -150], [d * 35 + 110, -150], [d * 35 + 110, -20]], 11); ell(d * 35 + 130, -14, 30, 15, C.ink, 0); return; }
      const ph = F.leg === 'walk' ? Math.sin(t * 12 + (d > 0 ? Math.PI : 0)) : F.leg === 'run' ? Math.sin(t * 20 + (d > 0 ? Math.PI : 0)) * 1.6 : 0;
      let fx = d * 45 + ph * 40, fy = -Math.max(0, ph) * 25, kx = (d * 35 + fx) / 2 + d * 8, ky = -75 + fy / 2;
      if (F.leg === 'jump') { kx = d * 90; ky = -95; fx = d * 60; fy = -25; }
      line([[d * 35, -150], [kx, ky], [fx, fy]], 11);
      ell(fx + d * 12, fy - 4, 28, 14, C.ink, 0);
    });
    // туловище-футболка
    shape(polyPts([[-62, -335], [62, -335], [74, -150], [-74, -150]], 2), F.look.shirt, 7);
    if (F.look.fur) { poly([[-74, -230], [74, -300], [74, -150], [-74, -150]], '#E0A64F', 6); dot(-20, -190, 8, '#7A4A1E'); dot(30, -220, 7, '#7A4A1E'); }
    hands.R = arm(1, F.armR, t, F.wave);
    hands.L = arm(-1, F.armL, t, false);
    // голова
    const hx = 0, hy = -448;
    if (F.look.hair === 'bob') shape([[-112, -410], ...ellPts(0, -455, 118, 118, 14, Math.PI, TAU).slice(1, -1), [112, -410], [96, -360], [-96, -360]], '#4A3328', 7);
    circ(hx, hy, 105, '#fff', 8);
    hair(F, t);
    // лицо
    const ex = F.lookX * 12, ey = F.lookY * 10;
    for (const d of [-1, 1]) {
      const x = d * 36 + ex, y = -455 + ey;
      if (F.eyes === 'big') { circ(x, y, 25, '#fff', 6); dot(x + F.lookX * 6, y + 2, 11, C.ink, true); }
      else if (F.eyes === 'happy') line([[x - 16, y + 6], [x, y - 8], [x + 16, y + 6]], 7);
      else if (F.eyes === 'closed') line([[x - 16, y], [x + 16, y]], 7);
      else if (F.eyes === 'angry') { dot(x, y, 10); line([[x - 20 * d * -1, y - 30], [x + 18 * d * -1, y - 18]], 7); }
      else dot(x, y, 12, C.ink, true);
    }
    if (F.eyes === 'worry') for (const d of [-1, 1]) line([[d * 18 + ex, -495], [d * 54 + ex, -485]], 7);
    if (F.blush) for (const d of [-1, 1]) { ctx.fillStyle = 'rgba(240,120,130,0.45)'; ctx.beginPath(); ctx.ellipse(d * 68, -418, 18, 10, 0, 0, TAU); ctx.fill(); }
    const my = -400 + ey;
    if (F.mouth === 'smile') line(ellPts(ex, my - 22, 30, 24, 8, 0.35, Math.PI - 0.35), 7);
    else if (F.mouth === 'open') shape([[ex - 36, my - 8], [ex + 36, my - 8], ...ellPts(ex, my - 8, 36, 32, 10, 0, Math.PI).slice(1)], '#5A1A1A', 6);
    else if (F.mouth === 'o') ell(ex, my, 16, 22, '#5A1A1A', 6);
    else if (F.mouth === 'scream') ell(ex, my + 8, 26, 38 + Math.sin(t * 40) * 3, '#5A1A1A', 6);
    else if (F.mouth === 'frown') line(ellPts(ex, my + 14, 28, 20, 8, Math.PI + 0.4, TAU - 0.4), 7);
    else if (F.mouth === 'wavy') line([[ex - 30, my], [ex - 15, my - 8], [ex, my], [ex + 15, my - 8], [ex + 30, my]], 6);
    else line([[ex - 24, my], [ex + 24, my]], 7);
    if (F.sweat) withT(98, -500 + frac(t * 0.8) * 40, 0, 1, () => drop(0, 0, 1));
  });
  hands.R = hands.R && [F.x + hands.R[0] * F.s * F.flip, F.y + hands.R[1] * F.s];
  hands.L = hands.L && [F.x + hands.L[0] * F.s * F.flip, F.y + hands.L[1] * F.s];
  return hands;
}
function hair(F, t) {
  const h = F.look.hair;
  if (h === 'cap') {
    shape([...ellPts(0, -470, 108, 82, 12, Math.PI, TAU), [108, -470]], F.look.cap, 7);
    shape(polyPts([[40, -478], [175, -470], [170, -446], [40, -452]], 2), F.look.cap, 7);
    dot(0, -552, 9, C.ink);
  } else if (h === 'bob') {
    shape([...ellPts(0, -455, 108, 108, 12, Math.PI * 1.02, Math.PI * 1.98), [80, -500], [40, -478], [0, -500], [-40, -478], [-80, -500]], '#4A3328', 7);
  } else if (h === 'spiky') {
    const pts = []; for (let i = 0; i <= 14; i++) { const a = Math.PI * (1.0 + i / 14); const r = i % 2 ? 135 - Math.abs(i - 7) * 2 : 103; pts.push([Math.cos(a) * r, -462 + Math.sin(a) * r]); }
    poly(pts, '#222', 6);
  } else if (h === 'shaggy') {
    const pts = []; for (let i = 0; i <= 12; i++) { const a = Math.PI * (0.95 + i * 0.092); const r = i % 2 ? 128 : 108; pts.push([Math.cos(a) * r, -440 + Math.sin(a) * r]); }
    shape(pts, '#5D3A1A', 6);
  } else if (h === 'curl') {
    line(ellPts(0, -570, 18, 18, 10, 0, Math.PI * 1.7), 7);
  }
}
function drop(x, y, s = 1) { withT(x, y, 0, s, () => shape([[0, -22], [12, 0], [10, 10], [0, 16], [-10, 10], [-12, 0]], '#64B5F6', 5)); }

// ---------- предметы ----------
function popcornPiece(s = 1) { withT(0, 0, 0, s, () => { shape([[-14, -4], [-8, -16], [6, -16], [16, -4], [12, 12], [-10, 12]], '#FFF5D6', 4); dot(2, 0, 5, '#F9C74F'); }); }
function bucket(full = true) {
  if (full) for (let i = 0; i < 7; i++) withT(-60 + i * 20, -170 - (i % 2) * 18, 0, 1.4, () => popcornPiece());
  poly([[-80, -160], [80, -160], [60, 0], [-60, 0]], '#fff', 7);
  for (const x of [-40, 0, 40]) poly([[x - 10, -160], [x + 10, -160], [x * 0.75 + 8, 0], [x * 0.75 - 8, 0]], C.red, 0);
  poly([[-80, -160], [80, -160], [60, 0], [-60, 0]], null, 7);
}
function monster(t, o = {}) {   // фиолетовое чудище из фильма; (0,0) — низ
  const { mouth = 1, arms = 1 } = o;
  for (const d of [-1, 1]) {
    const a = lerp(0.8, -0.9, arms) + Math.sin(t * 9 + d) * 0.08;
    line([[d * 110, -200], [d * (110 + Math.cos(a) * 120), -200 + Math.sin(a) * 120]], 30, C.ink);
    line([[d * 110, -200], [d * (110 + Math.cos(a) * 120), -200 + Math.sin(a) * 120]], 18, '#9C6ADE');
    for (let k = -1; k <= 1; k++) line([[d * (110 + Math.cos(a) * 120), -200 + Math.sin(a) * 120], [d * (110 + Math.cos(a + k * 0.5) * 165), -200 + Math.sin(a + k * 0.5) * 165]], 7);
  }
  const pts = []; for (let i = 0; i < 20; i++) { const a = i / 20 * TAU; const r = i % 2 ? 1 : 1.1; pts.push([Math.cos(a) * 140 * r, -190 + Math.sin(a) * 175 * r]); }
  shape(pts, '#9C6ADE', 8);
  for (const d of [-1, 1]) poly([[d * 50, -340], [d * 95, -430], [d * 90, -335]], C.yellow, 6);
  for (const d of [-1, 1]) { circ(d * 48, -260, 30, '#fff', 6); dot(d * 48, -255, 12); }
  const mh = 30 + 40 * mouth;
  shape(ellPts(0, -160, 80, mh, 16), '#4A1020', 7);
  for (let i = -2; i <= 2; i++) poly([[i * 30 - 12, -160 - mh + 4], [i * 30 + 12, -160 - mh + 4], [i * 30, -160 - mh + 30]], '#fff', 4);
}
function dog(t, o = {}) {   // (0,0) — земля
  const { scared = false, bark = false, jump = 0 } = o;
  ctx.fillStyle = 'rgba(0,0,0,0.13)'; ctx.beginPath(); ctx.ellipse(0, 6, 150, 18, 0, 0, TAU); ctx.fill();
  withT(0, -jump, 0, 1, () => {
    line(ellPts(-125, -150, 26, 26, 10, 0, Math.PI * 1.6 + Math.sin(t * 14) * 0.3), 10);
    for (const x of [-70, -30, 40, 80]) line([[x, -100], [x, -4]], 10);
    ell(0, -120, 115, 55, '#E2B67A');
    withT(105, -185, scared ? -0.15 : 0, 1, () => {
      for (const d of [-1, 1]) ell(d * 52, -10, 20, 40, '#8D5A3B', 6);
      circ(0, 0, 66, '#E2B67A');
      dot(-22, -12, scared ? 12 : 9); dot(24, -12, scared ? 12 : 9);
      ell(32, 20, 13, 9, C.ink, 0);
      if (bark) ell(20, 40, 16, 14, '#5A1A1A', 5); else line(ellPts(20, 30, 14, 10, 6, 0.3, Math.PI - 0.3), 5);
    });
  });
}
function screenTV(t, inner, w = 380, h = 260) {
  box(-w / 2 - 20, -h / 2 - 20, w + 40, h + 40, 24, '#333', 7);
  box(-w / 2, -h / 2, w, h, 12, '#5C6BC0', 5);
  ctx.save(); ctx.beginPath(); ctx.rect(-w / 2, -h / 2, w, h); ctx.clip(); inner(); ctx.restore();
  line([[-60, h / 2 + 20], [-90, h / 2 + 90]], 8); line([[60, h / 2 + 20], [90, h / 2 + 90]], 8);
}
function brain(fill = '#F8BBD0') {
  const pts = []; for (let i = 0; i < 18; i++) { const a = i / 18 * TAU; const r = i % 2 ? 1 : 1.08; pts.push([Math.cos(a) * 150 * r, Math.sin(a) * 110 * r]); }
  shape(pts, fill, 8);
  line([[0, -110], [-10, -40], [10, 20], [0, 105]], 6);
  for (const [x, y] of [[-80, -40], [70, -50], [-70, 40], [75, 35]]) line(ellPts(x, y, 26, 18, 8, 0.4, 3.6), 5);

function setup(tl) {
  TL = tl; L = {}; tl.lines.forEach(l => L[l.id] = l);
  SHOTS = buildShots();
  for (let i = 1; i < SHOTS.length; i++) if (SHOTS[i].t <= SHOTS[i - 1].t + 0.6) throw new Error(`кадр ${i} (${SHOTS[i].label}) слишком короткий`);
  buildCaptions(); buildCues();
  return { cues: CUES, shots: SHOTS.map(s => [s.t.toFixed(2), s.label]) };
}

let CUR_BG = null;
// ---------- субтитры: чёрный рукописный шрифт, текущее слово красным ----------
const CAP_SIZE = 70, CAP_MAXW = 920, CAP_Y = 1650;
function buildCaptions() {
  PAGES = []; setFont(CAP_SIZE);
  for (const l of TL.lines) {
    if (l.hide_caption) continue;
    let cur = [];
    const flush = () => { if (cur.length) PAGES.push({ words: cur }); cur = []; };
    for (const w of l.words) {
      const width = ctx.measureText([...cur, w].map(x => x.w.toUpperCase()).join('  ')).width;
      if (cur.length && (width > CAP_MAXW || cur.length >= 3)) flush();
      cur.push(w);
      if (/[.!?…:]»?$/.test(w.w)) flush();
    }
    flush();
  }
  PAGES.forEach(p => p.s = p.words[0].s - 0.06);
  PAGES.forEach((p, i) => { const last = p.words[p.words.length - 1].e, next = PAGES[i + 1]; p.e = next ? Math.min(next.s, last + 0.55) : last + 0.8; });
}
function drawCaptions(t) {
  const p = PAGES.find(p => t >= p.s && t < p.e);
  if (!p) return;
  setFont(CAP_SIZE);
  const dark = DARK.has(CUR_BG);
  const words = p.words.map(w => w.w.toUpperCase()), space = CAP_SIZE * 0.32;
  let cur = -1; p.words.forEach((w, i) => { if (t >= w.s - 0.03) cur = i; });
  const widths = words.map(w => ctx.measureText(w).width);
  const total = widths.reduce((a, b) => a + b, 0) + space * (words.length - 1), fit = Math.min(1, CAP_MAXW / total);
  withT(540, CAP_Y, 0, fit, () => {
    let x = -total / 2;
    words.forEach((w, i) => { text(w, x + widths[i] / 2, 0, CAP_SIZE, dark ? { fill: i === cur ? C.yellow : '#fff', stroke: 14, strokeC: C.ink } : { fill: i === cur ? C.red : C.ink, stroke: 14, strokeC: '#fff' }); x += widths[i] + space; });
  });
}

function drawLabel(sh, t) {
  if (!sh.label) return;
  const k = pop(t, sh.t, 0.18);
  withT(540, 300, 0, k, () => text(sh.label, 0, 0, 110, { maxW: 980, fill: DARK.has(sh.bg) ? '#fff' : C.ink }));
}
function drawBadge(t) {
  const num = t >= LS('c1') ? '№6' : t >= LS('b1') ? '№5' : t >= LS('a1') ? '№4' : null;
  if (!num || t >= LS('e1')) return;
  setFont(36); const str = '100 ФОБИЙ · ' + num, w = ctx.measureText(str).width + 50;
  ctx.fillStyle = 'rgba(0,0,0,0.12)'; ctx.beginPath(); ctx.roundRect(540 - w / 2, 100, w, 60, 30); ctx.fill();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = DARK.has(CUR_BG) ? 'rgba(255,255,255,0.8)' : 'rgba(17,17,17,0.75)'; ctx.fillText(str, 540, 132);
}

// ---------- звук: метки для audio.py ----------
function buildCues() {
  CUES = [];
  const cue = (t, type, o = {}) => CUES.push({ t: +Math.max(0, t).toFixed(3), type, ...o });
  const music = (t, gain, fade = 0.4) => cue(t, 'music', { gain, fade });
  music(0, 0.9, 0.2);
  music(LS('a2'), 0.2, 0.3); music(LS('a4'), 0.9, 0.4);
  music(A('b1', /^свет/), 0.25, 0.3); music(LS('b3'), 0.9, 0.4);
  music(LS('b4'), 0.4, 0.3); music(LS('b5'), 0.9, 0.4);
  music(A('c1', /^окном/), 0.35, 0.3); music(LS('c3'), 0.9, 0.4);
  music(TL.total - 1.5, 0, 1.4);
  // на каждой склейке — короткий щелчок, на «выпрыгивании» заголовка — поп
  SHOTS.forEach((s, i) => { if (i) cue(s.t, 'click', { pitch: 0.8 + (i % 5) * 0.08, gain: 0.35 }); cue(s.t + 0.02, 'pop', { pitch: 0.9 + (i % 4) * 0.1, gain: 0.35 }); });
  // события
  cue(ws('i1', /^полтор/) - 0.1, 'tick', { gain: 0.5 });
  cue(A('i1', /^одна/), 'panic', { gain: 0.35 });
  cue(ws('a1', /^ведр/) - 0.1, 'munch', { gain: 0.6 });
  cue(LS('a2'), 'switch', { gain: 0.6 }); cue(LS('a2') + 0.1, 'drone', { dur: L.a3.start - L.a2.start, gain: 0.8 });
  cue(LS('a3'), 'impact', { gain: 0.6 }); cue(LS('a3') + 0.05, 'panic', { gain: 0.5 });
  cue(A('a3', /^попкорн/), 'boing', { gain: 0.4 });
  cue(A('a4', /^собак/) + 0.15, 'bark', { gain: 0.8 });
  cue(A('a5', /^мозг/) + 0.3, 'panic', { gain: 0.4 });
  cue(A('a5', /^понима/) + 0.1, 'ding', { gain: 0.6 });
  cue(LS('a6') + 0.15, 'sparkle', { gain: 0.5 });
  cue(A('a6', /^актёр/) + 0.25, 'boing', { gain: 0.4 });
  cue(A('a6', /^между/) + 0.2, 'stamp', { gain: 0.4 });
  cue(A('a7', /^паузу/) + 0.15, 'click', { pitch: 0.7, gain: 0.7 });
  cue(A('b1', /^нюта/) + 0.1, 'sparkle', { gain: 0.4 });
  cue(ws('b1', /^выключ/) - 0.1, 'switch', { gain: 0.7 });
  cue(LS('b2'), 'impact', { gain: 0.4 }); cue(LS('b2'), 'riser', { dur: 1.2, gain: 0.5 });
  cue(LS('b4'), 'crackle', { dur: L.b5.start - L.b4.start, gain: 0.6 });
  cue(ws('b4', /^хищник/) - 0.1, 'thud', { gain: 0.5 });
  cue(A('b4', /^кто/) + 0.1, 'tada', { gain: 0.4 });
  cue(A('b5', /^монстр/), 'stamp', { gain: 0.6 });
  cue(LS('b6'), 'switch', { gain: 0.8 }); cue(LS('b6') + 0.1, 'ding', { gain: 0.5 });
  cue(A('b6', /^подружи/) + 0.1, 'sparkle', { gain: 0.6 });
  cue(A('c1', /^бублик/) + 0.1, 'bark', { pitch: 1.2, gain: 0.5 });
  cue(A('c1', /^окном/), 'rain', { dur: L.c3.start - L.c1.start, gain: 0.6 });
  cue(A('c1', /^окном/) + 0.3, 'thunder', { dur: 2.0, gain: 0.6 });
  cue(LS('c2') - 0.02, 'thunder', { dur: 2.6, gain: 1.0 });
  cue(LS('c4') + 0.05, 'thunder', { dur: 1.4, gain: 0.5 });
  cue(ws('c4', /^собак/) - 0.1, 'bark', { gain: 0.5 });
  cue(A('c5', /^опасна/) + 0.05, 'impact', { gain: 0.35 });
  cue(A('c5', /^дома/) + 0.3, 'ding', { gain: 0.5 });
  cue(A('c6', /^дерев/) + 0.1, 'thunder', { dur: 1.4, gain: 0.45 });
  cue(A('c6', /^здани/), 'slide', { dur: 0.8, gain: 0.25 });
  cue(LS('c7') + 0.1, 'ding', { gain: 0.5 });
  { const t0 = A('c7', /^вспышк/), td = ws('c7', /^дели/) - 0.12; for (let i = 0; i < 6; i++) cue(t0 + 0.1 + i / 6 * (td - t0 - 0.1), 'tick', { pitch: 0.9 + i * 0.06, gain: 0.5 }); cue(td, 'thunder', { dur: 1.6, gain: 0.4 }); }
  cue(ws('c7', /^три/) - 0.1, 'ding', { gain: 0.6 });
  ['четыре', 'пять', 'шесть'].forEach(w => cue(ws('e1', new RegExp('^' + w)) - 0.1, 'boing', { gain: 0.3 }));
  cue(A('e1', /^пиши/) + 0.1, 'tada', { gain: 0.5 });
  cue(A('e1', /^пиши/) + 0.5, 'bark', { pitch: 1.2, gain: 0.4 });
  CUES.sort((a, b) => a.t - b.t);
}

function renderFrame(t) {
  T = t; NID = 0; STEP = Math.floor(t * 8);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  let i = 0; SHOTS.forEach((s, n) => { if (t >= s.t) i = n; });
  const sh = SHOTS[i], t1 = i + 1 < SHOTS.length ? SHOTS[i + 1].t : TL.total;
  CUR_BG = sh.bg; ctx.fillStyle = sh.bg; ctx.fillRect(0, 0, W, H);
  // пол: чуть темнее фона, мягкий переход
  const sd = shadeOf(sh.bg);
  if (sd) { ctx.save(); ctx.globalAlpha = 0.35; ctx.fillStyle = sd; ctx.fillRect(0, GROUND - 10, W, H); ctx.restore(); }
  sh.draw(t, sh.t, t1);
  NID = 5000;
  drawLabel(sh, t);
  drawBadge(t);
  drawCaptions(t);
}

async function ready() {
  await Promise.all(['700 40px BalsC', '700 40px BalsL'].map(f => document.fonts.load(f)));
  return document.fonts.check('700 40px BalsC');
}
window.setup = setup; window.renderFrame = renderFrame; window.ready = ready;

if (location.search.includes('preview')) {
  fetch('build/timeline.json').then(r => r.json()).then(async tl => {
    await ready(); setup(tl);
    const t0 = performance.now();
    const loop = () => { renderFrame(((performance.now() - t0) / 1000) % tl.total); requestAnimationFrame(loop); };
    loop();
  });
}
</script>
