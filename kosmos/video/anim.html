<canvas id="c" width="1080" height="1920"></canvas>
<script>
'use strict';
// Три вертикальных ролика про космос (1080×1920, 30 к/с).
// Кадр — функция времени: renderFrame(t) рисует момент t. Кадры рендерятся по порядку,
// поэтому следы частиц (затухание прошлого кадра) получаются одинаковыми при каждой сборке.
// Посмотреть в браузере: anim.html?v=1 (или 2, 3; &lang=en — английские титры) через локальный сервер.
const W = 1080, H = 1920, TAU = Math.PI * 2;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const FD = 'UnbC, UnbL, sans-serif', FM = 'MonoC, MonoL, monospace', FL = 'LitC, LitL, serif';
const C = { void: '#05060b', panel: '#0b0d16', line: '#2a2e42', star: '#ece6da', dust: '#a3a0b6', disk: '#ffa04a', hot: '#ffe1b4', quant: '#86d4ff' };

/* ---------- утилиты ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeIn = k => k * k * k;
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const win = (t, a, b, fi = 0.4, fo = 0.4) => easeOut(inv(a, a + fi, t)) * (1 - inv(b - fo, b, t));
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function circle(g, x, y, r) { g.beginPath(); g.arc(x, y, Math.max(0, r), 0, TAU); }
function glow(g, x, y, r, rgb, a) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, `rgba(${rgb},${a})`); gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr; circle(g, x, y, r); g.fill();
}
const PAL = (() => {
  const st = [[70, 14, 6], [170, 48, 14], [240, 110, 34], [255, 170, 80], [255, 214, 150], [255, 240, 215], [226, 236, 255]];
  const out = [];
  for (let i = 0; i < 64; i++) {
    const t = i / 63 * (st.length - 1), k = Math.min(st.length - 2, Math.floor(t)), f = t - k, a = st[k], b = st[k + 1];
    out.push(`rgb(${Math.round(lerp(a[0], b[0], f))},${Math.round(lerp(a[1], b[1], f))},${Math.round(lerp(a[2], b[2], f))})`);
  }
  return out;
})();
let CUES = [], LANG = 'ru';
const L = (ru, en) => (LANG === 'en' ? en : ru);
const cue = (t, type, v = 1) => CUES.push({ t: +t.toFixed(3), type, v });

/* ---------- текст ---------- */
// [слово] — акцентный цвет
function parseRich(s) {
  const segs = []; let acc = false, buf = '';
  for (const ch of s) {
    if (ch === '[' || ch === ']') { if (buf) segs.push({ t: buf, a: acc }); buf = ''; acc = ch === '['; }
    else buf += ch;
  }
  if (buf) segs.push({ t: buf, a: acc });
  const toks = [];
  for (const sg of segs) for (const p of sg.t.split(/(\s+)/)) { if (!p) continue; toks.push(/^\s+$/.test(p) ? { sp: true } : { w: p, a: sg.a }); }
  return toks;
}
function layout(s, font, maxW) {
  ctx.font = font;
  const groups = []; let cur = null;
  for (const tk of parseRich(s)) {
    if (tk.sp) { cur = null; continue; }
    if (!cur) { cur = { pieces: [], w: 0 }; groups.push(cur); }
    cur.pieces.push(tk); cur.w += ctx.measureText(tk.w).width;
  }
  const spW = ctx.measureText(' ').width, lines = [];
  let line = { gs: [], w: 0 };
  for (const g of groups) {
    const add = line.gs.length ? spW + g.w : g.w;
    if (line.gs.length && line.w + add > maxW) { lines.push(line); line = { gs: [g], w: g.w }; }
    else { line.gs.push(g); line.w += add; }
  }
  if (line.gs.length) lines.push(line);
  return { lines, spW };
}
function drawRich(s, x, y, size, alpha, o = {}) {
  if (alpha <= 0) return;
  const font = `${o.weight || 700} ${size}px ${o.family || FD}`;
  const { lines, spW } = layout(s, font, o.maxW || 860);
  const lh = size * (o.lh || 1.24), total = lines.length * lh;
  if (o.band !== false) {
    const top = y - total / 2 - size * 0.9, bot = y + total / 2 + size * 0.9;
    const gr = ctx.createLinearGradient(0, top, 0, bot);
    gr.addColorStop(0, 'rgba(5,6,11,0)'); gr.addColorStop(0.3, `rgba(5,6,11,${0.62 * alpha})`); gr.addColorStop(0.7, `rgba(5,6,11,${0.62 * alpha})`); gr.addColorStop(1, 'rgba(5,6,11,0)');
    ctx.fillStyle = gr; ctx.fillRect(0, top, W, bot - top);
  }
  ctx.save();
  ctx.font = font; ctx.textBaseline = 'middle'; ctx.textAlign = 'left'; ctx.globalAlpha = alpha;
  ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = size * 0.45;
  let yy = y - total / 2 + lh / 2;
  for (const ln of lines) {
    let xx = x - ln.w / 2;
    for (const g of ln.gs) {
      for (const p of g.pieces) { ctx.fillStyle = p.a ? (o.accent || C.disk) : (o.color || C.star); ctx.fillText(p.w, xx, yy); xx += ctx.measureText(p.w).width; }
      xx += spW;
    }
    yy += lh;
  }
  ctx.restore();
}
function captions(t, list) {
  for (const c of list) {
    if (t < c.a || t > c.b) continue;
    const kin = easeOut(inv(c.a, c.a + 0.35, t)), kout = inv(c.b - 0.3, c.b, t);
    drawRich(Array.isArray(c.s) ? L(c.s[0], c.s[1]) : c.s, 540, (c.y || 1330) + (1 - kin) * 26 - kout * 14, c.size || 62, kin * (1 - kout), c);
  }
}
function brand(a = 0.6) {
  ctx.save();
  ctx.globalAlpha = a; ctx.font = `500 26px ${FM}`; ctx.letterSpacing = '6px';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = C.star;
  ctx.fillText(L('ГОРИЗОНТ СОБЫТИЙ', 'EVENT HORIZON'), 540, 150);
  ctx.restore();
}
function endCard(t, a) {
  const k = easeOut(inv(a, a + 0.7, t));
  if (k <= 0) return;
  ctx.fillStyle = `rgba(5,6,11,${0.92 * k})`; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.globalAlpha = k; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  glow(ctx, 540, 900, 420, '255,160,74', 0.12 * k);
  ctx.fillStyle = '#000'; circle(ctx, 540, 660, 64); ctx.fill();
  ctx.strokeStyle = C.disk; ctx.lineWidth = 3; circle(ctx, 540, 660, 64); ctx.stroke();
  glow(ctx, 540, 660, 110, '255,160,74', 0.25);
  ctx.font = `800 104px ${FD}`; ctx.letterSpacing = '-3px'; ctx.fillStyle = C.star;
  ctx.fillText(L('ГОРИЗОНТ', 'EVENT'), 540, 900);
  ctx.font = `italic 300 124px ${FL}`; ctx.letterSpacing = '0px'; ctx.fillStyle = C.hot;
  ctx.fillText(L('событий', 'horizon'), 540, 1030);
  ctx.font = `500 30px ${FM}`; ctx.letterSpacing = '3px'; ctx.fillStyle = C.dust;
  ctx.fillText(L('чёрные дыры · кванты · космос', 'black holes · quantum · cosmos'), 540, 1140);
  ctx.restore();
}

/* ---------- фон: звёзды ---------- */
function makeStars(seed, n) {
  const R = rng(seed), s = [];
  for (let i = 0; i < n; i++) s.push({ x: R() * W, y: R() * H, m: Math.pow(R(), 3), tw: R() * TAU, born: R() });
  return s;
}
function drawStars(stars, t, a = 1, bornBy = 1) {
  ctx.fillStyle = C.star;
  for (const s of stars) {
    if (s.born > bornBy) continue;
    const fade = clamp((bornBy - s.born) * 12);
    ctx.globalAlpha = a * fade * (0.18 + 0.75 * s.m) * (0.75 + 0.25 * Math.sin(t * 1.6 + s.tw));
    const z = 1.2 + s.m * 2.6;
    ctx.fillRect(s.x - z / 2, s.y - z / 2, z, z);
  }
  ctx.globalAlpha = 1;
}

/* ---------- космонавт ---------- */
function astronaut(g, x, y, ang, st, alpha, size = 1) {
  g.save();
  g.translate(x, y); g.rotate(ang); g.scale(size * st, size / Math.sqrt(st));
  g.globalAlpha = alpha;
  g.fillStyle = '#ece6da'; g.strokeStyle = '#ece6da'; g.lineCap = 'round'; g.lineWidth = 2.4;
  g.beginPath(); g.moveTo(4, -2); g.lineTo(12, -3.2); g.moveTo(4, 2); g.lineTo(12, 3.2); g.stroke();
  g.beginPath(); g.moveTo(-5, -3.6); g.lineTo(1, -6.5); g.moveTo(-5, 3.6); g.lineTo(1, 6.5); g.stroke();
  g.beginPath(); g.roundRect(-7, -4, 12, 8, 3); g.fill();
  circle(g, -11, 0, 4.4); g.fill();
  g.fillStyle = '#ffa04a'; g.beginPath(); g.ellipse(-12.2, 0, 1.8, 2.8, 0, 0, TAU); g.fill();
  g.restore();
}

/* ---------- чёрная дыра: диск, доплер, линзирование (как на сайте) ---------- */
function makeBH(seed, N, NS) {
  const R = rng(seed);
  const layer = document.createElement('canvas'); layer.width = W; layer.height = H;
  const g = layer.getContext('2d');
  const parts = [];
  for (let i = 0; i < N; i++) {
    const r = 3 + Math.pow(R(), 1.8) * 9.5, v = Math.sqrt(0.5 / (r - 1)), h = Math.pow(3 / r, 0.75);
    parts.push({ r, a: R() * TAU, z: (R() - 0.5) * 0.05 * r, s: 0.6 + R() * 1.1, b: 0.35 + R() * 0.65, v, w: v / r, gi: Math.sqrt(1 - v * v), g: Math.sqrt(1 - 1 / r), h, h2: Math.pow(h, 1.6) });
  }
  const stars = [];
  for (let i = 0; i < NS; i++) stars.push({ x: R(), y: R(), m: Math.pow(R(), 3), c: ['#ffffff', '#dfe8ff', '#fff1dc', '#cfdcff', '#ffe2c4'][(R() * 5) | 0], tw: R() * TAU });
  const ax = new Float32Array(N), ay = new Float32Array(N), aD = new Float32Array(N), aI = new Float32Array(N), aC = new Uint8Array(N);
  let drift = 0, time = 0, first = true;
  function starImg(cx, cy, u, nx, ny, th, mu, st, tw, SH) {
    if (th < SH) return;
    const a = Math.min(1, (0.03 + 0.24 * st.m) * tw * Math.min(mu, 6));
    if (a < 0.02) return;
    g.globalAlpha = a;
    if (mu > 1.8) {
      const ang = Math.atan2(ny, nx), span = Math.min(0.45, 0.006 * mu * (1 + st.m * 3));
      g.strokeStyle = st.c; g.lineWidth = 1.2 + st.m * 2;
      g.beginPath(); g.arc(cx, cy, th * u, ang - span, ang + span); g.stroke();
    } else {
      const sz = 1.2 + st.m * 2.6;
      g.fillStyle = st.c; g.fillRect(cx + nx * th * u - sz / 2, cy + ny * th * u - sz / 2, sz, sz);
    }
  }
  function draw(cx, cy, u, tilt, dt, fade = 0.2) {
    time += dt; drift += dt * 0.28;
    const sT = Math.sin(tilt), cT = Math.cos(tilt), SH = 2.62;
    g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
    g.fillStyle = first ? C.void : `rgba(5,6,11,${fade})`; g.fillRect(0, 0, W, H); first = false;
    g.globalCompositeOperation = 'lighter';
    glow(g, cx, cy, u * 16, '255,130,50', 0.022);
    const FW = W / u * 1.2, FH = H / u * 1.2, ox = (FW - W / u) / 2, oy = (FH - H / u) / 2;
    const rE = 4.2, k4 = 4 * rE * rE;
    for (const st of stars) {
      const xs = (((st.x * FW + drift) % FW) + FW) % FW - ox;
      const ys = (((st.y * FH + drift * 0.22) % FH) + FH) % FH - oy;
      const x = xs - cx / u, y = ys - cy / u;
      const b = Math.hypot(x, y) || 1e-4, q = Math.sqrt(b * b + k4);
      const uu = b / rE, base = (uu * uu + 2) / (2 * uu * Math.sqrt(uu * uu + 4));
      const tw = 0.72 + 0.28 * Math.sin(time * 1.7 + st.tw), nx = x / b, ny = y / b;
      starImg(cx, cy, u, nx, ny, (b + q) / 2, base + 0.5, st, tw, SH);
      const tm = (q - b) / 2;
      if (tm > SH) starImg(cx, cy, u, -nx, -ny, tm, base - 0.5, st, tw, SH);
    }
    const n = parts.length, spin = dt * 7;
    for (let i = 0; i < n; i++) {
      const p = parts[i];
      p.a += p.w * spin;
      const ca = Math.cos(p.a), sa = Math.sin(p.a), Dp = p.r * sa;
      ax[i] = p.r * ca; ay[i] = -Dp * sT - p.z * cT; aD[i] = Dp * cT;
      const D = p.gi / (1 - p.v * (-ca * cT));
      aI[i] = p.b * Math.pow(D, 2.4) * p.g * p.h2 * 0.3;
      aC[i] = clamp(Math.round(p.h * Math.pow(D, 0.45) * p.g * 1.12 * 63), 0, 63);
    }
    const sz0 = clamp(u * 0.038, 1.3, 6);
    for (let i = 0; i < n; i++) {
      const dep = aD[i]; if (dep <= 0) continue;
      const x = ax[i], y = ay[i], b = Math.hypot(x, y), kk = 8 * dep, q = Math.sqrt(b * b + kk);
      let nx = 0, ny = -1; if (b > 1e-4) { nx = x / b; ny = y / b; }
      const rr = Math.sqrt(kk / 4), uu = Math.max(b / rr, 1e-3), base = (uu * uu + 2) / (2 * uu * Math.sqrt(uu * uu + 4));
      const sz = sz0 * parts[i].s; g.fillStyle = PAL[aC[i]];
      const tp = (b + q) / 2;
      if (tp > SH * 0.98) { g.globalAlpha = Math.min(1, aI[i] * Math.min(base + 0.5, 2.5) * 1.5); g.fillRect(cx + nx * tp * u - sz / 2, cy + ny * tp * u - sz / 2, sz, sz); }
      const tm = (q - b) / 2;
      if (tm > SH) { g.globalAlpha = Math.min(1, aI[i] * Math.min(base - 0.5, 1.2) * 0.8); g.fillRect(cx - nx * tm * u - sz / 2, cy - ny * tm * u - sz / 2, sz, sz); }
    }
    g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
    g.fillStyle = '#000'; circle(g, cx, cy, SH * u); g.fill();
    g.globalCompositeOperation = 'lighter';
    const lg = g.createLinearGradient(cx - SH * u, 0, cx + SH * u, 0);
    lg.addColorStop(0, 'rgba(255,238,205,0.3)'); lg.addColorStop(1, 'rgba(255,160,80,0.07)');
    g.strokeStyle = lg; g.lineWidth = Math.max(1.5, u * 0.06); circle(g, cx, cy, SH * u * 1.01); g.stroke();
    g.globalAlpha = 0.1; g.lineWidth = Math.max(3, u * 0.3); circle(g, cx, cy, SH * u * 1.06); g.stroke();
    for (let i = 0; i < n; i++) {
      if (aD[i] > 0) continue;
      const sz = sz0 * parts[i].s;
      g.globalAlpha = Math.min(1, aI[i] * (ax[i] * ax[i] + ay[i] * ay[i] < SH * SH ? 2.4 : 1));
      g.fillStyle = PAL[aC[i]];
      g.fillRect(cx + ax[i] * u - sz / 2, cy + ay[i] * u - sz / 2, sz, sz);
    }
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  }
  return { layer, draw };
}

/* =====================================================================
   Ролик 1. Что будет, если упасть в чёрную дыру
   ===================================================================== */
const V1 = (() => {
  let bh, lastTick;
  const CAPS = [
    { a: 0.15, b: 3.9, s: ['Что будет, если [упасть] в чёрную дыру?', 'What happens if you [fall] into a black hole?'], size: 76 },
    { a: 4.0, b: 7.2, s: ['[Sgr A*] — чёрная дыра в центре нашей Галактики', '[Sgr A*] is the black hole at the center of our galaxy'] },
    { a: 7.2, b: 10.4, s: ['Она в [4 миллиона] раз тяжелее Солнца', 'It is [4 million] times heavier than the Sun'] },
    { a: 10.4, b: 13.4, s: ['Свет огибает её, поэтому диск виден [сверху и снизу]', 'Light bends around it, so the disk shows [above and below]'] },
    { a: 13.4, b: 16.4, s: ['У горизонта [время замедляется]', 'Near the horizon, [time slows down]'] },
    { a: 16.4, b: 19.4, s: ['Час рядом с ней — это [7 лет] на Земле', 'One hour next to it is [7 years] on Earth'] },
    { a: 19.4, b: 22.6, s: ['Маленькая дыра растянула бы тебя [в спагетти]', 'A small black hole would stretch you [into spaghetti]'] },
    { a: 22.6, b: 25.4, s: ['А горизонт гиганта пересечёшь [и не заметишь]', 'A giant one you could cross [without noticing]'] },
    { a: 25.7, b: 28.0, s: ['Но назад [дороги нет]', 'But there is [no way back]'], y: 960, size: 72, band: false }
  ];
  const uAt = t => {
    if (t < 4) return lerp(21, 24, t / 4);
    if (t < 12) return lerp(24, 38, easeInOut(inv(4, 12, t)));
    if (t < 19.4) return lerp(38, 44, inv(12, 19.4, t));
    if (t < 25.4) return lerp(44, 50, inv(19.4, 25.4, t));
    return 50 * Math.pow(70, easeIn(inv(25.4, 27.6, t)));
  };
  function clocks(t) {
    const k = win(t, 13.4, 19.5, 0.45, 0.4);
    if (k <= 0) return;

    ctx.save(); ctx.globalAlpha = k;
    ctx.fillStyle = 'rgba(11,13,22,0.82)'; ctx.strokeStyle = C.line; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(110, 210, 860, 400, 28); ctx.fill(); ctx.stroke();
    const face = (x, col) => {
      ctx.fillStyle = '#121522'; circle(ctx, x, 380, 118); ctx.fill();
      ctx.strokeStyle = C.line; ctx.lineWidth = 2; circle(ctx, x, 380, 118); ctx.stroke();
      ctx.strokeStyle = C.dust;
      for (let i = 0; i < 12; i++) { const a = i / 12 * TAU; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * 98, 380 + Math.sin(a) * 98); ctx.lineTo(x + Math.cos(a) * 112, 380 + Math.sin(a) * 112); ctx.stroke(); }
      ctx.fillStyle = col; circle(ctx, x, 380, 7); ctx.fill();
    };
    const hand = (x, a, len, w, col) => { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x, 380); ctx.lineTo(x + Math.cos(a - Math.PI / 2) * len, 380 + Math.sin(a - Math.PI / 2) * len); ctx.stroke(); };
    face(320, C.disk);
    hand(320, (10 + f) / 12 * TAU, 58, 8, C.star);
    hand(320, f * TAU, 88, 5, C.disk);
    face(760, C.quant);
    ctx.globalAlpha = k * 0.22; ctx.fillStyle = C.quant; circle(ctx, 760, 380, 90 * clamp(f * 8)); ctx.fill();
    ctx.globalAlpha = k * 0.12; ctx.fillStyle = C.star; circle(ctx, 760, 380, 60 * clamp(f * 8)); ctx.fill();
    ctx.globalAlpha = k;
    if (f <= 0) { hand(760, 10 / 12 * TAU, 58, 8, C.star); hand(760, 0, 88, 5, C.quant); }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `500 28px ${FM}`;
    ctx.fillStyle = C.disk; ctx.fillText(L('у горизонта', 'near the horizon'), 320, 535);
    ctx.fillStyle = C.quant; ctx.fillText(L('на Земле', 'on Earth'), 760, 535);
    ctx.font = `700 40px ${FD}`; ctx.fillStyle = C.star;
