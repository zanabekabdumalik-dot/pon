<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="GeneGuard AI — an educational prototype that explains genetic test results in plain language. Not a diagnostic tool." />
    <meta name="theme-color" content="#0b1730" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>GeneGuard AI</title>
    <script>
      // Theme: an explicit data-theme on <html> (set by an embedding viewer) wins, then the
      // user's own toggle, then the system setting.
      (function () {
        var root = document.documentElement;
        function saved() {
          try { return localStorage.getItem('gg-theme'); } catch (e) { return null; }
        }
        function apply() {
          var t = root.getAttribute('data-theme');
          var s = saved();
          var dark = t ? t === 'dark' : s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          root.classList.toggle('dark', dark);
        }
        apply();
        try { new MutationObserver(apply).observe(root, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}
        try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', apply); } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
