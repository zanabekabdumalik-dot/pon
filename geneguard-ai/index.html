<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="GeneGuard AI — an educational prototype that explains genetic test results in plain language. Not a diagnostic tool." />
    <meta name="theme-color" content="#0b1730" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>GeneGuard AI</title>
    <script>
      try {
        var t = localStorage.getItem('gg-theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
