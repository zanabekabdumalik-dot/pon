<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Фобия №1 — анимация</title>
<style>
  @font-face { font-family: 'RubikC'; font-weight: 900; src: url('node_modules/@fontsource/rubik/files/rubik-cyrillic-900-normal.woff2') format('woff2'); }
  @font-face { font-family: 'RubikL'; font-weight: 900; src: url('node_modules/@fontsource/rubik/files/rubik-latin-900-normal.woff2') format('woff2'); }
  @font-face { font-family: 'RubikC'; font-weight: 700; src: url('node_modules/@fontsource/rubik/files/rubik-cyrillic-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'RubikL'; font-weight: 700; src: url('node_modules/@fontsource/rubik/files/rubik-latin-700-normal.woff2') format('woff2'); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
'use strict';
// Мультик «Фобия №1 из 100: гиппопотомонстросесквиппедалиофобия».
// Всё рисуется детерминированно от времени t: renderFrame(t) → кадр.
const W = 1080, H = 1920, TAU = Math.PI * 2, GROUND = 1220;
const FONT = 'RubikC, RubikL, sans-serif';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const C = {
  ink: '#2A1E2E', body: '#FFB547', belly: '#FFDB94', shoe: '#E8505B', blush: '#FF7A8A',
  white: '#FFFFFF', yellow: '#FFE14D', red: '#FF4D6D',
  chunk: ['#8E6CDF', '#22B8A7', '#FF9F1C', '#E63946'],   // гиппопото / монстро / сесквиппедалио / фобия
};
const LONG = 'ГИППОПОТОМОНСТРОСЕСКВИППЕДАЛИОФОБИЯ';
const CHUNKS = [9, 7, 14, 5];

// ---------- утилиты ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeIn = k => k * k * k;
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOutBack = (k, s = 1.9) => k <= 0 ? 0 : 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2);
const pop = (t, t0, d = 0.32) => easeOutBack(inv(t0, t0 + d, t));
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const noise1 = x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u) * 2 - 1; };
const frac = x => x - Math.floor(x);
function chunkOf(i) { let n = 0; for (let c = 0; c < CHUNKS.length; c++) { n += CHUNKS[c]; if (i < n) return c; } return 3; }
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, k) { const A = hex2rgb(a), B = hex2rgb(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',')})`; }

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function setFont(size, weight = 900) { ctx.font = `${weight} ${size}px ${FONT}`; }
function text(str, x, y, size, o = {}) {
  const { fill = '#fff', stroke = C.ink, sw = 0, weight = 900, align = 'center', maxW = 0 } = o;
  setFont(size, weight);
  if (maxW) { const w = ctx.measureText(str).width; if (w > maxW) { size *= maxW / w; setFont(size, weight); } }
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (sw) { ctx.lineJoin = 'round'; ctx.miterLimit = 2; ctx.lineWidth = sw; ctx.strokeStyle = stroke; ctx.strokeText(str, x, y); }
  ctx.fillStyle = fill; ctx.fillText(str, x, y);
}
function withT(x, y, rot, sc, fn, alpha = 1) {
  if (sc <= 0.001 || alpha <= 0.001) return;
  ctx.save(); ctx.globalAlpha *= clamp(alpha); ctx.translate(x, y); if (rot) ctx.rotate(rot); if (sc !== 1) ctx.scale(sc, sc); fn(); ctx.restore();
}
function tile(ch, size, color, glow = 0) {
  const h = size / 2, r = size * 0.2;
  ctx.fillStyle = 'rgba(30,10,40,0.22)'; rr(-h + size * 0.05, -h + size * 0.09, size, size, r); ctx.fill();
  ctx.fillStyle = color; rr(-h, -h, size, size, r); ctx.fill();
  ctx.lineWidth = Math.max(3, size * 0.055); ctx.strokeStyle = C.ink; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.25)'; rr(-h + size * 0.12, -h + size * 0.09, size * 0.76, size * 0.2, size * 0.1); ctx.fill();
  if (glow > 0) { ctx.fillStyle = `rgba(255,255,255,${0.55 * glow})`; rr(-h, -h, size, size, r); ctx.fill(); }
  text(ch, 0, size * 0.05, size * 0.6, { sw: size * 0.1 });
}
function star(x, y, r, rot, fill) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = rot + i * Math.PI / 5 - Math.PI / 2, rad = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); }
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = C.ink; ctx.lineJoin = 'round'; ctx.stroke();
}
function heart(x, y, s, fill = '#FF4D6D') {
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 30, s / 30);
  ctx.beginPath(); ctx.moveTo(0, 12);
  ctx.bezierCurveTo(-30, -8, -16, -32, 0, -16); ctx.bezierCurveTo(16, -32, 30, -8, 0, 12);
  ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = C.ink; ctx.stroke(); ctx.restore();
}

// ---------- тайминги ----------
let TL, L = {}, S = {}, CUES = [], PAGES = [], T = 0;
let tK, tD, tSoup, tLove, faintT, faintLand, jumpEnd, countS, countE, shortT, impulses = [];

function findWord(id, re) {
  const w = L[id].words.find(x => re.test(x.w.toLowerCase()));
  if (!w) throw new Error(`нет слова ${re} в ${id}`);
  return w;
}

function setup(tl) {
  TL = tl; L = {}; tl.lines.forEach(l => L[l.id] = l);
  const b = id => L[id].start - 0.25;
  S = {
    hook: [0, b('l2')], meet: [b('l2'), b('l5')], panic: [b('l5'), b('l8')],
    drum: [b('l8'), L.l9.start - 0.5], word: [L.l9.start - 0.5, b('l11')],
    parts: [b('l11'), b('l15')], short: [b('l15'), b('l17')], end: [b('l17'), tl.total],
  };
  tK = findWord('l4', /^кот/).s; tD = findWord('l4', /^дом/).s; tSoup = findWord('l4', /^суп/).s;
  tLove = findWord('l4', /^обожа/).s;
  faintT = L.l9.end + 0.08; faintLand = faintT + 0.45;
  jumpEnd = L.l17.start - 0.15;
  countS = L.l10.sentences[1][0]; countE = findWord('l10', /^тридцат/).s;
  shortT = findWord('l15', /^сесквипед/).s;
  impulses = [
    { t: L.l6.start + 0.06, a: 24, d: 0.55 }, { t: S.word[0], a: 26, d: 0.6 },
    { t: faintLand, a: 18, d: 0.45 }, { t: countE, a: 14, d: 0.35 },
  ];
  buildCaptions(); buildCues();
  return { cues: CUES, scenes: S };
}

// ---------- субтитры ----------
const CAP_SIZE = 74, CAP_MAXW = 880, CAP_Y = 1405;
function buildCaptions() {
  PAGES = []; setFont(CAP_SIZE);
  for (const l of TL.lines) {
    if (l.hide_caption) continue;
    let cur = [];
    const flush = () => { if (cur.length) PAGES.push({ words: cur }); cur = []; };
    for (const w of l.words) {
      const width = ctx.measureText([...cur, w].map(x => x.w.toUpperCase()).join('  ')).width;
      if (cur.length && (width > CAP_MAXW || cur.length >= 3)) flush();
      cur.push(w);
      if (/[.!?…]»?$/.test(w.w)) flush();
    }
    flush();
  }
  PAGES.forEach(p => p.s = p.words[0].s - 0.06);
  PAGES.forEach((p, i) => {
    const last = p.words[p.words.length - 1].e, next = PAGES[i + 1];
    p.e = next ? Math.min(next.s, last + 0.55) : last + 0.8;
  });
}
function drawCaptions(t) {
  const p = PAGES.find(p => t >= p.s && t < p.e);
  if (!p) return;
  const sc = lerp(0.82, 1, easeOutBack(inv(p.s, p.s + 0.16, t)));
  setFont(CAP_SIZE);
  const words = p.words.map(w => w.w.toUpperCase());
  const space = CAP_SIZE * 0.36;
  let cur = -1; p.words.forEach((w, i) => { if (t >= w.s - 0.03) cur = i; });
  const grow = words.map((w, i) => i === cur ? 1 + 0.1 * easeOutBack(inv(p.words[i].s - 0.03, p.words[i].s + 0.1, t)) : 1);
  const widths = words.map((w, i) => (ctx.measureText(w).width + 16) * grow[i]);
  const total = widths.reduce((a, b) => a + b, 0) + space * (words.length - 1);
  const fit = Math.min(1, CAP_MAXW / total);
  withT(540, CAP_Y, 0, sc * fit, () => {
    let x = -total / 2;
    words.forEach((w, i) => {
      withT(x + widths[i] / 2, 0, 0, grow[i], () => text(w, 0, 0, CAP_SIZE, { fill: i === cur ? C.yellow : '#fff', sw: 16 }));
      x += widths[i] + space;
    });
  });
}

// ---------- звук: метки для audio.py ----------
function buildCues() {
  CUES = [];
  const cue = (t, type, o = {}) => CUES.push({ t: +t.toFixed(3), type, ...o });
  // музыка: громкость 0..1 с плавным переходом
  cue(0, 'music', { gain: 0, fade: 0.01 });
  cue(S.meet[0], 'music', { gain: 1, fade: 0.4 });
  cue(L.l5.start - 0.1, 'music', { gain: 0, fade: 0.9 });
  cue(L.l10.start + 0.3, 'music', { gain: 1, fade: 1.2 });
  cue(TL.total - 1.6, 'music', { gain: 0, fade: 1.5 });
  // хук
  cue(0, 'drone', { dur: S.meet[0] + 0.2, gain: 0.7 });
  L.l1.words.forEach((w, i) => cue(w.s - 0.04, i === 2 ? 'boom' : 'pop', { pitch: 1 + i * 0.06, gain: i === 2 ? 0.7 : 0.5 }));
  // знакомство
  cue(S.meet[0] + 0.02, 'boing', { gain: 0.6 }); cue(S.meet[0] + 0.55, 'thud', { gain: 0.5 });
  cue(findWord('l2', /^петя/).s - 0.05, 'pop', { pitch: 1.2 });
  cue(L.l3.start, 'pop', { pitch: 0.9 });
  [tK, tD, tSoup].forEach((t, i) => cue(t - 0.05, 'pop', { pitch: 1.1 + i * 0.15 }));
  cue(tLove - 0.05, 'sparkle');
  // паника
  cue(L.l5.start, 'riser', { dur: L.l6.start - L.l5.start });
  cue(L.l6.start - 0.5, 'whistle', { dur: 0.45, gain: 0.6 });
  cue(L.l6.start - 0.04, 'impact', { gain: 0.45 });
  cue(L.l7.start - 0.05, 'panic');
  // барабанная дробь → слово
  cue(L.l8.sentences[1][0] - 0.1, 'drumroll', { dur: S.word[0] - L.l8.sentences[1][0] + 0.1 });
  cue(S.word[0], 'crash', { gain: 0.6 }); cue(S.word[0], 'tada', { gain: 0.8 });
  for (let i = 0; i < LONG.length; i++) cue(bigTileT(i), 'click', { pitch: 0.9 + i * 0.02, gain: 0.25 });
  cue(faintT, 'slide', { dur: 0.45 }); cue(faintLand, 'thud'); cue(faintLand + 0.15, 'tweet');
  for (let i = 0; i < LONG.length; i++) cue(countT(i), 'tick', { pitch: 0.8 + i * 0.025, gain: 0.3 });
  cue(countE, 'stamp', { gain: 0.5 });
  // разбор слова
  cue(S.parts[0] + 0.05, 'whoosh');
  cue(L.l11.start - 0.05, 'pop', { pitch: 1 });
  partTimes().forEach((t, i) => cue(t - 0.05, 'pop', { pitch: 1 + i * 0.12 }));
  // короткий вариант
  cue(S.short[0] + 0.05, 'whoosh');
  cue(L.l15.start - 0.05, 'pop', { pitch: 1.05 });
  for (let i = 0; i < 17; i++) cue(shortT + i * 0.035, 'click', { pitch: 1 + i * 0.03, gain: 0.4 });
  cue(shortPillT(), 'ding');
  cue(L.l16.start - 0.15, 'whoosh', { gain: 0.5 });
  cue(L.l16.start + 0.5, 'snore', { dur: L.l17.start - L.l16.start - 0.6 });
  // финал
  cue(jumpEnd - 0.02, 'boing');
  cue(findWord('l17', /^фобия/).s - 0.05, 'tada', { gain: 0.6 });
  cue(findWord('l17', /^какую/).s - 0.05, 'pop', { pitch: 1.1 });
  cue(findWord('l17', /^пиши/).s - 0.05, 'pop', { pitch: 1.3 });
  CUES.sort((a, b) => a.t - b.t);
}
const shortPillT = () => Math.max(shortT + 0.9, L.l15.end + 0.08);
const bigTileT = i => L.l9.start + (i / (LONG.length - 1)) * Math.max(0.5, L.l9.end - L.l9.start - 0.2);
const countT = i => countS + (i / (LONG.length - 1)) * (countE - countS - 0.12);
function partTimes() {
  return [findWord('l12', /^гиппопото /).s, findWord('l12', /^монстро /).s, L.l13.start, findWord('l14', /^фобия/).s];
}

// ---------- камера ----------
function shakeAt(t) {
  let x = 0, y = 0;
  for (const im of impulses) {
    if (t < im.t || t > im.t + im.d) continue;
    const k = Math.pow(1 - (t - im.t) / im.d, 2) * im.a;
    x += noise1((t - im.t) * 40 + im.t) * k; y += noise1((t - im.t) * 40 + im.t + 50) * k;
  }
  return [x, y];
}

// ---------- Петя ----------
function blinkAt(t) {
  let b = 0;
  const n0 = Math.floor((t - 0.8) / 3.1);
  for (let n = n0 - 1; n <= n0 + 1; n++) {
    const tn = 0.8 + n * 3.1 + hash(n) * 1.3, d = Math.abs(t - tn);
    if (d < 0.09) b = Math.max(b, 1 - d / 0.09);
  }
  return b;
}
function petyaState(t) {
  const P = petyaPose(t);
  P.lift = 118 * P.s * Math.sin(-P.rot);
  return P;
}
function petyaPose(t) {
  const br = Math.sin(t * 2.6) * 0.018;
  const P = { x: 540, y: GROUND, s: 1, rot: 0, sx: 1 + br, sy: 1 - br, lookX: 0, lookY: 0, eye: 1, pupil: 1,
    blink: blinkAt(t), xeyes: 0, happy: 0, brow: 0, mouth: 'smile', mo: 0, blush: 0, sweat: 0, shake: 0,
    hair: 0, armsUp: 0, wave: 0, hearts: 0, stars: 0, zzz: 0, tongue: 0 };
  const m0 = S.meet[0];
  if (t < m0) {   // выглядывает из-за холма в хуке
    const scare = pop(t, findWord('l1', /^пугает/).s, 0.25);
    return Object.assign(P, { y: 1690 - 30 * scare, s: 1.25, eye: 1.25 + 0.15 * scare, pupil: 0.55, brow: 1, mouth: 'wavy',
      shake: 2.5 + 3 * scare, lookY: -1, sweat: 1, hair: 0.5 + 0.5 * scare, blink: 0 });
  }
  if (t < m0 + 0.55) {   // прыжок на сцену
    const e = inv(m0, m0 + 0.55, t), arc = Math.sin(e * Math.PI);
    return Object.assign(P, { y: lerp(1690, GROUND, easeOut(e)) - arc * 300, s: lerp(1.25, 1, e), armsUp: arc,
      mouth: 'smile', mo: 0.7, eye: 1.15, sy: 1 + 0.14 * arc, sx: 1 - 0.1 * arc, blink: 0 });
  }
  const lt = inv(m0 + 0.55, m0 + 0.85, t), sq = Math.sin(lt * Math.PI) * (1 - lt) * 0.25;
  P.sx += sq; P.sy -= sq;

  if (t < L.l3.start - 0.1) {                       // «Знакомьтесь, это Петя»
    Object.assign(P, { wave: inv(m0 + 0.6, m0 + 0.8, t), mouth: 'smile', mo: 0.55, blush: 0.6 });
  } else if (t < L.l4.start - 0.1) {                // боится длинных слов
    Object.assign(P, { mouth: 'wavy', brow: 1, lookY: -1, lookX: 0.15, sweat: 1, eye: 1.12, pupil: 0.8 });
  } else if (t < L.l5.start - 0.1) {                // короткие слова — любовь
    Object.assign(P, { mouth: 'smile', mo: 0.75, blush: 1, hearts: inv(tK, tK + 0.4, t) });
    if (t > tLove - 0.05) P.happy = 1;
    else if (t > tSoup - 0.05) { P.lookX = 0.8; P.lookY = -0.8; }
    else if (t > tD - 0.05) { P.lookY = -1; }
    else if (t > tK - 0.05) { P.lookX = -0.8; P.lookY = -0.8; }
  } else if (t < L.l6.start - 0.12) {               // что-то надвигается
    const k = inv(L.l5.start, L.l6.start, t);
    Object.assign(P, { mouth: 'flat', brow: 0.4 + 0.6 * k, lookY: -1, sweat: k, eye: 1 + 0.15 * k, pupil: 1 - 0.3 * k, shake: 1.5 * k });
  } else if (t < S.drum[0]) {                       // ПАНИКА
    const k = inv(L.l6.start - 0.12, L.l6.start + 0.1, t);
    Object.assign(P, { mouth: 'o', mo: k, eye: 1 + 0.4 * k, pupil: 1 - 0.5 * k, armsUp: k, hair: k, shake: 7 * k,
      sweat: 1, brow: 1, lookY: -1, blink: 0 });
    if (t > L.l7.start - 0.1) P.y -= Math.abs(Math.sin((t - L.l7.start) * 10)) * 45;
  } else if (t < S.word[0]) {                       // дрожит в темноте
    Object.assign(P, { mouth: 'wavy', eye: 1.2, pupil: 0.6, brow: 1, shake: 3, sweat: 1, armsUp: 0.15, hair: 0.4,
      lookX: Math.sin(t * 5.5) > 0 ? 0.9 : -0.9, lookY: -0.2, blink: 0 });
  } else if (t < faintT) {                          // слово растёт — Петя в ужасе
    const k = inv(L.l9.start, L.l9.end, t);
    Object.assign(P, { mouth: 'o', mo: 0.4 + 0.6 * k, eye: 1.25 + 0.3 * k, pupil: 0.55 - 0.2 * k, hair: 1, shake: 4 + 7 * k,
      armsUp: 1, sweat: 1, brow: 1, lookY: -1, blink: 0 });
  } else if (t < jumpEnd) {                         // обморок
    const k = inv(faintT, faintLand, t), after = t - faintLand;
    let f = easeIn(k);
    if (after > 0) f = 1 - 0.07 * Math.sin(after * 16) * Math.exp(-after * 7);
    Object.assign(P, { rot: -Math.PI / 2 * f, xeyes: k > 0.25 ? 1 : 0, mouth: 'wavy', tongue: k > 0.25 ? 1 : 0,
      armsUp: 1 - k, hair: 1 - k, stars: inv(faintLand, faintLand + 0.3, t), sx: 1, sy: 1, blink: 0,
      eye: k < 0.25 ? 1.5 : 1, pupil: 0.4, zzz: inv(L.l16.start + 0.3, L.l16.start + 0.8, t) });
  } else {                                          // встаёт и машет
    const j = inv(jumpEnd, jumpEnd + 0.45, t), arc = Math.sin(j * Math.PI);
    Object.assign(P, { rot: -Math.PI / 2 * (1 - easeOut(j)), y: GROUND - arc * 220, mouth: 'smile', mo: 0.8, blush: 0.8,
      wave: inv(jumpEnd + 0.4, jumpEnd + 0.6, t), armsUp: arc, stars: 1 - inv(jumpEnd, jumpEnd + 0.2, t) });
    if (j >= 1) { const l2 = inv(jumpEnd + 0.45, jumpEnd + 0.75, t), q = Math.sin(l2 * Math.PI) * (1 - l2) * 0.25; P.sx += q; P.sy -= q; }
    if (t > findWord('l17', /^какую/).s) { P.lookX = 0.3; }
  }
  return P;
}
function petyaPoint(P, lx, ly) {   // локальная точка Пети → мировые координаты
  const c = Math.cos(P.rot), s = Math.sin(P.rot);
  const x = lx * P.s * P.sx, y = ly * P.s * P.sy;
  return [P.x + x * c - y * s, P.y - P.lift + x * s + y * c];
}

function drawPetya(P, t, shadow = true) {
  const s = P.s;
  if (shadow) {
    const [bx] = petyaPoint(P, 0, -165), air = clamp((GROUND - (P.y - P.lift * 0)) / 400);
    const lying = Math.sin(-P.rot);
    ctx.fillStyle = `rgba(20,30,10,${0.22 * (1 - air)})`;
    ctx.beginPath(); ctx.ellipse(bx, GROUND + 6, (105 + 70 * lying) * s * (1 - air * 0.5), 16 * s, 0, 0, TAU); ctx.fill();
  }
  const jx = P.shake ? noise1(t * 31) * P.shake : 0, jy = P.shake ? noise1(t * 29 + 9) * P.shake * 0.6 : 0;
  ctx.save();
  ctx.translate(P.x + jx, P.y - P.lift + jy); ctx.rotate(P.rot); ctx.scale(s * P.sx, s * P.sy);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // ноги
  for (const d of [-1, 1]) {
    const kick = P.tongue ? Math.sin(t * 9 + d) * 10 : 0;
    ctx.strokeStyle = C.ink; ctx.lineWidth = 13;
    ctx.beginPath(); ctx.moveTo(d * 36, -45); ctx.lineTo(d * 44 + kick * 0.3, -10); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(d * 56 + kick * 0.3, -7, 30, 15, 0, 0, TAU);
    ctx.fillStyle = C.shoe; ctx.fill(); ctx.lineWidth = 6; ctx.stroke();
  }
  // руки
  const armAng = d => {
    let a = lerp(Math.PI * 0.36, -Math.PI * 0.4, P.armsUp);

  };

    const ex = sx + d * Math.cos(a) * 84, ey = sy + Math.sin(a) * 84;
    const mx = sx + d * Math.cos(a - 0.35 * d * d) * 46, my = sy + Math.sin(a) * 46 + 10;
    ctx.strokeStyle = C.ink; ctx.lineWidth = 13;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(mx, my, ex, ey); ctx.stroke();
    ctx.beginPath(); ctx.arc(ex, ey, 17, 0, TAU); ctx.fillStyle = C.body; ctx.fill(); ctx.lineWidth = 6; ctx.stroke();
  }
  // волосы
  ctx.strokeStyle = C.ink; ctx.lineWidth = 9;
  for (const d of [-1, 0, 1]) {
    const bx = d * 14, by = -298, len = 48 + 34 * P.hair;
    const ang = -Math.PI / 2 + d * lerp(0.55, 0.28, P.hair) + (P.hair ? Math.sin(t * 30 + d) * 0.05 * P.hair : 0);
    const ex = bx + Math.cos(ang) * len, ey = by + Math.sin(ang) * len;
    const cx = bx + Math.cos(ang) * len * 0.5 + d * lerp(14, 2, P.hair) + lerp(10, 0, P.hair), cy = by + Math.sin(ang) * len * 0.5;
    ctx.beginPath(); ctx.moveTo(bx, by + 8); ctx.quadraticCurveTo(cx, cy, ex, ey); ctx.stroke();
  }

  ctx.beginPath(); ctx.ellipse(0, -165, 118, 138, 0, 0, TAU);
  const g = ctx.createRadialGradient(-40, -230, 20, 0, -165, 160);
  g.addColorStop(0, '#FFD07A'); g.addColorStop(1, C.body);
  ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = C.ink; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, -76, 64, 42, 0, 0, TAU); ctx.fillStyle = C.belly; ctx.fill();
  // румянец

  }

    }

    }

    }

    ctx.beginPath(); ctx.arc(px - pr * 0.35, py - pr * 0.4, Math.max(2.5, pr * 0.32), 0, TAU); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.restore();

  }

    ctx.fillStyle = '#7A2236'; ctx.fill(); ctx.save(); ctx.clip();
    ctx.beginPath(); ctx.ellipse(0, my + ry * 1.4, rx * 0.8, ry * 0.5, 0, 0, TAU); ctx.fillStyle = '#FF7B8F'; ctx.fill(); ctx.restore();
    ctx.beginPath(); ctx.ellipse(0, my + ry * 0.6, rx + wob, ry - wob, 0, 0, TAU); ctx.stroke();

    }
  }
  ctx.restore();

  // эффекты вокруг головы — в мировых координатах
  const [hx, hy] = petyaPoint(P, 0, -200);
  if (P.hearts > 0) {
    for (let i = 0; i < 3; i++) {

    for (let i = 0; i < 4; i++) {

    for (let i = 0; i < 3; i++) {
      const ph = frac(t * 0.45 + i / 3);
      ctx.save(); ctx.globalAlpha = Math.sin(ph * Math.PI) * P.zzz;
      text('Z', hx + 90 + ph * 140, hy - 150 - ph * 200, 44 + ph * 50, { sw: 12, fill: '#fff' });

// ---------- фон ----------
const SKY = {
  calm: ['#62C2FF', '#D2F0FF'], warn: ['#FF9A62', '#FFD8BC'], red: ['#F2434A', '#FFAE9A'],
  dark: ['#24173A', '#46305E'], yellow: ['#FFC53D', '#FFF2B8'], end: ['#9C7BFF', '#FFC3E6'],
};
function skyAt(t) {
  const K = [
    [S.meet[0], 'calm'], [L.l5.start, 'calm'], [L.l6.start - 0.1, 'warn'], [L.l6.start + 0.05, 'red'],
    [S.drum[0], 'red'], [S.drum[0] + 0.35, 'dark'], [S.word[0] - 0.001, 'dark'], [S.word[0], 'yellow'],
    [S.parts[0], 'yellow'], [S.parts[0] + 0.7, 'calm'], [S.end[0], 'calm'], [S.end[0] + 0.7, 'end'],
  ];
  if (t <= K[0][0]) return SKY.calm;
  for (let i = 0; i < K.length - 1; i++) {
    const [t0, a] = K[i], [t1, b] = K[i + 1];
    if (t < t1) { const k = t1 > t0 ? (t - t0) / (t1 - t0) : 1; return [mix(SKY[a][0], SKY[b][0], k), mix(SKY[a][1], SKY[b][1], k)]; }
  }
  return SKY.end;
}
function cloud(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.beginPath(); ctx.arc(-50, 10, 40, 0, TAU); ctx.arc(0, -10, 55, 0, TAU); ctx.arc(55, 8, 42, 0, TAU); ctx.rect(-50, 10, 105, 40); ctx.fill();
  ctx.restore();
}
function drawSky(t) {
  const [a, b] = skyAt(t);
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, a); g.addColorStop(1, b);
  ctx.fillStyle = g; ctx.fillRect(-300, -300, W + 600, H + 600);
  const red = inv(L.l5.start, L.l6.start, t) * (1 - inv(S.drum[0], S.drum[0] + 0.3, t));
  const calmish = 1 - inv(S.drum[0], S.drum[0] + 0.3, t) + inv(S.parts[0], S.parts[0] + 0.7, t);
  // солнце
  const sunR = 78 + Math.sin(t * 2) * 3;
  ctx.save(); ctx.globalAlpha = clamp(calmish);
  ctx.translate(880, 330); ctx.rotate(t * 0.3);
  ctx.fillStyle = mix('#FFE45C', '#FF7A3D', red);
  for (let i = 0; i < 12; i++) { ctx.rotate(TAU / 12); ctx.beginPath(); ctx.moveTo(sunR + 12, -10); ctx.lineTo(sunR + 42, 0); ctx.lineTo(sunR + 12, 10); ctx.closePath(); ctx.fill(); }
  ctx.beginPath(); ctx.arc(0, 0, sunR, 0, TAU); ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(42,30,46,0.25)'; ctx.stroke();
  ctx.restore();
  ctx.save(); ctx.globalAlpha = clamp(calmish) * 0.95;
  [[180, 0.9, 12], [620, 0.7, 18], [420, 1.1, 9]].forEach(([y, s, sp], i) => {
    const x = ((i * 470 + t * sp) % 1500) - 200;
    cloud(x, y + (i === 2 ? 260 : 0), s);

  ctx.restore();
}
function drawBurst(t) {
  const a = inv(S.word[0], S.word[0] + 0.05, t) * (1 - inv(S.parts[0], S.parts[0] + 0.6, t));
  if (a <= 0) return;

  ctx.beginPath(); ctx.moveTo(-300, top + 10); ctx.quadraticCurveTo(540, top - 40, 1380, top + 10);
  ctx.lineTo(1380, H + 400); ctx.lineTo(-300, H + 400); ctx.closePath();

// ---------- сцены ----------
function drawHook(t) {
  const g = ctx.createRadialGradient(540, 760, 80, 540, 900, 1300);
  g.addColorStop(0, '#4B2585'); g.addColorStop(1, '#140826');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // на фоне ползёт само страшное слово
  ctx.save(); ctx.translate(540, 900); ctx.rotate(-0.2);
  for (let r = -4; r <= 4; r++) {
    const off = ((t * (70 + 25 * (r & 1)) * (r % 2 ? 1 : -1)) % 2600 + 2600) % 2600;
    ctx.globalAlpha = 0.1;
    setFont(118); ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#C9A8FF';
    ctx.fillText(LONG + ' ' + LONG, -2600 + off - 600, r * 175);
  }
  ctx.restore();
  // заголовок по словам
  const w = L.l1.words, up = i => w[i].w.toUpperCase().replace(/[!?.]/g, '');
  const spec = [[0, 450, 112, '#fff'], [1, 450, 112, '#fff'], [2, 640, 196, C.red], [3, 830, 104, '#fff'], [4, 830, 104, '#fff'], [5, 990, 128, C.yellow]];
  const lineGroups = {};
  spec.forEach(([i, y]) => (lineGroups[y] = lineGroups[y] || []).push(i));
  for (const y in lineGroups) {
    const ids = lineGroups[y], size = spec.find(s => s[0] === ids[0])[2];
    setFont(size);
    const widths = ids.map(i => ctx.measureText(up(i) + (i === 5 ? '!' : '')).width), gap = size * 0.28;
    let x = 540 - (widths.reduce((a, b) => a + b, 0) + gap * (ids.length - 1)) / 2;
    ids.forEach((i, n) => {
      const sp = spec.find(s => s[0] === i), k = pop(t, w[i].s - 0.06, 0.3);
      const sh = i === 2 ? noise1(t * 25) * 6 * k : 0;
      withT(x + widths[n] / 2 + sh, +y + noise1(t * 23 + 4) * (i === 2 ? 5 : 0), (i === 2 ? -0.05 : 0), k,
        () => text(up(i) + (i === 5 ? '!' : ''), 0, 0, sp[2], { fill: sp[3], sw: sp[2] * 0.16 }));
      x += widths[n] + gap;
    });
  }
  const P = petyaState(t);
  drawPetya(P, t, false);

  ctx.beginPath(); ctx.moveTo(-50, 1540); ctx.quadraticCurveTo(540, 1470, 1130, 1540); ctx.lineTo(1130, H + 50); ctx.lineTo(-50, H + 50); ctx.closePath();
  ctx.fillStyle = '#1A0B2E'; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = '#6B3FB0'; ctx.stroke();
}

    ctx.fillStyle = '#fff';
    for (const [x, y, r] of [[30, 200, 22], [10, 245, 14]]) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); stroke(6); }
    const blob = () => { ctx.beginPath(); for (let i = 0; i < 9; i++) { const a = i / 9 * TAU, x = Math.cos(a) * 300, y = Math.sin(a) * 120; ctx.moveTo(x + 80, y); ctx.arc(x, y, 80, 0, TAU); } ctx.moveTo(310, 0); ctx.ellipse(0, 0, 310, 125, 0, 0, TAU); };
    ctx.save(); blob(); ctx.lineWidth = 16; ctx.strokeStyle = C.ink; ctx.stroke(); ctx.fillStyle = '#fff'; ctx.fill(); ctx.restore();
    ctx.save(); ctx.beginPath(); ctx.ellipse(0, 0, 330, 150, 0, 0, TAU); ctx.clip();
    const str = 'ДЛИННЫЕ·ПРЕДЛИННЫЕ·СЛОВА·', step = 90;
    for (let i = 0; i < 40; i++) {
      const x = -400 + i * step - ((t - L.l3.start) * 260) % (step * str.length) + step * str.length * 0;
      const ch = str[i % str.length];
      if (x < -420 || x > 420) continue;
      withT(x, Math.sin(i * 0.8 + t * 6) * 10, Math.sin(i + t * 8) * 0.08, 1, () => tile(ch, 80, C.chunk[i % 4]));
    }
    ctx.restore();
  });
  // короткие слова — любимые
  const bubbles = [[tK, 210, 640, 'КОТ', iconCat], [tD, 540, 500, 'ДОМ', iconHouse], [tSoup, 870, 640, 'СУП', iconSoup]];
  bubbles.forEach(([t0, x, y, word, icon], i) => {
    const k = pop(t, t0 - 0.06, 0.35) * (1 - easeIn(inv(L.l5.start - 0.1 + i * 0.06, L.l5.start + 0.2 + i * 0.06, t)));
    withT(x, y + Math.sin(t * 2.5 + i * 2) * 10, Math.sin(t * 2 + i) * 0.05, k, () => {
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 128, 0, TAU); ctx.fill(); stroke(9);
      withT(0, -32, 0, 0.95, () => icon(t));
      text(word, 0, 72, 64, { fill: C.ink });
    });
  });
  // «!» над головой
  const tEx = findWord('l5', /^подлинн/).s;
  const ke = pop(t, tEx - 0.05, 0.3) * (1 - inv(L.l6.start - 0.15, L.l6.start, t));
  withT(540, 790, Math.sin(t * 20) * 0.08, ke, () => text('!', 0, 0, 170, { fill: C.red, sw: 20 }));
}

function drawFallingShadow(t) {
  const k = inv(L.l5.start + 0.2, L.l6.start, t) * (1 - inv(L.l6.start, L.l6.start + 0.3, t));
  if (k <= 0) return;
  ctx.fillStyle = `rgba(30,10,20,${0.35 * k})`;
  ctx.beginPath(); ctx.ellipse(540, GROUND + 20, 120 + 400 * easeIn(k), 18 + 50 * easeIn(k), 0, 0, TAU); ctx.fill();
}

const PANIC_ROWS = ['ДОСТОПРИМЕ', 'ЧАТЕЛЬНОСТЬ'];
function drawPanicTiles(t) {
  const out = inv(S.drum[0], S.drum[0] + 0.4, t);
  if (t < L.l6.start - 0.4 || out >= 1) return;
  const size = 84, pitch = 90;
  let n = 0;
  PANIC_ROWS.forEach((row, r) => {
    const y0 = 500 + r * 104, x0 = 540 - (row.length * pitch - (pitch - size)) / 2 + size / 2;
    [...row].forEach((ch, i) => {
      const t0 = L.l6.start - 0.32 + n * 0.012, k = inv(t0, t0 + 0.26, t), after = t - (t0 + 0.26);
      let y = lerp(-200 - hash(n) * 300, y0, easeIn(k));
      let sq = after > 0 ? Math.sin(after * 22) * Math.exp(-after * 8) * 0.12 : 0;
      const jit = t > L.l7.start - 0.1 ? noise1(t * 12 + n) * 0.12 : 0;
      const sc = 1 + (t > L.l7.start - 0.1 ? 0.05 * Math.sin(t * 14 + n) : 0);
      withT(x0 + i * pitch, y + sq * 40, (hash(n + 3) - 0.5) * 0.14 + jit, sc * (1 - out),
        () => tile(ch, size, ['#E63946', '#F3722C', '#D62839'][n % 3]), 1 - out);
      n++;
    });
  });
}

function drawDarkness(t) {
  const a = inv(S.drum[0], S.drum[0] + 0.35, t) * (1 - inv(S.word[0] - 0.01, S.word[0], t));
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  // конус света
  ctx.fillStyle = 'rgba(255,248,210,0.13)';
  ctx.beginPath(); ctx.moveTo(470, -300); ctx.lineTo(610, -300); ctx.lineTo(820, GROUND + 40); ctx.lineTo(260, GROUND + 40); ctx.closePath(); ctx.fill();
  const g = ctx.createRadialGradient(540, 1060, 120, 540, 1060, 430);
  g.addColorStop(0, 'rgba(10,4,22,0)'); g.addColorStop(0.55, 'rgba(10,4,22,0.15)'); g.addColorStop(1, 'rgba(10,4,22,0.93)');
  ctx.fillStyle = g; ctx.fillRect(-300, -300, W + 600, H + 600);
  ctx.restore();
  // вопросы
  [[360, 780, 0.25], [540, 700, 0.55], [720, 780, 0.85]].forEach(([x, y, d], i) => {
    const k = pop(t, S.drum[0] + d, 0.3) * (1 - inv(S.word[0] - 0.05, S.word[0], t));
    withT(x, y + Math.sin(t * 4 + i) * 10, Math.sin(t * 3 + i * 2) * 0.15, k, () => text('?', 0, 0, 130, { fill: C.yellow, sw: 18 }));
  });
}

function bigTilePos(i) {
  const cols = 7, size = 112, pitch = 120, r = Math.floor(i / cols), c = i % cols;
  return [540 - (cols * pitch - (pitch - size)) / 2 + size / 2 + c * pitch, 290 + r * pitch, size];
}
function drawBigWord(t) {
  if (t < S.word[0] - 0.01 || t > S.parts[0] + 1.2) return;
  for (let i = 0; i < LONG.length; i++) {
    const [x, y, size] = bigTilePos(i), tp = bigTileT(i);
    const k = pop(t, tp, 0.24);
    const tc = countT(i), glow = t > tc ? Math.exp(-(t - tc) * 7) : 0;
    const fly = easeIn(inv(S.parts[0] + (i % 7) * 0.025 + Math.floor(i / 7) * 0.04, S.parts[0] + 0.5 + (i % 7) * 0.025 + Math.floor(i / 7) * 0.04, t));
    const sh = t < faintT ? noise1(t * 14 + i * 3) * 3 : 0;
    withT(x + sh, y - fly * 1300 + Math.sin(t * 3 + i * 0.5) * 3, (hash(i) - 0.5) * 0.12 * (1 - k * 0.5) + fly * (hash(i + 7) - 0.5) * 2,
      k * (1 + 0.16 * glow), () => tile(LONG[i], size, C.chunk[chunkOf(i)], glow));
  }
  // счётчик букв → штамп
  const away = inv(S.parts[0], S.parts[0] + 0.3, t);
  if (t > countS - 0.05 && t < countE) {
    let n = 0; for (let i = 0; i < LONG.length; i++) if (t >= countT(i)) n = i + 1;
    if (n > 0) withT(540, 530, 0, 1 + 0.15 * Math.exp(-(t - countT(n - 1)) * 10), () => {
      ctx.fillStyle = 'rgba(42,30,46,0.75)'; rr(-150, -105, 300, 210, 50); ctx.fill();
      text(String(n), 0, 6, 150, { fill: '#fff', sw: 18 });
    });
  }
  const ks = easeOut(inv(countE, countE + 0.18, t));
  if (t >= countE && away < 1) {
    withT(540, 540, -0.16, lerp(2.2, 1, ks) * (1 - away), () => {
      ctx.fillStyle = 'rgba(255,255,255,0.92)'; rr(-330, -110, 660, 220, 40); ctx.fill();
      ctx.lineWidth = 16; ctx.strokeStyle = '#E63946'; ctx.stroke();
      text('35 БУКВ!', 0, 8, 128, { fill: '#E63946' });
    }, ks);
  }
}

const PARTS = [
  ['ГИППОПОТО', '= гиппопотам', iconHippo], ['МОНСТРО', '= монстр', iconMonster],
  ['СЕСКВИППЕДАЛИО', '= «длиной в полтора фута»', iconRuler], ['ФОБИЯ', '= страх', iconFear],
];
function drawParts(t) {
  if (t < L.l11.start - 0.2 || t > S.short[0] + 1) return;
  const out = i => easeIn(inv(S.short[0] + i * 0.06, S.short[0] + 0.45 + i * 0.06, t));
  const kt = pop(t, L.l11.start - 0.05);
  withT(540 - out(0) * 1300, 278, -0.03, kt, () => {
    ctx.fillStyle = C.ink; rr(-400, -62, 800, 124, 62); ctx.fill();
    text('НАЗВАНИЕ — ШУТКА!', 0, 4, 64, { fill: C.yellow });
  });
  const times = partTimes();
  PARTS.forEach(([chunk, sub, icon], i) => {
    const k = easeOutBack(inv(times[i] - 0.08, times[i] + 0.3, t));
    if (k <= 0) return;
    const y = 424 + i * 146, slide = (1 - k) * 700;
    withT(540 + slide - out(i + 1) * 1400, y, 0, 1, () => {
      ctx.fillStyle = 'rgba(30,10,40,0.2)'; rr(-446, -59, 900, 130, 34); ctx.fill();
      ctx.fillStyle = '#fff'; rr(-450, -65, 900, 130, 34); ctx.fill(); stroke(7);
      ctx.fillStyle = C.chunk[i]; ctx.beginPath(); ctx.arc(-372, 0, 52, 0, TAU); ctx.globalAlpha *= 0.25; ctx.fill(); ctx.globalAlpha /= 0.25;
      withT(-372, 6, 0, 0.78, () => icon(t));
      text(chunk, -296, -18, 58, { fill: C.chunk[i], sw: 11, align: 'left', maxW: 700 });
      text(sub, -296, 36, 34, { fill: C.ink, weight: 700, align: 'left', maxW: 700 });
    }, Math.min(1, k * 2));
  });
}

function drawShort(t) {
  if (t < L.l15.start - 0.2 || t > L.l16.start) return;
  const out = easeIn(inv(L.l16.start - 0.45, L.l16.start - 0.1, t));
  const kt = pop(t, L.l15.start - 0.05) * (1 - out);
  withT(540, 300 - out * 500, 0.03, kt, () => {
    ctx.fillStyle = C.ink; rr(-370, -58, 740, 116, 58); ctx.fill();
    text('ВАРИАНТ ПОКОРОЧЕ', 0, 4, 58, { fill: '#7CF0D9' });
  });
  const rows = ['СЕСКВИПЕ', 'ДАЛОФОБИЯ'], size = 100, pitch = 108;
  let n = 0;
  rows.forEach((row, r) => {
    const x0 = 540 - (row.length * pitch - (pitch - size)) / 2 + size / 2;
    [...row].forEach((ch, i) => {
      const k = pop(t, shortT + n * 0.035, 0.26) * (1 - out);
      withT(x0 + i * pitch, 470 + r * 116 + Math.sin(t * 3 + n) * 3 - out * (700 + 60 * n), (hash(n + 40) - 0.5) * 0.1, k, () => tile(ch, size, n < 12 ? C.chunk[2] : C.chunk[3]));
      n++;
    });
  });
  const kp = pop(t, shortPillT(), 0.35) * (1 - out);
  withT(540, 742 - out * 900, -0.04, kp, () => {
    ctx.fillStyle = '#fff'; rr(-260, -54, 520, 108, 54); ctx.fill(); stroke(7);
    text('ВСЕГО 17 БУКВ', 0, 4, 54, { fill: C.ink });
  });
}

function drawEnd(t) {
  if (t < S.end[0]) return;
  // конфетти
  for (let i = 0; i < 70; i++) {
    const st = S.end[0] + 0.2 + hash(i + 50) * 1.2, sp = 260 + hash(i + 90) * 260;
    if (t < st) continue;
    const y = ((t - st) * sp) % 2200 - 120, x = hash(i) * W + Math.sin(t * 2 + i) * 30;
    ctx.save(); ctx.translate(x, y); ctx.rotate(t * (2 + hash(i + 7) * 4) + i); ctx.scale(1, Math.sin(t * 6 + i));
    ctx.fillStyle = ['#FF4D6D', '#FFE14D', '#22B8A7', '#8E6CDF', '#FF9F1C', '#FFFFFF'][i % 6];
    ctx.fillRect(-11, -6, 22, 12); ctx.restore();
  }
  const kp = pop(t, findWord('l17', /^фобия/).s - 0.08, 0.4);
  withT(540, 330, -0.04 + Math.sin(t * 2.2) * 0.02, kp, () => {
    ctx.fillStyle = 'rgba(30,10,40,0.25)'; rr(-414, -80, 840, 170, 85); ctx.fill();
    ctx.fillStyle = C.red; rr(-420, -86, 840, 170, 85); ctx.fill(); stroke(9);
    text('ФОБИЯ №1 ИЗ 100', 0, 2, 82, { fill: '#fff', sw: 14 });
  });
  const tq = findWord('l17', /^какую/).s;
  [[-290, 0.0, 0.1], [0, 0.12, -0.06], [290, 0.24, 0.08]].forEach(([dx, d, rot], i) => {
    const k = pop(t, tq - 0.05 + d, 0.35);
    withT(540 + dx, 560 + Math.sin(t * 3 + i) * 10, rot + Math.sin(t * 2 + i) * 0.04, k, () => {
      ctx.fillStyle = '#fff'; rr(-105, -120, 210, 240, 30); ctx.fill(); stroke(8);
      ctx.fillStyle = C.chunk[i]; rr(-80, -95, 160, 190, 20); ctx.fill();
      text('?', 0, 6, 140, { fill: '#fff', sw: 16 });
    });
  });
  const tc = findWord('l17', /^пиши/).s;
  const kc = pop(t, tc - 0.05, 0.35), bob = Math.abs(Math.sin((t - tc) * 6)) * 18;
  withT(540, 790 - bob * 0.3, 0, kc, () => {
    ctx.beginPath(); ctx.moveTo(-200, 40); ctx.lineTo(-235, 100); ctx.lineTo(-140, 50); ctx.closePath(); ctx.fillStyle = '#fff'; ctx.fill(); stroke(7);
    ctx.fillStyle = '#fff'; rr(-330, -58, 660, 116, 58); ctx.fill(); stroke(7);
    ctx.fillRect(-215, 40, 85, 20);
    text('ПИШИ В КОММЕНТЫ', -36, 4, 50, { fill: C.ink, maxW: 500 });
    withT(262, 4 + Math.sin(t * 9) * 8, 0, 1, () => {
      ctx.beginPath(); ctx.moveTo(-13, -34); ctx.lineTo(13, -34); ctx.lineTo(13, 0); ctx.lineTo(30, 0); ctx.lineTo(0, 34); ctx.lineTo(-30, 0); ctx.lineTo(-13, 0); ctx.closePath();
      ctx.fillStyle = C.red; ctx.fill(); stroke(6);
    });
  });
}

function drawBadge(t) {
  const k = pop(t, S.meet[0] + 0.4, 0.4) * (1 - inv(S.end[0], S.end[0] + 0.25, t));
  withT(540, 172, 0, k, () => {
    setFont(40); const w = ctx.measureText('100 ФОБИЙ · №1').width + 70;
    ctx.fillStyle = 'rgba(25,12,45,0.72)'; rr(-w / 2, -36, w, 72, 36); ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.stroke();
    text('100 ФОБИЙ · №1', 0, 2, 40, { fill: '#fff' });
  });
}

function cameraFor(t, P) {
  const z = easeInOut(inv(L.l16.start - 0.2, L.l16.start + 0.5, t)) * (1 - easeInOut(inv(S.end[0] - 0.05, S.end[0] + 0.3, t)));
  if (z <= 0) return null;
  const [hx, hy] = petyaPoint(P, 0, -150);
  return { z: lerp(1, 1.65, z), hx, hy, tx: lerp(hx, 540, z), ty: lerp(hy, 980, z) };
}

function drawWorld(t) {
  const P = petyaState(t);
  const [sx, sy] = shakeAt(t);
  ctx.save();
  ctx.translate(sx, sy);
  const cam = cameraFor(t, P);
  if (cam) { ctx.translate(cam.tx, cam.ty); ctx.scale(cam.z, cam.z); ctx.translate(-cam.hx, -cam.hy); }
  drawSky(t);
  drawBurst(t);
  drawGround(t);
  drawFallingShadow(t);
  drawMeetProps(t);
  drawPetya(P, t);
  drawPanicTiles(t);
  drawDarkness(t);
  drawBigWord(t);
  drawParts(t);
  drawShort(t);
  drawEnd(t);
  ctx.restore();
  // вспышка
  const f = 1 - inv(S.word[0], S.word[0] + 0.4, t);
  if (t >= S.word[0] && f > 0) { ctx.fillStyle = `rgba(255,255,255,${f})`; ctx.fillRect(0, 0, W, H); }
}

function renderFrame(t) {
  T = t;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.clearRect(0, 0, W, H);
  const m0 = S.meet[0], k = inv(m0, m0 + 0.45, t);
  if (t < m0) drawHook(t);
  else if (k < 1) {
    drawHook(t);
    ctx.save(); ctx.beginPath(); ctx.arc(540, 1470, easeInOut(k) * 2300 + 1, 0, TAU); ctx.clip(); drawWorld(t); ctx.restore();
    ctx.beginPath(); ctx.arc(540, 1470, easeInOut(k) * 2300 + 1, 0, TAU); ctx.lineWidth = 24; ctx.strokeStyle = '#fff'; ctx.stroke();
  } else drawWorld(t);
  drawBadge(t);
  drawCaptions(t);
}

async function ready() {
  await Promise.all(['900 40px RubikC', '900 40px RubikL', '700 40px RubikC', '700 40px RubikL'].map(f => document.fonts.load(f)));
  return document.fonts.check('900 40px RubikC');
}
window.setup = setup; window.renderFrame = renderFrame; window.ready = ready;

// предпросмотр в обычном браузере: ?preview
if (location.search.includes('preview')) {
  fetch('build/timeline.json').then(r => r.json()).then(async tl => {
    await ready(); setup(tl);
    const t0 = performance.now();
    const loop = () => { renderFrame(((performance.now() - t0) / 1000) % tl.total); requestAnimationFrame(loop); };
    loop();
  });
}
</script>
</body>
