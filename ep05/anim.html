<!doctype html>
<html lang="ru">
<head>

<title>Фобия №5 — анимация</title>
<style>
  @font-face { font-family: 'BalsC'; font-weight: 700; src: url('node_modules/@fontsource/balsamiq-sans/files/balsamiq-sans-cyrillic-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'BalsL'; font-weight: 700; src: url('node_modules/@fontsource/balsamiq-sans/files/balsamiq-sans-latin-700-normal.woff2') format('woff2'); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
'use strict';
// Мультик «Фобия №5 из 100: страх темноты» в стиле рисованных объяснялок: человечки с большой белой головой,
// толстый чёрный контур, плоский однотонный фон, крупное слово-заголовок, резкие склейки каждые 2–3 с,
// предметы «выпрыгивают» и покачиваются, герои дышат и моргают, камера живёт.
// Всё рисуется детерминированно от времени t: renderFrame(t) → кадр.
const W = 1080, H = 1920, TAU = Math.PI * 2, GROUND = 1430;
const FONT = 'BalsC, BalsL, sans-serif';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const C = {
  ink: '#111111', white: '#FFFFFF', red: '#E53935', green: '#43A047', blue: '#1E88E5', yellow: '#FDD835',
  money: '#81C784', alert: '#E57373', purple: '#8E6CDF', orange: '#FB8C00', brown: '#8D5A3B',
};
const BG = {
  blue: '#A7D8F0', beige: '#F5E6C4', grey: '#D3D3D3', mint: '#C3E8C9', pink: '#F6C9C9', lav: '#D9D0F2',
  yellow: '#FFE9A8', night: '#2F3A5C', red: '#F0A8A8',
};
const DARK = new Set([BG.night, '#141826']);
const LOOK = {
  senya: { shirt: '#FB8C00', hair: 'cap', cap: '#1E88E5', pants: '#3F5A8A', print: 'pocket' },
  nyuta: { shirt: '#9575CD', hair: 'bob', pants: '#B39DDB', print: 'dots' },
  borya: { shirt: '#29B6F6', hair: 'spiky', pants: '#0288D1', print: 'stripes' },
  cave: { shirt: '#C68A4A', hair: 'shaggy', fur: true, pants: '#8D5A3B' },
  actor: { shirt: '#8E6CDF', hair: 'curl', pants: '#5E35B1' },
  guy: { shirt: '#90A4AE', hair: 'none', pants: '#546E7A', print: 'star' },
};

// ---------- утилиты ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOutBack = (k, s = 2.2) => k <= 0 ? 0 : 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2);
const pop = (t, t0, d = 0.3) => easeOutBack(inv(t0, t0 + d, t));
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const frac = x => x - Math.floor(x);

// ---------- дрожащие линии (boil) ----------
// каждый вызов фигуры получает свой номер NID; шум зависит от номера, точки и «кадра рисовки» STEP (8 раз в секунду)
let NID = 0, STEP = 0;
const BOIL = 0;   // 0 — ровные чистые линии (дрожание выключено)
const jn = i => (hash(NID * 17.13 + i * 3.71 + STEP * 101.9) - 0.5) * 2;
function pxScale() { const m = ctx.getTransform(); return Math.hypot(m.a, m.b) || 1; }
function wob(pts, amp = 2.4) {
  NID++; if (!BOIL) return pts; const s = pxScale(), a = amp / s;
  return pts.map((p, i) => [p[0] + jn(i * 2) * a, p[1] + jn(i * 2 + 1) * a]);
}
function smoothPath(q, closed) {
  ctx.beginPath();
  if (!closed) {
    ctx.moveTo(q[0][0], q[0][1]);
    for (let i = 1; i < q.length - 1; i++) { const mx = (q[i][0] + q[i + 1][0]) / 2, my = (q[i][1] + q[i + 1][1]) / 2; ctx.quadraticCurveTo(q[i][0], q[i][1], mx, my); }
    ctx.lineTo(q[q.length - 1][0], q[q.length - 1][1]);
    return;
  }
  const n = q.length, m = i => [(q[i % n][0] + q[(i + 1) % n][0]) / 2, (q[i % n][1] + q[(i + 1) % n][1]) / 2];
  ctx.moveTo(...m(0));
  for (let i = 1; i <= n; i++) { const p = q[i % n], mm = m(i); ctx.quadraticCurveTo(p[0], p[1], mm[0], mm[1]); }
  ctx.closePath();
}
function inkW(lw = 7) { ctx.lineWidth = lw / pxScale(); ctx.strokeStyle = C.ink; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; }
// закрашенная фигура с контуром
function shadeOf(c) {
  if (typeof c !== 'string' || c[0] !== '#' || c.length !== 7) return null;
  if (c.toUpperCase() === '#FFFFFF') return '#DDE2EA';
  if (c === C.ink || c === '#111' || c === '#222') return null;
  const n = parseInt(c.slice(1), 16), k = 0.8;
  return `rgb(${Math.round((n >> 16 & 255) * k)},${Math.round((n >> 8 & 255) * k)},${Math.round((n & 255) * k)})`;
}
// заливка с мягкой тенью снизу-справа и бликом сверху-слева
function celFill(path, fill) {
  ctx.fillStyle = fill; path(); ctx.fill();
  const sh = shadeOf(fill); if (!sh) return;
  const s = pxScale(), d = 14 / s;
  ctx.save(); path(); ctx.clip();
  ctx.fillStyle = sh; ctx.fillRect(-5000, -5000, 10000, 10000);
  ctx.translate(-d, -d * 1.1); ctx.fillStyle = fill; path(); ctx.fill();
  ctx.restore();
}
function shape(pts, fill, lw = 7, closed = true, amp = 2.4) {
  const q = wob(pts, amp);
  if (fill) celFill(() => smoothPath(q, closed), fill); else smoothPath(q, closed);
  smoothPath(q, closed);
  if (lw) { inkW(lw); ctx.stroke(); }
}
function polyPts(pts, per = 3) {   // ломаная с промежуточными точками: острые углы, но дрожат и стороны
  const out = [];
  for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; for (let k = 0; k < per; k++) out.push([lerp(a[0], b[0], k / per), lerp(a[1], b[1], k / per)]); }
  return out;
}
function poly(pts, fill, lw = 7) {   // многоугольник с острыми углами
  const q = wob(polyPts(pts), 2.2);
  const path = () => { ctx.beginPath(); q.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); };
  if (fill) celFill(path, fill);
  path();
  if (lw) { inkW(lw); ctx.stroke(); }
}
function ellPts(x, y, rx, ry, n = 28, a0 = 0, a1 = TAU) {
  const p = []; const full = Math.abs(a1 - a0 - TAU) < 1e-6;
  for (let i = 0; i < (full ? n : n + 1); i++) { const a = a0 + (a1 - a0) * i / n; p.push([x + Math.cos(a) * rx, y + Math.sin(a) * ry]); }
  return p;
}
const circ = (x, y, r, fill, lw = 7) => shape(ellPts(x, y, r, r), fill, lw);
const ell = (x, y, rx, ry, fill, lw = 7) => shape(ellPts(x, y, rx, ry), fill, lw);
function rrPts(x, y, w, h, r) {
  const p = [], c = [[x + w - r, y + r, -Math.PI / 2], [x + w - r, y + h - r, 0], [x + r, y + h - r, Math.PI / 2], [x + r, y + r, Math.PI]];
  for (const [cx, cy, a0] of c) for (let i = 0; i <= 3; i++) { const a = a0 + i / 3 * Math.PI / 2; p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  return p;
}
const box = (x, y, w, h, r, fill, lw = 7) => shape(rrPts(x, y, w, h, r), fill, lw);
function line(pts, lw = 7, color = C.ink, amp = 2) {
  const q = wob(pts.length === 2 ? [pts[0], [lerp(pts[0][0], pts[1][0], 0.5), lerp(pts[0][1], pts[1][1], 0.5)], pts[1]] : pts, amp);
  smoothPath(q, false); ctx.lineWidth = lw / pxScale(); ctx.strokeStyle = color; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
}
function dot(x, y, r, c = C.ink, hl = false) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = c; ctx.fill(); if (hl) { ctx.beginPath(); ctx.arc(x - r * 0.35, y - r * 0.38, r * 0.32, 0, TAU); ctx.fillStyle = '#fff'; ctx.fill(); } }

function setFont(size, weight = 700) { ctx.font = `${weight} ${size}px ${FONT}`; }
function text(str, x, y, size, o = {}) {
  const { fill = C.ink, align = 'center', maxW = 0, stroke = 0, strokeC = '#fff' } = o;
  setFont(size);
  if (maxW) { const w = ctx.measureText(str).width; if (w > maxW) { size *= maxW / w; setFont(size); } }
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  NID++;
  const jx = 0, jy = 0;
  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = stroke; ctx.strokeStyle = strokeC; ctx.strokeText(str, x + jx, y + jy); }
  ctx.fillStyle = fill; ctx.fillText(str, x + jx, y + jy);
}
function withT(x, y, rot, sc, fn, alpha = 1) {
  if (sc <= 0.001 || alpha <= 0.001) return;
  ctx.save(); ctx.globalAlpha *= clamp(alpha); ctx.translate(x, y); if (rot) ctx.rotate(rot); if (sc !== 1) ctx.scale(sc, sc); fn(); ctx.restore();
}
// элемент «выпрыгивает» в момент t0
function P(t, t0, x, y, fn, s = 1, rot = 0) {
  const d = t - t0; if (d < 0) return;
  const wig = Math.exp(-d * 7) * Math.sin(d * 26) * 0.12;   // покачивание после «выпрыгивания»
  const fl = Math.sin(t * 2.2 + x * 0.013) * 5 * inv(0.25, 0.6, d);   // лёгкое парение
  const sq = 1 + Math.exp(-d * 9) * Math.sin(d * 30) * 0.06;
  withT(x, y + fl, rot + wig, pop(t, t0) * s, () => { ctx.scale(1 / sq, sq); fn(); });
}
// элемент «въезжает» сбоку
function slideIn(t, t0, x, y, fn, from = 1, s = 1) { const k = easeOut(inv(t0, t0 + 0.25, t)); if (k > 0) withT(x + (1 - k) * 900 * from, y, 0, s, fn); }

function heart(s = 1, fill = C.red) { withT(0, 0, 0, s, () => { shape([[0, 70], [-90, -10], [-100, -60], [-70, -95], [-30, -95], [0, -60], [30, -95], [70, -95], [100, -60], [90, -10]], fill, 8); line(ellPts(-50, -50, 26, 22, 6, Math.PI * 1.1, Math.PI * 1.6), 7, 'rgba(255,255,255,0.7)'); }); }
function sun(t, r = 120) {
  for (let i = 0; i < 12; i++) { const a = i / 12 * TAU + t * 0.6; line([[Math.cos(a) * (r + 20), Math.sin(a) * (r + 20)], [Math.cos(a) * (r + 60), Math.sin(a) * (r + 60)]], 12, C.orange); }
  circ(0, 0, r, '#FFCA28', 8); for (const d of [-1, 1]) dot(d * 36, -14, 11, C.ink, true); line(ellPts(0, 18, 34, 24, 8, 0.35, Math.PI - 0.35), 7);
}
function magnifier() { line([[60, 60], [140, 140]], 26); circ(0, 0, 85, 'rgba(200,230,255,0.6)', 10); line(ellPts(-20, -20, 45, 45, 8, Math.PI * 1.05, Math.PI * 1.45), 8, '#fff'); }
function seat(fill = '#C62828') { box(-120, -260, 240, 200, 30, fill, 7); box(-130, -110, 260, 70, 20, fill, 7); line([[-90, -40], [-90, 0]], 14); line([[90, -40], [90, 0]], 14); }
function sparks(t, n = 8, R = 160) { for (let i = 0; i < n; i++) { const a = i / n * TAU + 0.3, k = 0.6 + 0.4 * Math.abs(Math.sin(t * 9 + i)); line([[Math.cos(a) * R * 0.6, Math.sin(a) * R * 0.6], [Math.cos(a) * R * k, Math.sin(a) * R * k]], 9, C.yellow); } }

// ---------- человечек ----------
// o: x, y (ноги), s, look, armL/armR — поза руки, leg, mouth, eyes, lookX, sweat, flip, blush
const ARM = {   // [угол плеча, сгиб локтя] для правой руки; левая — зеркально
  down: [1.25, 0.15], up: [-1.15, -0.25], point: [-0.12, 0.05], hips: [0.95, 2.3], shrug: [0.35, -1.7],
  hold: [0.75, -1.25], cheer: [-0.9, -0.5], face: [0.6, -2.5], out: [0.25, 0.2], cover: [0.5, -2.75],
};
// толстая конечность: чёрный контур + цветная заливка
function limb(pts, fill, w = 26) { line(pts, w + 12, C.ink); line(pts, w, fill); }
function arm(d, pose, t, wave, F) {
  let [a, b] = ARM[pose] || ARM.down;
  if (wave) b = -0.6 + Math.sin(t * 12) * 0.55, a = -1.0;
  else { a += Math.sin(t * 2.1 + d + F.seed) * 0.05; b += Math.sin(t * 2.7 + d * 2 + F.seed) * 0.06; }
  const sx = d * 56, sy = -312;
  const ex = sx + d * Math.cos(a) * 80, ey = sy + Math.sin(a) * 80;
  const hx = ex + d * Math.cos(a + b) * 74, hy = ey + Math.sin(a + b) * 74;
  limb([[sx, sy], [ex, ey], [hx, hy]], '#fff', 18);
  // рукав футболки
  const kx = lerp(sx, ex, 0.42), ky = lerp(sy, ey, 0.42);
  limb([[sx - d * 4, sy - 4], [kx, ky]], F.look.shirt, 34);
  circ(hx, hy, 19, '#fff', 6);
  // большой палец
  line([[hx - d * 4, hy - 14], [hx + d * 6, hy - 22]], 6);
  return [hx, hy];
}
function fig(t, o) {
  const F = Object.assign({ x: 540, y: GROUND, s: 1.1, look: LOOK.guy, armL: 'down', armR: 'down', leg: 'stand', mouth: 'smile', eyes: 'dot', lookX: 0, lookY: 0, flip: 1, rot: 0 }, o);
  F.seed = (F.look.shirt.charCodeAt(2) * 7 + F.look.shirt.charCodeAt(4) * 3) % 17;
  const hands = {};
  const pants = F.look.pants || '#455A64';
  if (!F.noShadow) { ctx.fillStyle = 'rgba(0,0,0,0.14)'; ctx.beginPath(); ctx.ellipse(F.x, F.y + 6, 120 * F.s, 18 * F.s, 0, 0, TAU); ctx.fill(); }
  const moving = F.leg === 'walk' || F.leg === 'run';
  const breath = Math.sin(t * 2.6 + F.seed) * 5 + (moving ? -Math.abs(Math.sin(t * (F.leg === 'run' ? 20 : 12))) * 10 : 0);
  withT(F.x, F.y, F.rot, F.s, () => {
    ctx.scale(F.flip, 1);
    // ноги в штанах и ботинки
    [-1, 1].forEach(d => {
      if (F.leg === 'sit') { limb([[d * 35, -160], [d * 35 + 110, -150], [d * 35 + 110, -24]], pants, 26); shoe(d * 35 + 128, -14, 1); return; }
      const ph = F.leg === 'walk' ? Math.sin(t * 12 + (d > 0 ? Math.PI : 0)) : F.leg === 'run' ? Math.sin(t * 20 + (d > 0 ? Math.PI : 0)) * 1.6 : 0;
      let fx = d * 45 + ph * 40, fy = -Math.max(0, ph) * 25, kx = (d * 35 + fx) / 2 + d * 8, ky = -80 + fy / 2;
      if (F.leg === 'jump') { kx = d * 90; ky = -95; fx = d * 60; fy = -25; }
      limb([[d * 35, -165], [kx, ky], [fx, fy - 14]], pants, 26);
      shoe(fx + d * 14, fy - 6, d > 0 ? 1 : -1);
    });
    ctx.translate(0, breath);
    // туловище-футболка
    const torso = polyPts([[-64, -338], [64, -338], [76, -150], [-76, -150]], 2);
    shape(torso, F.look.shirt, 7);
    ctx.save(); smoothPath(torso, true); ctx.clip();
    const sd = shadeOf(F.look.shirt) || '#000';
    if (F.look.print === 'stripes') for (let y = -310; y < -150; y += 34) line([[-90, y], [90, y]], 9, 'rgba(255,255,255,0.55)');
    if (F.look.print === 'dots') for (let i = 0; i < 9; i++) dot(-44 + (i % 3) * 44 + (Math.floor(i / 3) % 2) * 20, -290 + Math.floor(i / 3) * 48, 8, 'rgba(255,255,255,0.6)');
    if (F.look.print === 'star') { ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.beginPath(); for (let i = 0; i < 10; i++) { const r = i % 2 ? 13 : 30, a = -Math.PI / 2 + i * Math.PI / 5; ctx.lineTo(Math.cos(a) * r, -250 + Math.sin(a) * r); } ctx.fill(); }
    ctx.fillStyle = sd; ctx.fillRect(-90, -176, 180, 30);   // подол
    ctx.restore();
    line([[-76, -176], [76, -176]], 5);
    if (F.look.print === 'pocket') { box(14, -290, 38, 40, 6, shadeOf(F.look.shirt), 5); }
    // воротник
    line(ellPts(0, -340, 30, 22, 8, 0.15, Math.PI - 0.15), 6);
    if (F.look.fur) { poly([[-76, -230], [76, -300], [76, -150], [-76, -150]], '#E0A64F', 6); dot(-20, -190, 8, '#7A4A1E'); dot(30, -220, 7, '#7A4A1E'); }
    hands.R = arm(1, F.armR, t, F.wave, F);
    hands.L = arm(-1, F.armL, t, false, F);
    hands.R[1] += breath; hands.L[1] += breath;
    // голова: лёгкий наклон и покачивание
    ctx.translate(0, breath * 0.5);
    const tilt = Math.sin(t * 1.7 + F.seed) * 0.04 + (moving ? Math.sin(t * 12) * 0.03 : 0);
    ctx.translate(0, -345); ctx.rotate(tilt); ctx.translate(0, 345);
    const hx = 0, hy = -448;
    if (F.look.hair === 'bob') shape([[-112, -410], ...ellPts(0, -455, 118, 118, 14, Math.PI, TAU).slice(1, -1), [112, -410], [96, -360], [-96, -360]], '#4A3328', 7);
    // уши
    for (const d of [-1, 1]) ell(d * 104, -440, 18, 26, '#fff', 6);
    circ(hx, hy, 105, '#fff', 8);
    hair(F, t);
    // лицо
    const ex = F.lookX * 12, ey = F.lookY * 10;
    const blink = frac((t + F.seed * 0.37) / 3.1) < 0.045;
    for (const d of [-1, 1]) {
      const x = d * 36 + ex, y = -455 + ey;
      if (F.eyes === 'big') { circ(x, y, 25, '#fff', 6); if (blink) line([[x - 18, y], [x + 18, y]], 6); else dot(x + F.lookX * 6, y + 2, 11, C.ink, true); }
      else if (F.eyes === 'happy') line([[x - 16, y + 6], [x, y - 8], [x + 16, y + 6]], 7);
      else if (F.eyes === 'closed' || (blink && F.eyes !== 'angry')) line([[x - 16, y], [x + 16, y]], 7);
      else if (F.eyes === 'angry') { dot(x, y, 10); line([[x - 20 * d * -1, y - 30], [x + 18 * d * -1, y - 18]], 7); }
      else if (F.eyes === 'worry') dot(x, y, 12, C.ink, true);
      else dot(x, y, 12, C.ink, true);
      // брови
      const by = y - 34 - (F.eyes === 'big' ? 14 : 0) - (F.mouth === 'scream' || F.mouth === 'o' ? 8 : 0);
      if (F.eyes === 'worry') line([[d * 18 + ex, by + 4], [d * 54 + ex, by + 14]], 7);
      else if (F.eyes !== 'angry' && F.look.hair !== 'cap' && F.look.hair !== 'bob' && F.look.hair !== 'spiky' && F.look.hair !== 'shaggy') line(ellPts(x, by + 12, 16, 8, 6, Math.PI * 1.15, Math.PI * 1.85), 6);
      else if (F.eyes !== 'angry') line(ellPts(x, by + 12, 15, 7, 6, Math.PI * 1.15, Math.PI * 1.85), 6);
    }
    // румянец всегда, сильнее при смущении
    for (const d of [-1, 1]) { ctx.fillStyle = F.blush ? 'rgba(240,110,120,0.5)' : 'rgba(240,120,130,0.22)'; ctx.beginPath(); ctx.ellipse(d * 66 + ex * 0.5, -418, 18, 10, 0, 0, TAU); ctx.fill(); }
    // нос
    line([[ex + 4, -432 + ey], [ex + 10, -422 + ey], [ex + 2, -418 + ey]], 5);
    const my = -398 + ey;
    const talk = 0.75 + 0.25 * Math.sin(t * 17 + F.seed);
    if (F.mouth === 'smile') { line(ellPts(ex, my - 22, 30, 24, 8, 0.35, Math.PI - 0.35), 7); }
    else if (F.mouth === 'open') { const h = 32 * talk; shape([[ex - 36, my - 8], [ex + 36, my - 8], ...ellPts(ex, my - 8, 36, h, 10, 0, Math.PI).slice(1)], '#5A1A1A', 6); ell(ex, my - 8 + h * 0.65, 16, h * 0.25, '#E57373', 0); }
    else if (F.mouth === 'o') ell(ex, my, 16, 22 * talk, '#5A1A1A', 6);
    else if (F.mouth === 'scream') { ell(ex, my + 8, 26, 38 + Math.sin(t * 40) * 3, '#5A1A1A', 6); ell(ex, my + 30, 14, 8, '#E57373', 0); }
    else if (F.mouth === 'frown') line(ellPts(ex, my + 14, 28, 20, 8, Math.PI + 0.4, TAU - 0.4), 7);

function setup(tl) {
  TL = tl; L = {}; tl.lines.forEach(l => L[l.id] = l);
  SHOTS = buildShots();
  for (let i = 1; i < SHOTS.length; i++) if (SHOTS[i].t <= SHOTS[i - 1].t + 0.6) throw new Error(`кадр ${i} (${SHOTS[i].label}) слишком короткий`);
  buildCaptions(); buildCues();
  return { cues: CUES, shots: SHOTS.map(s => [s.t.toFixed(2), s.label]) };
}


let CUR_BG = null;
// ---------- субтитры: чёрный рукописный шрифт, текущее слово красным ----------
const CAP_SIZE = 70, CAP_MAXW = 920, CAP_Y = 1650;
function buildCaptions() {
  PAGES = []; setFont(CAP_SIZE);
  for (const l of TL.lines) {
    if (l.hide_caption) continue;
    let cur = [];
    const flush = () => { if (cur.length) PAGES.push({ words: cur }); cur = []; };
    for (const w of l.words) {
      const width = ctx.measureText([...cur, w].map(x => x.w.toUpperCase()).join('  ')).width;
      if (cur.length && (width > CAP_MAXW || cur.length >= 3)) flush();
      cur.push(w);
      if (/[.!?…:]»?$/.test(w.w)) flush();
    }
    flush();
  }
  PAGES.forEach(p => p.s = p.words[0].s - 0.06);
  PAGES.forEach((p, i) => { const last = p.words[p.words.length - 1].e, next = PAGES[i + 1]; p.e = next ? Math.min(next.s, last + 0.55) : last + 0.8; });
}
function drawCaptions(t) {
  const p = PAGES.find(p => t >= p.s && t < p.e);
  if (!p) return;
  setFont(CAP_SIZE);
  const dark = DARK.has(CUR_BG);
  const words = p.words.map(w => w.w.toUpperCase()), space = CAP_SIZE * 0.32;
  let cur = -1; p.words.forEach((w, i) => { if (t >= w.s - 0.03) cur = i; });
  const widths = words.map(w => ctx.measureText(w).width);
  const total = widths.reduce((a, b) => a + b, 0) + space * (words.length - 1), fit = Math.min(1, CAP_MAXW / total);
  withT(540, CAP_Y, 0, fit, () => {
    let x = -total / 2;
    words.forEach((w, i) => { text(w, x + widths[i] / 2, 0, CAP_SIZE, dark ? { fill: i === cur ? C.yellow : '#fff', stroke: 14, strokeC: C.ink } : { fill: i === cur ? C.red : C.ink, stroke: 14, strokeC: '#fff' }); x += widths[i] + space; });
  });
}
// заголовок кадра: крупно, чёрным, капсом
function drawLabel(sh, t) {
  if (!sh.label) return;
  const dark = DARK.has(sh.bg), d = t - sh.t;

  setFont(110); let size = 110; const fullW = ctx.measureText(sh.label).width; if (fullW > 980) size *= 980 / fullW; setFont(size);
  const words = sh.label.split(' '), sp = ctx.measureText(' ').width, ws_ = words.map(w => ctx.measureText(w).width);
  const total = ws_.reduce((a, b) => a + b, 0) + sp * (words.length - 1);

  if (u > 0) { ctx.save(); ctx.globalAlpha = dark ? 0.35 : 0.55; ctx.fillStyle = dark ? '#7986CB' : C.yellow; ctx.beginPath(); ctx.roundRect(540 - total / 2 - 20, 300 + size * 0.05, (total + 40) * u, size * 0.42, 14); ctx.fill(); ctx.restore(); }
  let x = 540 - total / 2;

    const k = pop(t, sh.t + n * 0.07, 0.28), cx = x + ws_[n] / 2;
    const wig = Math.exp(-Math.max(0, d - n * 0.07) * 8) * Math.sin((d - n * 0.07) * 24) * 0.08;

}

// ---------- звук: метки для audio.py ----------
function buildCues() {
  CUES = [];
  const cue = (t, type, o = {}) => CUES.push({ t: +Math.max(0, t).toFixed(3), type, ...o });
  const music = (t, gain, fade = 0.4) => cue(t, 'music', { gain, fade });
  music(0, 0.4, 0.2); music(A('h1', /^давай/), 0.9, 0.3);
  music(A('b1', /^свет/), 0.25, 0.3); music(LS('b3'), 0.9, 0.4);
  music(LS('b4'), 0.4, 0.3); music(LS('b5'), 0.9, 0.4);
  music(TL.total - 1.5, 0, 1.4);
  cue(0.05, 'switch', { gain: 0.6 }); cue(0.6, 'riser', { dur: 1.0, gain: 0.4 });
  cue(A('h1', /^давай/) + 0.1, 'ding', { gain: 0.5 });
  cue(A('b1', /^нюта/) + 0.1, 'sparkle', { gain: 0.4 });
  cue(ws('b1', /^выключ/) - 0.1, 'switch', { gain: 0.7 });
  cue(LS('b2'), 'impact', { gain: 0.4 }); cue(LS('b2'), 'riser', { dur: 1.2, gain: 0.5 });
  cue(LS('b4'), 'crackle', { dur: L.b5.start - L.b4.start, gain: 0.6 });
  cue(ws('b4', /^хищник/) - 0.1, 'thud', { gain: 0.5 });
  cue(A('b4', /^кто/) + 0.1, 'tada', { gain: 0.4 });
  cue(A('b5', /^монстр/), 'stamp', { gain: 0.6 });
  cue(LS('b5b') + 0.2, 'panic', { gain: 0.3 });
  cue(A('b5b', /^просто/) + 0.2, 'boing', { gain: 0.4 });
  cue(LS('b6'), 'switch', { gain: 0.8 }); cue(LS('b6') + 0.1, 'ding', { gain: 0.5 });
  cue(A('b6', /^подружи/) + 0.1, 'sparkle', { gain: 0.6 });
  cue(LS('e1') + 0.1, 'tada', { gain: 0.5 });
  cue(A('e1', /^пиши/) + 0.1, 'sparkle', { gain: 0.5 });
  SHOTS.forEach((s, i) => { if (i) cue(s.t, 'click', { pitch: 0.8 + (i % 5) * 0.08, gain: 0.35 }); cue(s.t + 0.02, 'pop', { pitch: 0.9 + (i % 4) * 0.1, gain: 0.35 }); });

}

  for (let k = 0; k < 14; k++) { const x = hash(k * 5 + i) * W, y = GROUND + 30 + hash(k * 11 + i) * 150;
    if (i % 2) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 8, y - 18); ctx.moveTo(x + 8, y); ctx.lineTo(x + 8, y - 24); ctx.moveTo(x + 16, y); ctx.lineTo(x + 24, y - 16); ctx.stroke(); }
    else { ctx.beginPath(); ctx.ellipse(x, y, 10 + hash(k) * 8, 6, 0, 0, TAU); ctx.stroke(); } }
  ctx.restore();
  // пылинки
  ctx.save();
  for (let k = 0; k < 14; k++) { const x = (hash(k * 13 + i) * W + Math.sin(t * 0.7 + k) * 40), y = ((hash(k * 17) * H) - t * (15 + hash(k) * 25)) % H; ctx.globalAlpha = 0.35; dot(x, (y + H) % H, 3 + hash(k * 2) * 4, dark ? '#fff' : lighten(sh.bg, 0.7)); }
  ctx.restore();
}
function vignette() {
  const g = ctx.createRadialGradient(540, 960, 600, 540, 960, 1250);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.22)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function renderFrame(t) {
  T = t; NID = 0; STEP = Math.floor(t * 8);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  let i = 0; SHOTS.forEach((s, n) => { if (t >= s.t) i = n; });
  const sh = SHOTS[i], t1 = i + 1 < SHOTS.length ? SHOTS[i + 1].t : TL.total;
  CUR_BG = sh.bg; ctx.fillStyle = sh.bg; ctx.fillRect(0, 0, W, H);
  // камера: «толчок» на склейке и медленный наезд с лёгким дрейфом
  const d = t - sh.t, k = inv(sh.t, t1, t);
  const zoom = 1 + 0.045 * easeInOut(k) + 0.07 * Math.exp(-d * 9);
  const dir = i % 2 ? 1 : -1, cx = 540 + dir * 20 * (k - 0.5), cy = 1000;
  ctx.save();
  ctx.translate(540, cy); ctx.scale(zoom, zoom); ctx.rotate(dir * 0.006 * Math.sin(t * 0.8)); ctx.translate(-cx, -cy);
  ambient(sh, i, t, sh.t);
  sh.draw(t, sh.t, t1);
  ctx.restore();
  vignette();
  // белая вспышка на склейке (2 кадра)
  if (i && d < 0.05) { ctx.fillStyle = `rgba(255,255,255,${0.35 * (1 - d / 0.05)})`; ctx.fillRect(0, 0, W, H); }
  NID = 5000;
  drawLabel(sh, t);
  drawBadge(t);
  drawCaptions(t);
}

async function ready() {
  await Promise.all(['700 40px BalsC', '700 40px BalsL'].map(f => document.fonts.load(f)));
  return document.fonts.check('700 40px BalsC');
}
window.setup = setup; window.renderFrame = renderFrame; window.ready = ready;

if (location.search.includes('preview')) {
  fetch('build/timeline.json').then(r => r.json()).then(async tl => {
    await ready(); setup(tl);
    const t0 = performance.now();
    const loop = () => { renderFrame(((performance.now() - t0) / 1000) % tl.total); requestAnimationFrame(loop); };
    loop();
  });
}
</script>
</body>
